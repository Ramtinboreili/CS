<!doctype html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>کتاب تعاملی علوم کامپیوتر — ساختمان داده، پایگاه داده، ریاضیات هوش مصنوعی</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css" onerror="this.remove()">
<style>
:root{--bg:#0f1420;--panel:#171e2e;--panel2:#1d2639;--fg:#e6eaf2;--mut:#93a0b8;--bd:#2a3550;--ac:#5aa9ff;--ac2:#b48cff;--ok:#38c98a;--bad:#ff6b6b;--warn:#f5b74a;--code:#0b1019;--hl:#ffd166;--shadow:0 4px 18px rgba(0,0,0,.25)}
[data-theme=light]{--bg:#f5f7fb;--panel:#fff;--panel2:#eef2f9;--fg:#1b2333;--mut:#5b6882;--bd:#d5ddec;--ac:#1d6fdc;--ac2:#7a4fd6;--ok:#12975f;--bad:#d33b3b;--warn:#b97a0a;--code:#f0f3f9;--hl:#e09b00;--shadow:0 4px 14px rgba(30,50,90,.10)}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.95 "Vazirmatn","Noto Naskh Arabic","Segoe UI",Tahoma,"DejaVu Sans",sans-serif}
a{color:var(--ac)}
#app{display:flex;min-height:100vh}
#side{width:310px;flex:none;background:var(--panel);border-inline-end:1px solid var(--bd);position:sticky;top:0;height:100vh;overflow-y:auto;padding:14px 12px 30px;z-index:30}
.brand{display:flex;align-items:center;gap:10px;padding:4px 6px 12px;font-weight:700;font-size:17px;cursor:pointer}
.brand i{display:grid;place-items:center;width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;font-style:normal;font-size:15px;direction:ltr}
.srch{position:relative;margin-bottom:10px}
.srch input{width:100%;padding:9px 12px;border-radius:10px;border:1px solid var(--bd);background:var(--panel2);color:var(--fg);font:inherit;font-size:14px}
#res{position:absolute;inset-inline:0;top:100%;margin-top:4px;background:var(--panel);border:1px solid var(--bd);border-radius:10px;box-shadow:var(--shadow);max-height:60vh;overflow:auto;z-index:50;display:none}
#res a{display:block;padding:8px 12px;text-decoration:none;color:var(--fg);border-bottom:1px solid var(--bd);font-size:14px;line-height:1.7}
#res a:hover{background:var(--panel2)}#res small{color:var(--mut);display:block}
#res mark{background:transparent;color:var(--hl);font-weight:700}
.nlink{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:8px;text-decoration:none;color:var(--fg);font-size:14px;line-height:1.6;cursor:pointer}
.nlink:hover{background:var(--panel2)}
.nlink.act{background:color-mix(in srgb,var(--ac) 18%,transparent);color:var(--ac);font-weight:700}
.nlink .tick{margin-inline-start:auto;color:var(--ok);font-size:13px}
.nlink .dot{width:7px;height:7px;border-radius:50%;background:var(--bd);flex:none}
.nlink .dot.v{background:var(--warn)}.nlink .dot.d{background:var(--ok)}
details.nm{margin:6px 0;border-radius:10px}
details.nm>summary{cursor:pointer;list-style:none;padding:8px 10px;font-weight:700;border-radius:10px;display:flex;align-items:center;gap:8px;font-size:15px}
details.nm>summary::-webkit-details-marker{display:none}
details.nm>summary:hover{background:var(--panel2)}
details.nm>summary:after{content:"▾";margin-inline-start:auto;color:var(--mut);transition:.2s}
details.nm:not([open])>summary:after{transform:rotate(90deg)}
.mpct{font-size:12px;color:var(--mut);font-weight:400;direction:ltr}
details.ng{margin:2px 0 2px 0;padding-inline-start:8px}
details.ng>summary{cursor:pointer;color:var(--mut);font-size:13px;padding:4px 8px;list-style:none;direction:ltr;text-align:left;font-weight:600}
details.ng>summary::-webkit-details-marker{display:none}
details.ng>summary:before{content:"▸ "}details.ng[open]>summary:before{content:"▾ "}
#main{flex:1;min-width:0}
#top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:10px 22px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--bd)}
#crumb{font-size:13.5px;color:var(--mut);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
#crumb a{color:var(--mut);text-decoration:none;cursor:pointer}#crumb a:hover{color:var(--ac)}
.sp{flex:1}
.ib{border:1px solid var(--bd);background:var(--panel);color:var(--fg);border-radius:10px;padding:6px 11px;cursor:pointer;font:inherit;font-size:14px}
.ib:hover{border-color:var(--ac)}
#burger{display:none}
#view{max-width:980px;margin:0 auto;padding:26px 22px 80px}
h1{font-size:30px;line-height:1.5;margin:6px 0 4px}
h2{font-size:23px;margin:36px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--bd)}
h3{font-size:18.5px;margin:26px 0 6px;color:var(--ac)}
h4{margin:18px 0 4px}
p{margin:10px 0}
li{margin:4px 0}
.en{direction:ltr;unicode-bidi:isolate;display:inline-block;font-family:"Segoe UI",system-ui,sans-serif}
.sub{color:var(--mut);direction:ltr;text-align:right;font-size:15px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.chip{font-size:12.5px;border:1px solid var(--bd);border-radius:20px;padding:1px 11px;color:var(--mut);background:var(--panel);line-height:1.9}
.chip.b1{color:var(--ok);border-color:var(--ok)}.chip.b2{color:var(--warn);border-color:var(--warn)}.chip.b3{color:var(--bad);border-color:var(--bad)}
.card{background:var(--panel);border:1px solid var(--bd);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow)}
.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.callout{border-inline-start:4px solid var(--ac);background:var(--panel);padding:10px 16px;border-radius:10px;margin:14px 0}
.callout.warn{border-color:var(--warn)}.callout.bad{border-color:var(--bad)}.callout.ok{border-color:var(--ok)}
.callout b.t{display:block;margin-bottom:2px}
code{direction:ltr;unicode-bidi:isolate;font-family:"JetBrains Mono","Fira Code",Consolas,monospace;font-size:.88em;background:var(--code);border:1px solid var(--bd);padding:0 5px;border-radius:5px}
pre.code{direction:ltr;text-align:left;background:var(--code);border:1px solid var(--bd);border-radius:12px;padding:14px 16px;overflow:auto;margin:14px 0;line-height:1.65;font-size:13.5px}
pre.code code{border:0;background:none;padding:0;font-size:inherit;white-space:pre}
.k{color:var(--ac2);font-weight:600}.s{color:var(--ok)}.n{color:var(--warn)}.c{color:var(--mut);font-style:italic}
.tex.d{direction:ltr;text-align:center;overflow-x:auto;margin:12px 0;padding:6px 0}
.tex{direction:ltr;unicode-bidi:isolate}.tex.raw{font-family:monospace;color:var(--ac2)}
table.dt{border-collapse:collapse;direction:ltr;font-size:13.5px;margin:8px 0;background:var(--panel)}
table.dt th,table.dt td{border:1px solid var(--bd);padding:4px 10px;text-align:left;white-space:nowrap}
table.dt th{background:var(--panel2)}
table.dt td.nl{color:var(--mut);font-style:italic}
table.dt tr.hl td{background:color-mix(in srgb,var(--hl) 28%,transparent)}
table.dt td.hl{background:color-mix(in srgb,var(--hl) 35%,transparent)}
table.fa{direction:rtl}table.fa th,table.fa td{text-align:right;white-space:normal}
.tw{overflow:auto;max-width:100%}
.btn{border:1px solid var(--bd);background:var(--panel2);color:var(--fg);border-radius:9px;padding:4px 13px;cursor:pointer;font:inherit;font-size:14px;line-height:1.7}
.btn:hover{border-color:var(--ac)}.btn.pri{background:var(--ac);border-color:var(--ac);color:#fff}.btn.on{border-color:var(--ac);color:var(--ac)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.wbox{background:var(--panel);border:1px solid var(--bd);border-radius:14px;margin:20px 0;overflow:hidden;box-shadow:var(--shadow)}
.wbox>.wt{padding:8px 16px;background:var(--panel2);border-bottom:1px solid var(--bd);font-weight:700;font-size:14.5px;display:flex;gap:8px;align-items:center}
.wbox>.wt:before{content:"◈";color:var(--ac)}
.wbox>.wb{padding:12px 16px}
.wn{color:var(--mut);font-size:13.5px;margin:6px 0 0}
.ctl{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:8px 0;font-size:14px}
.ctl label{display:flex;gap:6px;align-items:center;color:var(--mut)}
.ctl input[type=range]{accent-color:var(--ac);width:140px}
.ctl input[type=text],.ctl input[type=number],.ctl select,textarea.in,input.in{background:var(--panel2);color:var(--fg);border:1px solid var(--bd);border-radius:8px;padding:3px 9px;font:inherit;font-size:14px;direction:ltr;max-width:100%}
.ctl input[type=number]{width:80px}
textarea.in{width:100%;font-family:Consolas,monospace;font-size:13.5px;min-height:90px;display:block;direction:ltr;text-align:left;padding:8px 10px}
.stage{direction:ltr;overflow:auto;max-width:100%}
.stage svg,.sv{display:block;max-width:100%;height:auto;margin:auto}
.desc{min-height:26px;padding:6px 10px;border-radius:8px;background:var(--panel2);font-size:14px;margin:6px 0;border-inline-start:3px solid var(--ac)}
.stat{display:flex;gap:16px;flex-wrap:wrap;font-size:13.5px;color:var(--mut);margin:6px 0}.stat b{color:var(--fg);direction:ltr;unicode-bidi:isolate}
canvas.cv{display:block;max-width:100%;border-radius:10px;background:var(--code);border:1px solid var(--bd);touch-action:none}
svg text{font-family:Consolas,"Segoe UI",monospace;fill:var(--fg)}
svg .mut{fill:var(--mut)}
.bar{height:9px;background:var(--panel2);border-radius:6px;overflow:hidden}.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2));transition:width .4s}
.bar.ok>i{background:var(--ok)}
.ex{background:var(--panel);border:1px solid var(--bd);border-radius:14px;padding:14px 18px;margin:14px 0}
.ex.right{border-color:var(--ok)}.ex.wrong{border-color:var(--bad)}
.ex .qh{display:flex;gap:8px;align-items:center;margin-bottom:4px;font-size:13px;color:var(--mut)}
.opt{display:block;width:100%;text-align:right;border:1px solid var(--bd);background:var(--panel2);color:var(--fg);padding:7px 14px;margin:6px 0;border-radius:10px;cursor:pointer;font:inherit;font-size:15px}
.opt:hover{border-color:var(--ac)}.opt.c{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,transparent)}.opt.w{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 16%,transparent)}
.fb{margin-top:8px;padding:10px 14px;border-radius:10px;background:var(--panel2);font-size:15px}
.fb.ok{border-inline-start:4px solid var(--ok)}.fb.no{border-inline-start:4px solid var(--bad)}
.hero{background:linear-gradient(135deg,color-mix(in srgb,var(--ac) 22%,var(--panel)),color-mix(in srgb,var(--ac2) 20%,var(--panel)));border:1px solid var(--bd);border-radius:18px;padding:26px 28px;margin-bottom:20px}
.mcard{cursor:pointer;transition:.2s}.mcard:hover{transform:translateY(-3px);border-color:var(--ac)}
.mcard h3{margin:0 0 4px;color:var(--fg)}
.lnav{display:flex;justify-content:space-between;gap:10px;margin-top:30px;flex-wrap:wrap}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.cell{fill:var(--panel2);stroke:var(--bd)}
.nd{fill:var(--panel2);stroke:var(--ac);stroke-width:2}.nd.hi{fill:var(--hl);stroke:var(--hl)}.nd.ok{fill:var(--ok);stroke:var(--ok)}.nd.bad{fill:var(--bad);stroke:var(--bad)}.nd.pr{fill:var(--ac2);stroke:var(--ac2)}
.nd.hi~text,.nd.ok~text,.nd.bad~text,.nd.pr~text{fill:#111}
.lnk{stroke:var(--mut);stroke-width:1.6;fill:none}
#toast{position:fixed;bottom:20px;inset-inline-start:20px;background:var(--panel);border:1px solid var(--ok);padding:8px 16px;border-radius:10px;box-shadow:var(--shadow);opacity:0;transition:.3s;pointer-events:none;z-index:99;font-size:14px}
#toast.on{opacity:1}
mark.f{background:color-mix(in srgb,var(--hl) 40%,transparent);color:inherit}
@media(max-width:900px){#side{position:fixed;inset-block:0;inset-inline-start:0;transform:translateX(105%);transition:.25s;box-shadow:var(--shadow)}
[dir=rtl] #side{transform:translateX(105%)}body.nav #side{transform:none}#burger{display:inline-block}#view{padding:18px 14px 70px}h1{font-size:24px}#top{padding:8px 12px}}

[dir=ltr] body{font-family:system-ui,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;line-height:1.7}
[dir=ltr] .sub{text-align:left}[dir=ltr] .opt{text-align:left}
[dir=ltr] table.fa{direction:ltr}[dir=ltr] table.fa th,[dir=ltr] table.fa td{text-align:left}
[dir=ltr] #side{inset-inline-start:0}
.lablink{color:var(--ac2)}
.labgrid{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(290px,1fr);gap:16px;align-items:start;margin-top:10px}
.labstage{margin:0;position:sticky;top:64px}.labstage.solved{border-color:var(--ok);box-shadow:0 0 0 2px color-mix(in srgb,var(--ok) 45%,transparent),var(--shadow)}
.labpanel{padding:14px 16px}.labpanel .lp{margin:8px 0}
.ltag{font-size:12.5px;color:var(--ac);font-weight:700;letter-spacing:.04em;margin-bottom:6px}
.big{background:var(--panel2);border-inline-start:4px solid var(--ac2);border-radius:10px;padding:8px 14px;margin:8px 0;font-size:14.5px;line-height:1.85}
.big .bg{display:inline-block;font-size:11.5px;border:1px solid var(--bd);border-radius:12px;padding:0 8px;color:var(--mut);margin-inline-end:4px}
.claim{background:color-mix(in srgb,var(--ac) 10%,var(--panel));border:1px dashed var(--ac);border-radius:10px;padding:6px 12px;margin:8px 0;font-size:14.5px}
.ask{font-weight:700;margin:10px 0 4px}.see{background:var(--panel2);border-radius:10px;padding:6px 12px;margin:8px 0;font-size:14.5px;border-inline-start:3px solid var(--warn)}
.lstep .btn.on{background:var(--ac);color:#fff;border-color:var(--ac)}.lstep .btn.done:not(.on){border-color:var(--ok);color:var(--ok)}
.chal{margin:10px 0;padding:6px 12px;border-radius:10px;border:1px solid var(--bd);font-size:14.5px;color:var(--mut)}.chal.yes{border-color:var(--ok);color:var(--ok);font-weight:700}
.win{margin:8px 0;padding:8px 14px;border-radius:10px;background:color-mix(in srgb,var(--ok) 14%,var(--panel));border-inline-start:4px solid var(--ok);font-size:14.5px}
.hint{margin:6px 0;padding:6px 12px;border-radius:10px;background:var(--panel2);font-size:14.5px;border-inline-start:3px solid var(--warn)}
.lnavb{margin-top:14px;justify-content:space-between}.aha{font-size:15.5px}
.labcard{display:block;text-decoration:none;color:inherit;transition:.2s}.labcard:hover{border-color:var(--ac2);transform:translateY(-2px)}
.labst svg{direction:ltr}.labst svg text{font-size:12px;unicode-bidi:plaintext}.lab-ok{fill:var(--ok)}.lab-bad{fill:var(--bad)}
@media(max-width:900px){.labgrid{grid-template-columns:1fr}.labstage{position:static}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>

<div id="app">
<aside id="side">
 <div class="brand" onclick="location.hash='#/'"><i>CS</i><span>کتاب تعاملی علوم کامپیوتر</span></div>

  <button class="ib" id="langBtn" title="English">EN</button><button class="ib" id="progBtn" title="پیشرفت و یادداشت‌ها">📊 پیشرفت</button><button class="ib" id="themeBtn" title="تغییر تم">☀</button></header>

</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js" defer onerror="window.__nokatex=1"></script>
<script>
/* ===================== LIB 1: Mini SQL engine (pure JS) ===================== */
const SQL=(function(){
const KW=new Set('SELECT FROM WHERE GROUP BY HAVING ORDER LIMIT OFFSET JOIN INNER LEFT RIGHT FULL OUTER CROSS ON AS AND OR NOT IN IS NULL LIKE BETWEEN DISTINCT CASE WHEN THEN ELSE END ASC DESC WITH OVER PARTITION EXISTS INSERT INTO VALUES UPDATE SET DELETE TRUE FALSE'.split(' '));
const AGG=new Set(['COUNT','SUM','AVG','MIN','MAX']);
const WINF=new Set(['ROW_NUMBER','RANK','DENSE_RANK','LAG','LEAD','COUNT','SUM','AVG','MIN','MAX']);
function tokenize(s){const t=[];let i=0;while(i<s.length){const c=s[i];
 if(/\s/.test(c)){i++;continue}
 if(c==='-'&&s[i+1]==='-'){while(i<s.length&&s[i]!=='\n')i++;continue}
 if(/[0-9]/.test(c)){let j=i;while(j<s.length&&/[0-9.]/.test(s[j]))j++;t.push({k:'num',v:parseFloat(s.slice(i,j)),p:i,e:j});i=j;continue}
 if(c==="'"){let j=i+1,v='';while(j<s.length){if(s[j]==="'"){if(s[j+1]==="'"){v+="'";j+=2;continue}break}v+=s[j++]}
  if(j>=s.length)throw new Error('Unterminated string literal');t.push({k:'str',v,p:i,e:j+1});i=j+1;continue}
 if(/[A-Za-z_]/.test(c)){let j=i;while(j<s.length&&/[A-Za-z0-9_]/.test(s[j]))j++;const w=s.slice(i,j);t.push({k:'id',v:w.toLowerCase(),u:w.toUpperCase(),p:i,e:j});i=j;continue}
 const two=s.substr(i,2);if(['<=','>=','<>','!=','||'].includes(two)){t.push({k:'op',v:two==='!='?'<>':two,p:i,e:i+2});i+=2;continue}
 if('=<>+-*/%(),.;'.includes(c)){t.push({k:'op',v:c,p:i,e:i+1});i++;continue}
 throw new Error('Unexpected character: '+c)}
 t.push({k:'eof',p:s.length,e:s.length});return t}

function parse(src){const tk=tokenize(src);let p=0;
 const err=m=>new Error(m+' (near token '+(p+1)+')');
 const kw=u=>tk[p].k==='id'&&tk[p].u===u;
 const acc=u=>kw(u)?(p++,true):false;
 const exp=u=>{if(!acc(u))throw err('Expected '+u)};
 const op=v=>tk[p].k==='op'&&tk[p].v===v;
 const accOp=v=>op(v)?(p++,true):false;
 const expOp=v=>{if(!accOp(v))throw err('Expected "'+v+'"')};
 const ident=()=>{const x=tk[p];if(x.k!=='id'||KW.has(x.u))throw err('Expected identifier');p++;return x.v};
 const isIdent=()=>tk[p].k==='id'&&!KW.has(tk[p].u);
 function statement(){let q;
  if(kw('WITH')||kw('SELECT'))q=query();
  else if(acc('INSERT')){exp('INTO');const t=ident();let cols=null;if(accOp('(')){cols=[];do cols.push(ident());while(accOp(','));expOp(')')}
   exp('VALUES');const rows=[];do{expOp('(');const r=[];do r.push(expr());while(accOp(','));expOp(')');rows.push(r)}while(accOp(','));q={t:'insert',tbl:t,cols,rows}}
  else if(acc('UPDATE')){const t=ident();exp('SET');const sets=[];do{const c=ident();expOp('=');sets.push({c,e:expr()})}while(accOp(','));let w=null;if(acc('WHERE'))w=expr();q={t:'update',tbl:t,sets,where:w}}
  else if(acc('DELETE')){exp('FROM');const t=ident();let w=null;if(acc('WHERE'))w=expr();q={t:'delete',tbl:t,where:w}}
  else throw err('Supported statements: SELECT, WITH, INSERT, UPDATE, DELETE');
  accOp(';');if(tk[p].k!=='eof')throw err('Unexpected trailing input');return q}
 function query(){if(acc('WITH')){const ctes=[];do{const n=ident();exp('AS');expOp('(');const s=query();expOp(')');ctes.push({name:n,q:s})}while(accOp(','));const q=select();q.ctes=ctes;return q}return select()}
 function source(){if(accOp('(')){const sub=query();expOp(')');acc('AS');return{sub,al:ident()}}
  const n=ident();let al=n;if(acc('AS'))al=ident();else if(isIdent())al=ident();return{tbl:n,al}}
 function select(){exp('SELECT');const q={t:'select',items:[],joins:[],ctes:null};q.distinct=acc('DISTINCT');
  do{if(op('*')){p++;q.items.push({e:{t:'star'},txt:'*'})}else{const s=tk[p].p;const e=expr();const en=tk[p-1].e;let al=null;if(acc('AS'))al=ident();else if(isIdent())al=ident();q.items.push({e,al,txt:src.slice(s,en)})}}while(accOp(','));
  if(acc('FROM')){q.from=source();for(;;){let ty=null;
    if(acc('JOIN'))ty='INNER';else if(acc('INNER')){exp('JOIN');ty='INNER'}
    else if(kw('LEFT')||kw('RIGHT')||kw('FULL')){ty=tk[p].u;p++;acc('OUTER');exp('JOIN')}
    else if(acc('CROSS')){exp('JOIN');ty='CROSS'}else if(accOp(','))ty='CROSS';else break;

/* ---------- execution ---------- */
function walk(n,f){if(!n||typeof n!=='object')return;if(Array.isArray(n)){n.forEach(x=>walk(x,f));return}
 if(f(n)===false)return;if(n.t==='sub'||n.t==='exists')return;for(const k in n){if(k==='sub'||k==='q')continue;walk(n[k],f)}}
const hasAgg=e=>{let r=false;walk(e,n=>{if(n.t==='fn'&&AGG.has(n.name)&&!n.over){r=true;return false}});return r};
const collectWin=e=>{const r=[];walk(e,n=>{if(n.t==='fn'&&n.over)r.push(n)});return r};
const cmpv=(a,b)=>a===b?0:(a<b?-1:1);
function cmpNull(a,b){if(a===null&&b===null)return 0;if(a===null)return -1;if(b===null)return 1;return cmpv(a,b)}
function like(s,p){const re=new RegExp('^'+String(p).replace(/[.*+?^${}()|[\]\\]/g,'\\$&').replace(/%/g,'.*').replace(/_/g,'.')+'$','i');return re.test(String(s))}

function run(sqlText,db){const ast=typeof sqlText==='string'?parse(sqlText):sqlText;const st={scanned:0};
 let res;if(ast.t==='select')res=runSelect(ast,db,null,{},st);else res=runDML(ast,db,st);res.scanned=st.scanned;return res}

function getTable(db,name){const t=db.tables[name.toLowerCase()];if(!t)throw new Error('no such table: '+name);return t}
function rowObj(al,cols,r){const o={};cols.forEach((c,i)=>o[al+'.'+c]=r[i]);return o}

function runSelect(q,db,outer,cte,st){
 cte=Object.assign({},cte);
 if(q.ctes)for(const c of q.ctes){const r=runSelect(c.q,db,outer,cte,st);cte[c.name]=r}
 const sources=[];let rows=[{}];
 const load=s=>{let cols,data;if(s.sub){const r=runSelect(s.sub,db,outer,cte,st);cols=r.cols.map(c=>c.toLowerCase());data=r.rows}
  else if(cte[s.tbl]){cols=cte[s.tbl].cols.map(c=>c.toLowerCase());data=cte[s.tbl].rows}
  else{const t=getTable(db,s.tbl);cols=t.cols;data=t.rows;st.scanned+=data.length}
  return{al:s.al,cols,data}};
 if(q.from){const s=load(q.from);sources.push({al:s.al,cols:s.cols});rows=s.data.map(r=>rowObj(s.al,s.cols,r));
  for(const j of q.joins){const s2=load(j.src);const nullR=rowObj(s2.al,s2.cols,s2.cols.map(()=>null));
   const nullL={};sources.forEach(x=>x.cols.forEach(c=>nullL[x.al+'.'+c]=null));
   const right=s2.data.map(r=>rowObj(s2.al,s2.cols,r));const usedR=new Set();const out=[];
   for(const l of rows){let m=false;for(let i=0;i<right.length;i++){const mg=Object.assign({},l,right[i]);
     if(j.type==='CROSS'||ev(j.on,{row:mg,outer,st,db,cte})===true){out.push(mg);m=true;usedR.add(i)}}
    if(!m&&(j.type==='LEFT'||j.type==='FULL'))out.push(Object.assign({},l,nullR))}
   if(j.type==='RIGHT'||j.type==='FULL')right.forEach((r,i)=>{if(!usedR.has(i))out.push(Object.assign({},nullL,r))});
   rows=out;sources.push({al:s2.al,cols:s2.cols})}}
 const mk=r=>({row:r,outer,st,db,cte});
 let units=rows.map(mk);
 if(q.where)units=units.filter(u=>ev(q.where,u)===true);
 const aggQ=q.group||q.items.some(i=>hasAgg(i.e))||(q.having&&hasAgg(q.having))||(q.order&&q.order.some(o=>hasAgg(o.e)));
 if(aggQ){const groups=new Map();
  if(q.group){const ge=q.group.map(g=>{if(g.t==='col'&&!g.tbl){const it=q.items.find(i=>i.al===g.name);if(it)return it.e}return g});for(const u of units){const key=JSON.stringify(ge.map(g=>ev(g,u)));if(!groups.has(key))groups.set(key,[]);groups.get(key).push(u.row)}}
  else groups.set('',units.map(u=>u.row));
  units=[...groups.values()].map(rs=>({row:rs[0]||{},rows:rs,outer,st,db,cte}));
  if(q.having)units=units.filter(u=>ev(q.having,u)===true)}

 const wins=[];q.items.forEach(i=>wins.push(...collectWin(i.e)));if(q.order)q.order.forEach(o=>wins.push(...collectWin(o.e)));
 wins.forEach(w=>computeWindow(w,units));
 // expand select items
 const names=[],getters=[];
 q.items.forEach(it=>{
  if(it.e.t==='star'){const tb=it.e.tbl;sources.forEach(s=>{if(tb&&s.al!==tb)return;s.cols.forEach(c=>{names.push(c);getters.push(u=>u.row[s.al+'.'+c])})});if(tb&&!sources.some(s=>s.al===tb))throw new Error('no such table alias: '+tb)}
  else{names.push(it.al||(it.e.t==='col'?it.e.name:it.txt));getters.push(u=>ev(it.e,u))}});
 let out=units.map(u=>{const vals=getters.map(g=>g(u));return{u,vals}});
 if(q.order){const keyf=(o,rec)=>{ // alias / ordinal support
   if(o.e.t==='lit'&&typeof o.e.v==='number')return rec.vals[o.e.v-1];
   if(o.e.t==='col'&&!o.e.tbl){const ix=q.items.findIndex(i=>i.al===o.e.name);if(ix>=0)return rec.vals[names.indexOf(o.e.name)]}

  const keyed=out.map(r=>({r,k:q.order.map(o=>keyf(o,r))}));

 if(q.distinct){const seen=new Set();rowsOut=rowsOut.filter(r=>{const k=JSON.stringify(r);if(seen.has(k))return false;seen.add(k);return true})}

function computeWindow(w,units){const map=new Map();w._m=map;const part=new Map();
 units.forEach(u=>{const k=JSON.stringify(w.over.part.map(e=>ev(e,u)));if(!part.has(k))part.set(k,[]);part.get(k).push(u)});
 for(const us of part.values()){
  const keys=new Map(us.map(u=>[u,w.over.order.map(o=>ev(o.e,u))]));
  if(w.over.order.length)us.sort((a,b)=>{const ka=keys.get(a),kb=keys.get(b);for(let i=0;i<ka.length;i++){const c=cmpNull(ka[i],kb[i]);if(c)return w.over.order[i].d?-c:c}return 0});
  const same=(a,b)=>JSON.stringify(keys.get(a))===JSON.stringify(keys.get(b));
  us.forEach((u,i)=>{let v;const nm=w.name;
   if(nm==='ROW_NUMBER')v=i+1;
   else if(nm==='RANK'){let j=i;while(j>0&&same(us[j-1],u))j--;v=j+1}
   else if(nm==='DENSE_RANK'){let c=1;for(let j=1;j<=i;j++)if(!same(us[j-1],us[j]))c++;v=c}
   else if(nm==='LAG'||nm==='LEAD'){const off=w.args[1]?ev(w.args[1],u):1;const t=us[nm==='LAG'?i-off:i+off];v=t?ev(w.args[0],t):(w.args[2]?ev(w.args[2],u):null)}
   else{let frame=us;if(w.over.order.length){let e=i;while(e+1<us.length&&same(us[e+1],u))e++;frame=us.slice(0,e+1)}
    v=aggregate(nm,w,frame.map(x=>x.row?x:x),true,u)}
   map.set(u,v)})}}

function aggregate(nm,f,items,isWin,ctx){
 const rowsOf=items.map(x=>x.row?x:{row:x});
 const mkctx=r=>({row:r.row,outer:ctx.outer,st:ctx.st,db:ctx.db,cte:ctx.cte});
 if(nm==='COUNT'&&f.star)return rowsOf.length;
 let vals=rowsOf.map(r=>ev(f.args[0],mkctx(r))).filter(v=>v!==null);
 if(f.distinct)vals=[...new Set(vals)];
 if(nm==='COUNT')return vals.length;
 if(!vals.length)return null;
 if(nm==='SUM')return vals.reduce((a,b)=>a+b,0);
 if(nm==='AVG')return vals.reduce((a,b)=>a+b,0)/vals.length;
 if(nm==='MIN')return vals.reduce((a,b)=>b<a?b:a);

function lookup(e,ctx){let c=ctx;
 while(c){const r=c.row;if(r){if(e.tbl){const k=e.tbl+'.'+e.name;if(k in r)return r[k]}
   else{const hits=Object.keys(r).filter(k=>k.endsWith('.'+e.name)&&k.slice(0,-e.name.length-1).indexOf('.')<0);if(hits.length>1&&!c.outerOnly)throw new Error('ambiguous column: '+e.name);if(hits.length===1)return r[hits[0]]}}
  c=c.outer}

function ev(e,ctx){switch(e.t){
 case'lit':return e.v;
 case'col':return lookup(e,ctx);
 case'un':{const v=ev(e.e,ctx);return v===null?null:-v}
 case'not':{const v=ev(e.e,ctx);return v===null?null:!v}
 case'bin':{const o=e.op;
  if(o==='AND'){const a=ev(e.l,ctx);if(a===false)return false;const b=ev(e.r,ctx);if(b===false)return false;return(a===null||b===null)?null:true}
  if(o==='OR'){const a=ev(e.l,ctx);if(a===true)return true;const b=ev(e.r,ctx);if(b===true)return true;return(a===null||b===null)?null:false}
  const a=ev(e.l,ctx),b=ev(e.r,ctx);if(a===null||b===null)return null;
  switch(o){case'=':return a===b;case'<>':return a!==b;case'<':return a<b;case'>':return a>b;case'<=':return a<=b;case'>=':return a>=b;
   case'+':return a+b;case'-':return a-b;case'*':return a*b;case'/':if(b===0)return null;return a/b;case'%':return a%b;case'||':return String(a)+String(b)}break}
 case'isnull':{const v=ev(e.e,ctx);return e.neg?v!==null:v===null}
 case'between':{const v=ev(e.e,ctx),lo=ev(e.lo,ctx),hi=ev(e.hi,ctx);if(v===null||lo===null||hi===null)return null;const r=v>=lo&&v<=hi;return e.neg?!r:r}
 case'like':{const v=ev(e.e,ctx),p=ev(e.pat,ctx);if(v===null||p===null)return null;const r=like(v,p);return e.neg?!r:r}
 case'in':{const v=ev(e.e,ctx);if(v===null)return null;let vals;
  if(e.sub)vals=runSelect(e.sub,ctx.db,ctx,ctx.cte,ctx.st).rows.map(r=>r[0]);else vals=e.list.map(x=>ev(x,ctx));
  if(vals.includes(v))return e.neg?false:true;if(vals.includes(null))return null;return e.neg?true:false}
 case'exists':{const r=runSelect(e.q,ctx.db,ctx,ctx.cte,ctx.st);return r.rows.length>0}
 case'sub':{const r=runSelect(e.q,ctx.db,ctx,ctx.cte,ctx.st);if(r.rows.length>1)throw new Error('scalar subquery returned more than one row');return r.rows.length?r.rows[0][0]:null}
 case'case':{const b=e.base?ev(e.base,ctx):undefined;for(const[c,v]of e.whens){const cv=ev(c,ctx);if(e.base?cv===b:cv===true)return ev(v,ctx)}return e.els?ev(e.els,ctx):null}

  if(e.over){if(!e._m)throw new Error('window function not allowed here');return e._m.get(ctx)}
  if(AGG.has(nm)){if(!ctx.rows)throw new Error('aggregate function '+nm+' not allowed here');return aggregate(nm,e,ctx.rows,false,ctx)}

  switch(nm){case'ROUND':return a[0]===null?null:Math.round(a[0]*Math.pow(10,a[1]||0))/Math.pow(10,a[1]||0);

/* ---------- DML & constraints ---------- */
function checkRow(db,tn,t,row,skip){
 t.cols.forEach((c,i)=>{if((t.nn||[]).includes(c)&&row[i]===null)throw new Error('NOT NULL constraint failed: '+tn+'.'+c)});
 const keys=[...(t.pk?[t.pk]:[]),...(t.uq||[])];
 for(const k of keys){const ix=k.map(c=>t.cols.indexOf(c));
  if(k===t.pk&&ix.some(i=>row[i]===null))throw new Error('PRIMARY KEY cannot be NULL: '+tn+'.'+k.join(','));
  if(ix.some(i=>row[i]===null))continue;
  t.rows.forEach((r,ri)=>{if(ri===skip)return;if(ix.every(i=>r[i]===row[i]))throw new Error((k===t.pk?'PRIMARY KEY':'UNIQUE')+' constraint failed: duplicate value in '+tn+'('+k.join(',')+')')})}
 for(const fk of t.fk||[]){const v=row[t.cols.indexOf(fk.c)];if(v===null)continue;
  const rt=getTable(db,fk.t);const ci=rt.cols.indexOf(fk.rc);if(!rt.rows.some(r=>r[ci]===v))throw new Error('FOREIGN KEY constraint failed: '+tn+'.'+fk.c+' = '+v+' has no matching row in '+fk.t+'.'+fk.rc)}}
function runDML(a,db,st){const tn=a.tbl;const t=getTable(db,tn);const ctx0={row:{},outer:null,st,db,cte:{}};
 if(a.t==='insert'){const cols=a.cols||t.cols;let n=0;const staged=[];
  for(const vs of a.rows){if(vs.length!==cols.length)throw new Error('column count does not match value count');
   const row=t.cols.map(()=>null);cols.forEach((c,i)=>{const ix=t.cols.indexOf(c);if(ix<0)throw new Error('no such column: '+c);row[ix]=ev(vs[i],ctx0)});
   checkRow(db,tn,t,row,-1);t.rows.push(row);staged.push(row);n++}
  return{cols:[],rows:[],msg:n+' row(s) inserted into '+tn}}
 if(a.t==='update'){let n=0;const upd=[];
  t.rows.forEach((r,ri)=>{const ctx={row:rowObj(tn,t.cols,r),outer:null,st,db,cte:{}};if(!a.where||ev(a.where,ctx)===true){const nr=r.slice();a.sets.forEach(s=>{const ix=t.cols.indexOf(s.c);if(ix<0)throw new Error('no such column: '+s.c);nr[ix]=ev(s.e,ctx)});upd.push([ri,nr])}});
  upd.forEach(([ri,nr])=>{checkRow(db,tn,t,nr,ri)});upd.forEach(([ri,nr])=>{t.rows[ri]=nr;n++});
  return{cols:[],rows:[],msg:n+' row(s) updated in '+tn}}
 if(a.t==='delete'){const keep=[],del=[];
  t.rows.forEach(r=>{const ctx={row:rowObj(tn,t.cols,r),outer:null,st,db,cte:{}};(!a.where||ev(a.where,ctx)===true?del:keep).push(r)});
  for(const on in db.tables){const o=db.tables[on];for(const fk of o.fk||[]){if(fk.t!==tn)continue;const rci=t.cols.indexOf(fk.rc),ci=o.cols.indexOf(fk.c);
    del.forEach(d=>{if(o.rows.some(r=>r[ci]===d[rci]))throw new Error('FOREIGN KEY constraint failed: '+on+'.'+fk.c+' still references '+tn+'.'+fk.rc+' = '+d[rci])})}}
  t.rows=keep;return{cols:[],rows:[],msg:del.length+' row(s) deleted from '+tn}}}

function sameResult(a,b,ordered){const norm=r=>r.map(v=>typeof v==='number'?Math.round(v*1e4)/1e4:v);

W.wal=(el)=>{const EV=[{t:'BEGIN T1'},{t:'T1: UPDATE A 100→150',rec:{lsn:1,tx:'T1',k:'A',old:100,nw:150}},{t:'T1: UPDATE B 200→250',rec:{lsn:2,tx:'T1',k:'B',old:200,nw:250}},{t:'T2: UPDATE C 5→7',rec:{lsn:3,tx:'T2',k:'C',old:5,nw:7}},

 function sim(c){const disk={A:100,B:200,C:5},mem={...disk};let logAll=[],lf=0;for(let i=0;i<c;i++){const e=EV[i];if(e.rec){logAll.push(e.rec);if(!e.rec.commit)mem[e.rec.k]=e.rec.nw}if(e.lf)lf=e.lf;if(e.flush)e.flush.forEach(k=>disk[k]=mem[k])}

  out.append(h('div',{class:'callout ok',html:`<b class="t">بازیابی (ARIES ساده‌شده)</b>۱) Analysis: تراکنش‌های commit‌شده در لاگ = {${r.committed.join(', ')||'—'}} ← بقیه «بازنده» (loser) هستند.<br>۲) Redo: همه‌ی تغییرات لاگ دوباره اعمال می‌شود (Repeating History) ⇒ ${Object.entries(r.redo).map(([k,v])=>k+'='+v).join(' ، ')}<br>۳) Undo: تغییرات تراکنش‌های بازنده با before-image برگردانده می‌شود ${r.undone.length?'('+r.undone.join('؛ ')+')':'(موردی نبود)'}<br><b>وضعیت نهایی: ${Object.entries(r.fin).map(([k,v])=>k+'='+v).join(' ، ')}</b> — فقط اثرات تراکنش‌های commit‌شده باقی مانده است. دوام (Durability) و اتمیک‌بودن (Atomicity) حفظ شد.`}))}

W.mle=(el)=>{let mode='bern';const box=h('div',{class:'stage'}),info=h('div',{class:'callout'});const n=rng('تعداد پرتاب‌ها n',2,100,1,10,draw,v=>v),k=rng('تعداد شیر k',0,100,1,7,draw,v=>v);const ng=rng('تعداد نمونه n',5,300,5,40,()=>{gen();draw()},v=>v);let data=[];const rr=Lib.rng(7);

W.ci=(el)=>{let level=.95;const box=h('div',{class:'stage'}),info=h('div',{class:'callout'});const nn=rng('اندازه نمونه n',5,200,5,25,draw,v=>v);const Z={'.8':1.2816,'.9':1.6449,'.95':1.96,'.99':2.5758};

W.ztest=(el)=>{const m0=0,xb=rng('میانگین مشاهده‌شده x̄',-1,1,.01,.2,draw,v=>fmt(v,2)),n=rng('اندازه نمونه n',1,2000,1,30,draw,v=>v),sg=rng('σ (معلوم)',.5,2,.1,1,draw,v=>fmt(v,1));const box=h('div',{class:'stage'}),info=h('div',{class:'callout'});
 function draw(){const z=(xb.get()-m0)/(sg.get()/Math.sqrt(n.get()));const p=2*(1-Lib.ncdf(Math.abs(z),0,1));box.innerHTML='';const c=chart(600,240,-5,5,0,.45,{l:36});c.axes(10,3);const za=Math.abs(z);c.area(x=>Lib.npdf(x,0,1),-5,Math.max(-5,-Math.min(5,za)),'var(--bad)');c.area(x=>Lib.npdf(x,0,1),Math.min(5,za),5,'var(--bad)');c.path(x=>Lib.npdf(x,0,1),'var(--ac)',-5,5,240);c.line(Math.max(-5,Math.min(5,z)),0,Math.max(-5,Math.min(5,z)),.4,'var(--warn)','5 4',2);box.append(c.svg);
  info.innerHTML=`<b class="t">H₀: μ=0 در برابر H₁: μ≠0 (آزمون z دوطرفه)</b><span class="en">z = (x̄−μ₀)/(σ/√n) = ${fmt(z,3)} ,  p-value = ${p<.0001?p.toExponential(2):fmt(p,4)}</span><br>${p<.05?'✅ در سطح α=0.05 رد H₀ (معنادار آماری).':'❎ شواهد کافی برای رد H₀ نیست (این به معنای اثبات H₀ نیست).'}<br>p-value یعنی: <b>اگر H₀ درست باشد</b>، احتمال دیدن داده‌ای حداقل به این شدت چقدر است. این احتمال درست‌بودن H₀ نیست. توجه: با n بسیار بزرگ، اثرهای ناچیز هم «معنادار» می‌شوند (معناداری آماری ≠ اهمیت عملی). n را افزایش دهید و ببینید.`}

W.corr=(el)=>{let ds='lin';const box=h('div',{class:'stage'}),info=h('div',{class:'callout'});const noise=rng('نویز',.05,1.5,.05,.4,draw,v=>fmt(v,2));let seed=3;
 function gen(){const r=Lib.rng(seed*77),n=40;const xs=[],ys=[];for(let i=0;i<n;i++){let x=(r()*2-1)*2,y;if(ds==='lin')y=x+noise.get()*Lib.randn(r)*1.5;else if(ds==='par')y=x*x+noise.get()*Lib.randn(r)*.8;else if(ds==='out'){y=noise.get()*Lib.randn(r)*1.2;if(i>=n-2){x=2.6;y=4}}else{const c=i%2;x=(c?1.5:-1.5)+Lib.randn(r)*.5;y=(c?1.5:-1.5)+Lib.randn(r)*.5-0*x+ (c?-1:1)*0}xs.push(x);ys.push(y)}return[xs,ys]}
 function draw(){const[xs,ys]=gen();box.innerHTML='';const c=chart(480,320,-3.5,3.5,-3.5,5,{l:30});c.axes(7,6);xs.forEach((x,i)=>c.dot(x,ys[i],3.5,'var(--ac)'));const r=Lib.corr(xs,ys);const mx=Lib.mean(xs),my=Lib.mean(ys);const b=xs.reduce((s,x,i)=>s+(x-mx)*(ys[i]-my),0)/xs.reduce((s,x)=>s+(x-mx)**2,0);c.path(x=>my+b*(x-mx),'var(--warn)',-3.5,3.5,2);box.append(c.svg);
  info.innerHTML=`<b class="t">ضریب همبستگی پیرسون r = ${fmt(r,3)}</b> (r² = ${fmt(r*r,3)})<br>${ds==='par'?'رابطه‌ی قطعیِ y≈x² است ولی r≈۰: همبستگی خطی فقط وابستگی <b>خطی</b> را می‌سنجد.':ds==='out'?'دو نقطه‌ی پرت r را به‌شدت تغییر می‌دهند؛ پیرسون به outlier حساس است.':ds==='clu'?'دو خوشه‌ی جدا، r بزرگ می‌دهد در حالی که داخل هر خوشه رابطه‌ای نیست (پارادوکس سیمپسون).':'همبستگی بالا فقط «هم‌حرکتی» را می‌گوید؛ <b>Correlation ≠ Causation</b> (ممکن است عامل مخدوش‌گر وجود داشته باشد).'}`}
 body_(el,ctl(sel('داده',[{v:'lin',t:'رابطه‌ی خطی'},{v:'par',t:'رابطه‌ی سهمی (غیرخطی)'},{v:'out',t:'خطی + دو نقطه‌ی پرت'},{v:'clu',t:'دو خوشه'}],ds,v=>{ds=v;draw()}),noise,btn('داده‌ی جدید',()=>{seed++;draw()})),box,info);draw()};

W.biasvar=(el,o)=>{let deg=3,lam=-6,seed=1;const box=h('div',{class:'stage'}),box2=h('div',{class:'stage'}),info=h('div',{class:'callout'});const f0=x=>Math.sin(2*Math.PI*x);
 const D=rng('درجه چندجمله‌ای',1,9,1,deg,v=>{deg=v;draw()},v=>v),Lm=rng('log₁₀ λ (ریج)',-8,1,.5,lam,v=>{lam=v;draw()},v=>v<=-8?'0':'10^'+v);
 const mkd=(r,n)=>{const xs=Array.from({length:n},(_,i)=>(i+.5)/n),ys=xs.map(x=>f0(x)+.3*Lib.randn(r));return[xs,ys]};
 function draw(){const r=Lib.rng(seed*13),[xs,ys]=mkd(r,12);const tx=Array.from({length:100},(_,i)=>(i+.5)/100),ty=tx.map(x=>f0(x));const lm=lam<=-8?0:Math.pow(10,lam);const w=Lib.polyfit(xs,ys,deg,lm);
  box.innerHTML='';const c=chart(560,280,0,1,-2,2,{l:30});c.axes(5,4);c.path(f0,'var(--mut)',0,1,100,1.6);c.path(x=>Lib.polyval(w,x),'var(--ok)',0,1,200,2.6);xs.forEach((x,i)=>c.dot(x,ys[i],4,'var(--bad)'));box.append(c.svg);
  const mse=(X,Y,w)=>Lib.mean(X.map((x,i)=>(Lib.polyval(w,x)-Y[i])**2));const tr=mse(xs,ys,w),te=mse(tx,ty,w);
  box2.innerHTML='';const E=[];for(let d=1;d<=9;d++){let a=0,b=0;const R=8;for(let k=0;k<R;k++){const rr=Lib.rng(500+k+seed*99),[x1,y1]=mkd(rr,12);const ww=Lib.polyfit(x1,y1,d,lm);a+=mse(x1,y1,ww);b+=mse(tx,ty,ww)}E.push([a/R,b/R])}
  const mx=Math.min(1.5,Math.max(...E.map(e=>e[1])));const c2=chart(560,200,1,9,0,mx,{l:36});c2.axes(8,3);c2.path(d=>E[Math.max(0,Math.min(8,Math.round(d)-1))][0],'var(--ac)',1,9,8,2.4);c2.path(d=>Math.min(mx,E[Math.max(0,Math.min(8,Math.round(d)-1))][1]),'var(--bad)',1,9,8,2.4);c2.svg.append(sv('text',{x:60,y:18,fill:'var(--ac)','font-size':12},'خطای آموزش'),sv('text',{x:160,y:18,fill:'var(--bad)','font-size':12},'خطای آزمون'));box2.append(c2.svg);
  info.innerHTML=`<b class="t">داده: ۱۲ نقطه نویزی از sin(2πx)</b>خطای آموزش (MSE) = <b>${fmt(tr,3)}</b> ، خطای آزمون = <b>${te>50?'>50':fmt(te,3)}</b><br>${deg<=2&&lm<1e-3?'<b>Underfitting / Bias بالا</b>: مدل برای ساختار داده خیلی ساده است.':deg>=7&&lm<1e-3?'<b>Overfitting / Variance بالا</b>: مدل نویز را حفظ کرده؛ خطای آموزش کم ولی آزمون بزرگ.':'تعادل نسبی میان Bias و Variance.'} ${o.lam?'افزایش λ، ضرایب را کوچک و منحنی را هموارتر می‌کند (Regularization) ← Variance کمتر، کمی Bias بیشتر.':''}<br>نمودار پایین: میانگین خطا روی ۸ نمونه‌ی آموزشی مستقل بر حسب درجه (U-شکل بودن خطای آزمون).`}
 body_(el,ctl(D,Lm,btn('نمونه‌ی جدید',()=>{seed++;draw()})),h('div',{class:'wn'},'خاکستری: تابع واقعی · سبز: برازش · قرمز: داده‌ی آموزشی'),box,box2,info);draw()};

const OF={quad:[(x,y)=>.5*(x*x+8*y*y),(x,y)=>[x,8*y],[-3,3],[-2.6,1.8]],rosen:[(x,y)=>((1-x)**2+8*(y-x*x)**2)/4,(x,y)=>[(-2*(1-x)-32*x*(y-x*x))/4,16*(y-x*x)/4],[-2,2],[-1.5,1.5]],wells:[(x,y)=>(x*x-1)**2+.5*y*y,(x,y)=>[4*x*(x*x-1),y],[-2,2],[.25,1.4]],wave:[(x,y)=>Math.sin(2*x)+Math.cos(2*y)+.1*(x*x+y*y),(x,y)=>[2*Math.cos(2*x)+.2*x,-2*Math.sin(2*y)+.2*y],[-3,3],[2.2,2.2]]};
W.optviz=(el,o)=>{let fk=o.fk||'quad',opt='gd',st=OF[fk][3].slice(),path=[],shown=60;const host=h('div'),info=h('div',{class:'callout'}),lossBox=h('div',{class:'stage'});const k=cv(host,480,480);
 const lrS=rng('log₁₀ η',-3,0,.05,-1.3,run,v=>'η='+fmt(Math.pow(10,v),4)),bS=rng('β (momentum)',0,.99,.01,.9,run,v=>fmt(v,2)),nS=rng('نویز گرادیان (SGD)',0,3,.1,0,run,v=>fmt(v,1)),itS=rng('تعداد گام',5,300,1,60,()=>{shown=itS.get();draw()},v=>v);
 function run(){const[f,gf]=OF[fk];const lr=Math.pow(10,lrS.get()),b=bS.get(),nz=nS.get();let x=st[0],y=st[1],vx=0,vy=0,mx=0,my=0,sx=0,sy=0;path=[[x,y,f(x,y)]];
  for(let t=1;t<=300;t++){let g=gf(x,y);if(nz)g=[g[0]+nz*Lib.randn(Math.random),g[1]+nz*Lib.randn(Math.random)];
   if(opt==='gd'){x-=lr*g[0];y-=lr*g[1]}else if(opt==='mom'){vx=b*vx+g[0];vy=b*vy+g[1];x-=lr*vx;y-=lr*vy}
   else{const b1=.9,b2=.999;mx=b1*mx+(1-b1)*g[0];my=b1*my+(1-b1)*g[1];sx=b2*sx+(1-b2)*g[0]**2;sy=b2*sy+(1-b2)*g[1]**2;const mh=[mx/(1-b1**t),my/(1-b1**t)],sh=[sx/(1-b2**t),sy/(1-b2**t)];x-=lr*mh[0]/(Math.sqrt(sh[0])+1e-8);y-=lr*mh[1]/(Math.sqrt(sh[1])+1e-8)}
   if(!isFinite(x)||!isFinite(y)||Math.abs(x)>1e3||Math.abs(y)>1e3){path.push([NaN,NaN,Infinity]);break}path.push([x,y,f(x,y)])}draw()}
 function draw(){const[f,,rg]=OF[fk];heat(k,f,rg,true);const g=k.g;const X=x=>(x-rg[0])/(rg[1]-rg[0])*480,Y=y=>(rg[1]-y)/(rg[1]-rg[0])*480;const n=Math.min(shown+1,path.length);g.strokeStyle='#fff';g.lineWidth=2;g.beginPath();let div=false;for(let i=0;i<n;i++){const p=path[i];if(!isFinite(p[0])){div=true;break}i?g.lineTo(X(p[0]),Y(p[1])):g.moveTo(X(p[0]),Y(p[1]))}g.stroke();
  for(let i=0;i<n;i+=Math.max(1,Math.floor(n/30))){const p=path[i];if(!isFinite(p[0]))break;g.fillStyle='#fff';g.beginPath();g.arc(X(p[0]),Y(p[1]),2.4,0,7);g.fill()}g.fillStyle='#ffd166';g.beginPath();g.arc(X(st[0]),Y(st[1]),6,0,7);g.fill();const last=path[Math.min(n-1,path.length-1)];if(isFinite(last[0])){g.fillStyle='#38c98a';g.beginPath();g.arc(X(last[0]),Y(last[1]),6,0,7);g.fill()}
  lossBox.innerHTML='';const L=path.slice(0,n).map(p=>p[2]);const finite=L.filter(isFinite);const c=chart(480,150,0,Math.max(5,L.length),0,Math.max(1e-6,...finite)*1.05,{l:46,t:6});c.axes(4,3);c.path(i=>{const v=L[Math.round(i)];return isFinite(v)?v:NaN},'var(--bad)',0,Math.max(1,L.length-1),Math.min(300,L.length*2));lossBox.append(c.svg);
  info.innerHTML=div?'<b>🔴 واگرا شد (Divergence)!</b> نرخ یادگیری برای این تابع بیش از حد بزرگ است.':`گام ${n-1}: موقعیت <span class="en">(${fmt(last[0],3)}, ${fmt(last[1],3)})</span> ، f = <b>${fmt(last[2],4)}</b> — ● زرد: شروع (کلیک کنید تا عوض شود)، ● سبز: موقعیت فعلی.`}
 const c=k.c;c.addEventListener('pointerdown',e=>{const r=c.getBoundingClientRect(),rg=OF[fk][2];st=[rg[0]+(e.clientX-r.left)/r.width*(rg[1]-rg[0]),rg[1]-(e.clientY-r.top)/r.height*(rg[1]-rg[0])];run()});
 body_(el,ctl(sel('تابع زیان',[{v:'quad',t:'درجه ۲ بدشرط (convex)'},{v:'rosen',t:'دره‌ی Rosenbrock'},{v:'wells',t:'دو چاه (non-convex)'},{v:'wave',t:'چند کمینه‌ی موضعی'}],fk,v=>{fk=v;st=OF[v][3].slice();run()}),sel('بهینه‌ساز',[{v:'gd',t:'Gradient Descent'},{v:'mom',t:'Momentum'},{v:'adam',t:'Adam'}],opt,v=>{opt=v;run()})),ctl(lrS,bS,nS,itS),host,lossBox,info,h('div',{class:'wn'},'روی نقشه کلیک کنید تا نقطه‌ی شروع عوض شود. در «دو چاه» شروع از چپ یا راست به کمینه‌های متفاوت می‌رسد: GD تضمین کمینه‌ی سراسری نمی‌دهد. نویز > ۰ شبیه SGD است.'));run()};

W.l1l2=(el)=>{let kind='l1';const host=h('div'),info=h('div',{class:'callout'});const k=cv(host,420,420);const T=rng('شعاع قید t',.1,3,.05,.8,draw,v=>fmt(v,2));const wst=[1.6,.5];const A=[[1,.5],[.5,.8]];
 const f=(x,y)=>{const dx=x-wst[0],dy=y-wst[1];return A[0][0]*dx*dx+2*A[0][1]*dx*dy+A[1][1]*dy*dy};
 function draw(){const R=3,s=420/(2*R);const X=x=>210+x*s,Y=y=>210-y*s;const g=k.g;g.clearRect(0,0,420,420);g.strokeStyle=css('--bd');g.lineWidth=1;g.beginPath();g.moveTo(0,210);g.lineTo(420,210);g.moveTo(210,0);g.lineTo(210,420);g.stroke();
  const t=T.get();let best=null,bv=1e9;for(let i=0;i<4000;i++){const a=i/4000*2*Math.PI;let x,y;if(kind==='l2'){x=t*Math.cos(a);y=t*Math.sin(a)}else{const u=Math.cos(a),v=Math.sin(a),n1=Math.abs(u)+Math.abs(v);x=t*u/n1;y=t*v/n1}const val=f(x,y);if(val<bv){bv=val;best=[x,y]}}
  const unc=f(0,0)<=bv+1e-9&&Math.hypot(...wst)<=t*(kind==='l1'?1:1)&&false;
  g.strokeStyle=css('--mut');g.lineWidth=1.2;[.1,.4,.9,1.6,2.6,4,bv].forEach((lv,i)=>{g.strokeStyle=lv===bv?css('--ok'):css('--bd');g.lineWidth=lv===bv?2.5:1.2;g.beginPath();for(let j=0;j<=200;j++){const a=j/200*2*Math.PI;let lo=0,hi=8;for(let q=0;q<30;q++){const mid=(lo+hi)/2;const px=wst[0]+mid*Math.cos(a),py=wst[1]+mid*Math.sin(a);if(f(px,py)<lv)lo=mid;else hi=mid}const px=wst[0]+lo*Math.cos(a),py=wst[1]+lo*Math.sin(a);j?g.lineTo(X(px),Y(py)):g.moveTo(X(px),Y(py))}g.stroke()});
  g.fillStyle='rgba(180,140,255,.25)';g.strokeStyle=css('--ac2');g.lineWidth=2.5;g.beginPath();if(kind==='l2')g.arc(X(0),Y(0),t*s,0,7);else{g.moveTo(X(t),Y(0));g.lineTo(X(0),Y(t));g.lineTo(X(-t),Y(0));g.lineTo(X(0),Y(-t));g.closePath()}g.fill();g.stroke();
  g.fillStyle=css('--bad');g.beginPath();g.arc(X(wst[0]),Y(wst[1]),5,0,7);g.fill();g.fillStyle=css('--ok');g.beginPath();g.arc(X(best[0]),Y(best[1]),7,0,7);g.fill();
  const sp=Math.abs(best[1])<.015||Math.abs(best[0])<.015;info.innerHTML=`● قرمز: بهینه‌ی بدون قید w* = (${wst}) · ● سبز: جواب مقید <span class="en">w = (${fmt(best[0],3)}, ${fmt(best[1],3)})</span><br>${kind==='l1'?(sp?'<b>جواب روی محور است ⇒ یکی از وزن‌ها دقیقاً صفر شد (Sparsity).</b> گوشه‌های لوزی (L1) احتمال برخورد بیضی‌های تراز با محور را زیاد می‌کنند.':'با این t جواب هنوز روی محور نیفتاده؛ t را کم کنید.'):'دایره (L2) گوشه ندارد: وزن‌ها کوچک می‌شوند اما معمولاً دقیقاً صفر نمی‌شوند (Weight Decay).'}`}
 body_(el,ctl(sel('نوع Regularization',[{v:'l1',t:'L1 (Lasso): ‖w‖₁ ≤ t'},{v:'l2',t:'L2 (Ridge): ‖w‖₂ ≤ t'}],kind,v=>{kind=v;draw()}),T),host,info,h('div',{class:'wn'},'خطوط تراز زیان (بیضی‌ها) تا جایی بزرگ می‌شوند که ناحیه‌ی قید را لمس کنند؛ نقطه‌ی تماس جواب مقید است. این معادل‌ِ هندسیِ جریمه‌ی λ‖w‖ در تابع هدف است.'));draw()};

W.convex=(el)=>{const FN=[['x² (محدب)',x=>x*x],['x⁴ − 3x² + x (نامحدب)',x=>x**4-3*x*x+x],['|x| (محدب، ناهموار)',Math.abs],['sin x (نامحدب)',Math.sin]];let fi=0;const box=h('div',{class:'stage'}),info=h('div',{class:'callout'});const A=rng('نقطه a',-2,2,.05,-1.5,draw),B=rng('نقطه b',-2,2,.05,1.2,draw);
 function draw(){const f=FN[fi][1],a=A.get(),b=B.get();box.innerHTML='';const c=chart(560,280,-2.5,2.5,-4,5,{l:30});c.axes(5,4);c.path(f,'var(--ac)',-2.5,2.5,300);c.line(a,f(a),b,f(b),'var(--warn)',null,2.5);c.dot(a,f(a),5,'var(--warn)');c.dot(b,f(b),5,'var(--warn)');const m=(a+b)/2;c.dot(m,f(m),5,'var(--ok)');c.dot(m,(f(a)+f(b))/2,5,'var(--bad)');box.append(c.svg);

W.tensorshape=(el)=>{let d=[2,3,4];const idx=[1,2,3];const box=h('div'),info=h('div',{class:'callout'});

W.pqcost=(el)=>{const V=rng('تعداد رأس V',10,2000,10,200,draw,v=>v);const box=h('div',{class:'stage'}),info=h('div',{class:'callout'});

W.nntrain=(el)=>{let ds='xor',H=8,lr=.5,net,data=[],tm=null,hist=[],ep=0;const host=h('div'),info=h('div',{class:'stat'}),lbox=h('div',{class:'stage'});const k=cv(host,360,360);const rr=()=>Lib.rng(42);
 const mkData=()=>{const r=Lib.rng(5);data=[];for(let i=0;i<120;i++){let x,y,c;if(ds==='xor'){x=r()*2-1;y=r()*2-1;c=(x*y>0)?1:0}else if(ds==='circle'){x=r()*2-1;y=r()*2-1;c=(x*x+y*y<.45)?1:0}else{c=i%2;x=(c?.5:-.5)+.35*Lib.randn(r);y=(c?.4:-.4)+.35*Lib.randn(r)}data.push([x,y,c])}};
 const init=()=>{const r=Lib.rng(11);net={W1:Array.from({length:H},()=>[Lib.randn(r)*.8,Lib.randn(r)*.8]),b1:Array(H).fill(0),W2:Array.from({length:H},()=>Lib.randn(r)*.8),b2:0};hist=[];ep=0};
 const fwd=(x,y)=>{const a=net.W1.map((w,i)=>Math.tanh(w[0]*x+w[1]*y+net.b1[i]));const z=a.reduce((s,v,i)=>s+v*net.W2[i],net.b2);return{a,p:Lib.sigmoid(z)}};
 const stepGD=()=>{const gW1=net.W1.map(()=>[0,0]),gb1=Array(H).fill(0),gW2=Array(H).fill(0);let gb2=0,loss=0;

  const n=data.length;net.b2-=lr*gb2/n;for(let i=0;i<H;i++){net.W2[i]-=lr*gW2[i]/n;net.W1[i][0]-=lr*gW1[i][0]/n;net.W1[i][1]-=lr*gW1[i][1]/n;net.b1[i]-=lr*gb1[i]/n}hist.push(loss/n);ep++};

  let acc=0;data.forEach(([x,y,c])=>{if((fwd(x,y).p>.5?1:0)===c)acc++});info.innerHTML=`<span>epoch: <b>${ep}</b></span><span>loss (BCE): <b>${hist.length?fmt(hist[hist.length-1],4):'—'}</b></span><span>دقت آموزش: <b>${fmt(acc/data.length*100,1)}٪</b></span>`;
  lbox.innerHTML='';const c=chart(400,120,0,Math.max(50,hist.length),0,Math.max(.7,...hist.slice(0,1))*1.05,{l:40,t:6});c.axes(4,2);if(hist.length>1)c.path(i=>hist[Math.min(hist.length-1,Math.round(i))],'var(--bad)',0,hist.length-1,Math.min(200,hist.length));lbox.append(c.svg)}

W.confusion=(el)=>{const sepS=rng('جدایی دو کلاس (d′)',0,4,.1,2,draw,v=>fmt(v,1)),thS=rng('آستانه‌ی تصمیم',-3,6,.05,1,draw,v=>fmt(v,2)),pvS=rng('شیوع کلاس مثبت',.01,.5,.01,.5,draw,v=>fmt(v*100,0)+'٪');const box=h('div',{class:'stage'}),rocB=h('div',{class:'stage'}),info=h('div');

body:R`
<h2>۱. الگوریتم چیست؟</h2>
<p><b>الگوریتم (Algorithm)</b> دنباله‌ای متناهی و دقیقاً تعریف‌شده از گام‌هاست که یک ورودی را به خروجی مطلوب تبدیل می‌کند. برای اینکه یک روش «الگوریتم» باشد باید پنج ویژگی داشته باشد: <b>ورودی</b>، <b>خروجی</b>، <b>قطعیت</b> (هر گام بدون ابهام)، <b>پایان‌پذیری</b> (پس از تعداد متناهی گام تمام شود) و <b>اجراپذیری</b> (هر گام با منابع واقعی قابل انجام باشد).</p>
<p>دو پرسش متفاوت درباره‌ی هر الگوریتم باید پرسیده شود: (۱) <b>آیا درست است؟</b> یعنی برای هر ورودی معتبر خروجی درست می‌دهد؟ (۲) <b>آیا کارا است؟</b> یعنی چه مقدار زمان و حافظه می‌خواهد و این مقدار با بزرگ‌شدن ورودی چگونه رشد می‌کند؟ این درس درباره‌ی پرسش دوم است. درستی معمولاً با استقرا یا ناوردای حلقه (Loop Invariant) اثبات می‌شود.</p>
<h2>۲. چرا «تحلیل» و نه فقط اندازه‌گیری زمان؟</h2>
<p>اندازه‌گیری زمان اجرا به سخت‌افزار، زبان، کامپایلر و ورودی‌های آزمایشی وابسته است. در تحلیل نظری از <b>مدل RAM</b> استفاده می‌کنیم: هر عمل پایه (جمع، مقایسه، خواندن/نوشتن یک خانه‌ی حافظه) هزینه‌ی واحد دارد و می‌پرسیم تعداد این عملیات چه تابعی از <b>اندازه‌ی ورودی</b> $n$ است. این تابع را $T(n)$ می‌نامیم. هدف، پیش‌بینی <b>رفتار رشد</b> است، نه زمان دقیق به ثانیه.</p>
<h3>مثال: شمارش عملیات</h3>
<pre data-l="py">
def sum_pairs(a):            # n = len(a)
    total = 0                # 1 عمل
    for i in range(n):       # n بار
        for j in range(i+1, n):   # (n-1)+(n-2)+...+0 بار
            total += a[i]*a[j]    # c عمل ثابت
    return total
</pre>
<p>بدنه‌ی حلقه‌ی داخلی دقیقاً $\sum_{i=0}^{n-1}(n-1-i) = \frac{n(n-1)}{2}$ بار اجرا می‌شود. پس $T(n)=c\cdot\frac{n(n-1)}{2}+O(n)$ که از مرتبه‌ی $n^2$ است. توجه کنید که ضریب $\frac12$ و جمله‌های مرتبه‌ی پایین‌تر در رفتار نهایی بی‌اهمیت می‌شوند.</p>
<h2>۳. پیچیدگی مکانی</h2>
<p><b>پیچیدگی مکانی (Space Complexity)</b> مقدار حافظه‌ای است که الگوریتم علاوه بر ورودی مصرف می‌کند (<i>Auxiliary Space</i>). حافظه‌ی پشته‌ی فراخوانی بازگشتی هم حساب می‌شود: یک تابع بازگشتی با عمق $n$ حتی اگر متغیر کمکی نداشته باشد $O(n)$ حافظه می‌خواهد. معمولاً بین زمان و حافظه یک موازنه (Trade-off) وجود دارد؛ مثلاً جدول هش با حافظه‌ی بیشتر، جست‌وجوی سریع‌تر می‌دهد.</p>
<h2>۴. نمادهای مجانبی (Asymptotic Notation)</h2>
<p>فرض کنید $f,g:\mathbb{N}\to\mathbb{R}_{\ge0}$.</p>
$$f(n)=O(g(n))\iff \exists\,c>0,\,n_0:\ \forall n\ge n_0,\ f(n)\le c\,g(n)$$
$$f(n)=\Omega(g(n))\iff \exists\,c>0,\,n_0:\ \forall n\ge n_0,\ f(n)\ge c\,g(n)$$
$$f(n)=\Theta(g(n))\iff f=O(g)\ \text{و}\ f=\Omega(g)$$
<p><b>مثال اثبات:</b> نشان می‌دهیم $3n^2+5n+2=\Theta(n^2)$. برای $n\ge1$ داریم $3n^2\le 3n^2+5n+2\le 3n^2+5n^2+2n^2=10n^2$. پس با $c_1=3$، $c_2=10$ و $n_0=1$ هر دو سو برقرار است.</p>
${co('warn','دقت: Big-O همان «بدترین حالت» یا «زمان اجرا» نیست','$O(g)$ فقط یک <b>کران بالای تابع</b> است و می‌توان آن را برای Best، Average یا Worst Case هر کدام جداگانه به کار برد. جمله‌ی «این الگوریتم $O(n^2)$ است» به‌خودی‌خود نمی‌گوید زمان دقیق چقدر است؛ فقط می‌گوید رشد آن از $n^2$ بیشتر نیست. وقتی کران دقیق می‌خواهیم از $\\Theta$ استفاده می‌کنیم.')}
<h2>۵. Best، Average و Worst Case</h2>
<p>برای ورودی‌هایی با اندازه‌ی یکسان $n$ زمان اجرا می‌تواند متفاوت باشد. <b>Best Case</b> کمینه، <b>Worst Case</b> بیشینه و <b>Average Case</b> امید ریاضی زمان تحت یک توزیع فرضی روی ورودی‌هاست. در جست‌وجوی خطی: بهترین حالت ۱ مقایسه ($\Theta(1)$)، بدترین حالت $n$ مقایسه و میانگین (با فرض یکنواخت‌بودن موقعیت هدف) $\frac{n+1}{2}$ است.</p>
${wd('linsearch','جست‌وجوی خطی: Best / Average / Worst Case')}
<h2>۶. مقایسه‌ی رشد توابع</h2>
<p>ترتیب رشد رایج: $1\ll\log n\ll\sqrt n\ll n\ll n\log n\ll n^2\ll n^3\ll 2^n\ll n!$. جدول و نمودار زیر نشان می‌دهد چرا الگوریتم‌های نمایی فقط برای ورودی‌های بسیار کوچک عملی‌اند.</p>
${wd('cplx','رشد توابع پیچیدگی و زمان تقریبی اجرا')}
<h3>قواعد کاربردی تحلیل کد</h3>
<ul><li><b>ثابت‌ها و جمله‌های کم‌مرتبه حذف می‌شوند:</b> $5n^2+100n+7=\Theta(n^2)$.</li><li><b>دنباله‌ی دستورها:</b> هزینه‌ها جمع می‌شوند و بزرگ‌ترین مرتبه غالب است.</li><li><b>حلقه‌های تودرتو:</b> هزینه‌ها (در حالت مستقل) ضرب می‌شوند.</li><li><b>نیم‌کردن مکرر</b> (مثل Binary Search) تعداد گام‌ها را $\lfloor\log_2 n\rfloor+1$ می‌کند.</li><li>پایه‌ی لگاریتم در نماد مجانبی بی‌اهمیت است: $\log_a n=\Theta(\log_b n)$.</li></ul>
<h2>۷. محدودیت‌های تحلیل مجانبی</h2>
<p>برای $n$ کوچک یا ثابت‌های بزرگ، الگوریتم «بدتر» از نظر مرتبه می‌تواند سریع‌تر باشد (مثلاً Insertion Sort روی آرایه‌ی کوچک از Merge Sort سریع‌تر است؛ به همین دلیل پیاده‌سازی‌های واقعی Sort ترکیبی‌اند). همچنین تحلیل مجانبی اثر حافظه‌ی نهان (Cache)، I/O و موازی‌سازی را مدل نمی‌کند.</p>`,
mis:['«$O(n)$ یعنی دقیقاً n گام.» ← نه؛ یعنی از مرتبه‌ی $n$ و بدون ضرایب ثابت. $100n$ و $n/2$ هر دو $O(n)$ هستند.','«الگوریتم $O(n^2)$ همیشه کندتر از $O(n)$ است.» ← فقط برای $n$ به‌اندازه‌ی کافی بزرگ. برای $n$ کوچک ثابت‌ها تعیین‌کننده‌اند.','«Big-O = بدترین حالت.» ← این دو مفهوم مستقل‌اند؛ $O$ کران تابع است و Worst Case نوعی ورودی است.','«پیچیدگی مکانی یعنی اندازه‌ی ورودی.» ← معمولاً فقط حافظه‌ی کمکی را می‌شماریم.'],

{t:'tf',l:1,q:'اگر الگوریتمی $O(n^2)$ باشد، برای هر ورودی دلخواه از الگوریتمی با $O(n)$ کندتر عمل می‌کند.',a:false,e:'نماد $O$ رفتار مجانبی را توصیف می‌کند و ثابت‌ها را نادیده می‌گیرد. برای $n$ کوچک یا ورودی‌های مساعد، الگوریتم مرتبه‌ی بالاتر می‌تواند سریع‌تر باشد.'},
{t:'num',l:1,q:'برای $n=10$، حلقه‌ی داخلی کد زیر چند بار اجرا می‌شود؟<pre data-l="py">for i in range(1, n+1):\n    for j in range(1, i+1):\n        work()</pre>',a:55,tol:0,e:'تعداد اجرا $\\sum_{i=1}^{n} i=\\frac{n(n+1)}{2}$. برای $n=10$: $\\frac{10\\cdot 11}{2}=55$.'},

{t:'think',l:3,q:'تفاوت «Worst Case» و «$O$» را با یک مثال بنویسید. چرا گفتن «زمان Insertion Sort در بهترین حالت $O(n)$ است» معنادار است؟',a:'Worst Case مشخص می‌کند «کدام ورودی» را بررسی می‌کنیم (ورودی بدترین)، اما $O$ مشخص می‌کند «چه نوع کران» (بالا) را روی تابع زمان به‌دست می‌آوریم. می‌توان برای Best Case هم کران بالا گفت. در Insertion Sort برای ورودی از قبل مرتب، حلقه‌ی داخلی همیشه بلافاصله متوقف می‌شود و $T_{best}(n)=\\Theta(n)$؛ پس «Best Case در $O(n)$ است» یعنی حتی در بهترین ورودی هم رشد بیش از خطی ندارد (و چون $\\Omega(n)$ هم هست، $\\Theta(n)$).'}],

<h2>مسئله</h2>
<p>گاهی یک عمل بیشتر اوقات ارزان و به‌ندرت بسیار گران است. اگر فقط Worst Case همان عمل را بشماریم، بیش از حد بدبین خواهیم بود. <b>تحلیل سرشکن (Amortized Analysis)</b> هزینه‌ی کل یک <b>دنباله</b> از $n$ عمل را در <b>بدترین دنباله</b> می‌سنجد و بر $n$ تقسیم می‌کند. این یک تضمین قطعی برای دنباله‌ی عملیات است، نه تحلیل احتمالاتی.</p>
<h2>مثال اصلی: آرایه‌ی پویا (Dynamic Array)</h2>
<p>وقتی آرایه پر می‌شود، آرایه‌ی جدیدی با ظرفیت دو برابر می‌سازیم و همه‌ی عناصر را کپی می‌کنیم (هزینه‌ی $\Theta(k)$ هنگام کپی $k$ عنصر). push معمولی $\Theta(1)$ است.</p>
<h3>روش Aggregate</h3>
<p>در $n$ عمل push، کپی‌ها در اندازه‌های $1,2,4,\dots,2^{\lfloor\log_2 n\rfloor}$ رخ می‌دهند. مجموع هزینه‌ی کپی‌ها:</p>
$$\sum_{i=0}^{\lfloor\log_2 n\rfloor}2^i<2n$$
<p>بنابراین هزینه‌ی کل $\le n+2n=3n$ و هزینه‌ی سرشکن هر push کمتر از ۳ یعنی $O(1)$ است.</p>
<h3>روش Accounting (حسابداری)</h3>
<p>به هر push هزینه‌ی سرشکن ۳ «سکه» نسبت می‌دهیم: ۱ سکه برای خود درج، ۱ سکه برای کپی‌شدن همین عنصر در رشد بعدی، و ۱ سکه به‌عنوان پس‌انداز برای کپی یکی از عناصر نیمه‌ی قدیمی. وقتی رشد رخ می‌دهد، سکه‌های پس‌انداز هزینه‌ی کپی را می‌پردازند و موجودی هرگز منفی نمی‌شود.</p>
<h3>روش Potential (پتانسیل)</h3>
<p>تابع پتانسیل $\Phi=2\cdot\text{size}-\text{capacity}$ را تعریف می‌کنیم. هزینه‌ی سرشکن عمل $i$ برابر است با $\hat c_i=c_i+\Phi_i-\Phi_{i-1}$. برای push بدون رشد: $\hat c=1+2=3$. برای push همراه رشد (با $k$ عنصر قدیمی): $c=k+1$ و پتانسیل از $2k-k=k$ به $2(k+1)-2k=2$ می‌رسد، پس $\hat c=(k+1)+(2-k)=3$. در هر دو حالت ثابت است.</p>
${wd('dynarr','شبیه‌ساز آرایه‌ی پویا: دو برابر کردن در برابر افزایش ثابت')}
<p>اگر ظرفیت به‌جای ضرب در یک ضریب ثابت، با افزودن مقدار ثابت $c$ رشد کند، تعداد کپی‌ها $\Theta(n/c)$ و مجموع کپی‌ها $\Theta(n^2/c)$ می‌شود؛ پس هزینه‌ی سرشکن $\Theta(n)$ است نه $O(1)$ — دلیل اینکه رشد هندسی (۱٫۵ یا ۲ برابر) استاندارد است.</p>
<h2>کاربردهای دیگر</h2>

<h2>۱. آرایه (Array)</h2>
<p>آرایه دنباله‌ای از عناصر هم‌اندازه است که در یک <b>بلوک پیوسته‌ی حافظه</b> ذخیره می‌شود. اگر آدرس شروع $base$ و اندازه‌ی هر عنصر $s$ باشد، آدرس عنصر $i$ برابر $base+i\cdot s$ است؛ یک ضرب و یک جمع، مستقل از $n$. این همان دلیل <b>دسترسی تصادفی $O(1)$</b> است.</p>
<p>اما درج یا حذف در وسط آرایه باید عناصر بعدی را جابه‌جا کند: $O(n)$. اندازه‌ی آرایه‌ی ایستا هنگام ایجاد ثابت است. <b>آرایه‌ی پویا</b> (مثل <code>list</code> در پایتون، <code>vector</code> در C++ و <code>ArrayList</code> در جاوا) با رشد هندسی ظرفیت، درج در انتها را سرشکن $O(1)$ می‌کند (درس قبل).</p>
<h2>۲. لیست پیوندی (Linked List)</h2>
<p>هر عنصر یک <b>گره (Node)</b> مستقل شامل داده و اشاره‌گر به گره بعدی است؛ گره‌ها می‌توانند در هر جای حافظه باشند.</p>
<pre data-l="py">
class Node:
    def __init__(self, val, nxt=None):
        self.val = val
        self.next = nxt

def insert_head(head, val):      # O(1)
    return Node(val, head)

def search(head, x):             # O(n)
    cur = head
    while cur and cur.val != x:
        cur = cur.next
    return cur

def reverse(head):               # O(n) زمان، O(1) حافظه
    prev = None
    while head:
        head.next, prev, head = prev, head, head.next
    return prev
</pre>
<p>در <b>Doubly Linked List</b> هر گره اشاره‌گر به گره قبلی هم دارد؛ پیمایش در دو جهت و حذف یک گره‌ی معلوم در $O(1)$ ممکن می‌شود، به‌ازای حافظه‌ی بیشتر. حالت <b>Circular</b> انتهای لیست را به ابتدا وصل می‌کند.</p>
${wd('llist','لیست پیوندی: درج، حذف و جست‌وجو (شمارش گام‌ها)')}
<h2>۳. مقایسه</h2>

<h2>۴. Cache Locality؛ چرا در عمل آرایه برنده است؟</h2>
<p>پردازنده داده را به‌صورت <b>خط‌های کش (Cache Line)</b> ۶۴ بایتی می‌خواند. پیمایش آرایه عناصر مجاور را در یک خط کش می‌گیرد (Spatial Locality) و Prefetcher پردازنده جلوتر را می‌خواند. گره‌های لیست پیوندی پراکنده‌اند و هر پرش به گره بعدی ممکن است یک Cache Miss (صدها چرخه) باشد. به همین دلیل در بسیاری از کاربردها حتی درج‌های میانی در آرایه‌ی پویا از لیست پیوندی سریع‌تر است مگر آنکه $n$ بسیار بزرگ باشد.</p>

<h2>ADT و پیاده‌سازی</h2>
<p><b>نوع داده‌ی انتزاعی (ADT)</b> فقط عملیات و رفتار را مشخص می‌کند، نه نحوه‌ی ذخیره‌سازی. Stack، Queue و Deque سه ADT هستند که هر کدام با آرایه‌ی پویا، آرایه‌ی حلقوی یا لیست پیوندی پیاده‌سازی می‌شوند.</p>
<h2>Stack — «آخرین ورودی، اولین خروجی» (LIFO)</h2>
<p>عملیات: <code>push</code>، <code>pop</code>، <code>peek</code>، <code>isEmpty</code>؛ همه $O(1)$ (سرشکن در آرایه‌ی پویا). مانند ظرف‌های روی هم‌چیده‌شده. کاربردها: <b>Call Stack</b> زبان‌ها، Undo/Redo، ارزیابی عبارت postfix، تطبیق پرانتزها و DFS غیربازگشتی.</p>
<pre data-l="py">
def balanced(s):
    pairs = {')':'(', ']':'[', '}':'{'}
    st = []
    for ch in s:
        if ch in '([{':
            st.append(ch)
        elif ch in pairs:
            if not st or st.pop() != pairs[ch]:
                return False
    return not st            # O(n) زمان، O(n) حافظه
</pre>
<h2>Queue — «اولین ورودی، اولین خروجی» (FIFO)</h2>
<p>عملیات: <code>enqueue</code> (انتها)، <code>dequeue</code> (ابتدا). اگر صف را با آرایه‌ی ساده بسازیم و از ابتدا حذف کنیم هزینه $O(n)$ است؛ راه‌حل <b>بافر حلقوی (Circular Buffer)</b> با دو اندیس <code>head</code> و <code>tail</code> و محاسبه‌ی پیمانه‌ای است. کاربردها: BFS، زمان‌بندی پردازش‌ها (Round Robin)، بافر شبکه، صف پیام (Kafka/RabbitMQ).</p>
<pre data-l="py">
class RingQueue:
    def __init__(self, cap):
        self.a = [None]*cap; self.head = 0; self.size = 0
    def enqueue(self, x):
        if self.size == len(self.a): raise OverflowError
        self.a[(self.head + self.size) % len(self.a)] = x
        self.size += 1
    def dequeue(self):
        x = self.a[self.head]
        self.head = (self.head + 1) % len(self.a)
        self.size -= 1
        return x
</pre>
<h2>Deque — صف دوطرفه</h2>
<p>درج و حذف از هر دو سر در $O(1)$. یک الگوی مهم <b>Monotonic Deque</b> برای «بیشینه در پنجره‌ی لغزان» در $O(n)$ است: اندیس‌ها را نگه می‌داریم به‌طوری که مقادیرشان از جلو به عقب نزولی باشد؛ عنصر کوچک‌تر از عنصر جدید از ته حذف می‌شود چون هرگز پاسخ نخواهد بود.</p>

obj:['ساز‌وکار درونی جدول هش و نقش تابع هش را شرح دهید.','Chaining و Open Addressing را مقایسه و Clustering را توضیح دهید.','اثر ضریب بار (Load Factor) و Rehash را بر عملکرد تحلیل کنید.'],
body:R`
<h2>ایده</h2>
<p><b>جدول هش (Hash Table)</b> نگاشتی از کلید به مقدار است که با تبدیل کلید به یک اندیس آرایه، جست‌وجو/درج/حذف را به‌طور میانگین در $O(1)$ انجام می‌دهد. <b>تابع هش</b> $h:\text{Keys}\to\{0,\dots,m-1\}$ کلید را به یکی از $m$ خانه نگاشت می‌کند. چون دامنه‌ی کلیدها بسیار بزرگ‌تر از $m$ است، طبق <b>اصل لانه‌ی کبوتر</b> برخورد (Collision) اجتناب‌ناپذیر است.</p>
<h3>تابع هش خوب</h3>
<ul><li><b>قطعی (Deterministic):</b> یک کلید همیشه یک خروجی بدهد.</li><li><b>توزیع یکنواخت:</b> کلیدها را تقریباً مساوی بین خانه‌ها پخش کند.</li><li><b>سریع:</b> محاسبه‌ی آن ارزان باشد.</li></ul>
<p>مثال رشته: $h(s)=\left(\sum_{i} s_i\cdot 31^{\,len-1-i}\right)\bmod m$ (چندجمله‌ای با پایه‌ی اول). نکته: تابع هشِ جدول هش با تابع هش <i>رمزنگاری</i> (SHA-256) فرق دارد؛ اولی سرعت و پخش مناسب می‌خواهد، دومی مقاومت در برابر برخورد عمدی.</p>
<h2>رفع برخورد</h2>
<h3>۱. Separate Chaining</h3>
<p>هر خانه یک لیست (زنجیره) از کلیدهایی است که به آن خانه می‌رسند. هزینه‌ی جست‌وجو $\Theta(1+\alpha)$ است که $\alpha=n/m$ <b>ضریب بار (Load Factor)</b> است. اگر هش «یکنواخت ساده» باشد و $\alpha=O(1)$، میانگین زمان $O(1)$ است؛ ولی در بدترین حالت (همه‌ی کلیدها در یک خانه) $O(n)$ می‌شود (جاوا ۸+ زنجیره‌های بلند را به درخت متعادل تبدیل می‌کند).</p>
<h3>۲. Open Addressing</h3>
<p>همه‌ی کلیدها داخل خود آرایه‌اند. هنگام برخورد دنباله‌ی «پیمایش» (Probe Sequence) دنبال خانه‌ی خالی می‌گردد: <b>Linear Probing</b> ($h+i$)، <b>Quadratic</b> ($h+i^2$) و <b>Double Hashing</b> ($h_1+i\,h_2$). Linear Probing Cache-friendly است ولی دچار <b>Primary Clustering</b> می‌شود: خوشه‌های پیوسته بزرگ می‌شوند و زمان جست‌وجو با نزدیک‌شدن $\alpha$ به ۱ منفجر می‌شود (میانگین ≈ $\frac12(1+\frac1{(1-\alpha)^2})$ برای جست‌وجوی ناموفق). حذف باید با <b>Tombstone</b> انجام شود، وگرنه زنجیره‌ی پیمایش کلیدهای دیگر می‌شکند.</p>
${wd('hash','شبیه‌ساز جدول هش (Chaining و Linear Probing)')}
<h2>Rehash و تحلیل سرشکن</h2>
<p>وقتی $\alpha$ از آستانه‌ای (مثلاً ۰٫۷۵ در جاوا، ۲/۳ در پایتون) بگذرد، جدول با اندازه‌ی دو برابر ساخته و تمام کلیدها دوباره هش می‌شوند (چون $m$ عوض شده). هزینه‌ی این عملیات $O(n)$ است ولی مانند آرایه‌ی پویا سرشکن $O(1)$ به هر درج می‌رسد.</p>
<h2>کاربردها و محدودیت‌ها</h2>
<ul><li>دیکشنری/نگاشت (<code>dict</code>، <code>HashMap</code>)، مجموعه (<code>set</code>)، شمارش فراوانی، حذف تکراری‌ها، Memoization، کش.</li><li>در پایگاه داده: <b>Hash Join</b> و <b>Hash Index</b> (برای تساوی؛ ولی نه بازه).</li><li>محدودیت: ترتیب کلیدها حفظ نمی‌شود، جست‌وجوی بازه‌ای/کمینه ممکن نیست، و کلیدها باید <i>تغییرناپذیر</i> و دارای <code>equals/hash</code> سازگار باشند.</li></ul>`,
mis:['«جست‌وجو در جدول هش همیشه $O(1)$ است.» ← میانگین با فرض هش مناسب؛ بدترین حالت $O(n)$.','«جدول هش مرتب است.» ← ترتیب بی‌معناست (پایتون ≥ 3.7 ترتیب درج را برای <code>dict</code> نگه می‌دارد ولی این ربطی به مرتب‌بودن کلیدها ندارد).','«با حذف کلید در Open Addressing خانه را خالی کنید.» ← باید Tombstone گذاشت.'],
ex:[{t:'mcq',l:1,q:'ضریب بار (Load Factor) جدول هش چگونه تعریف می‌شود؟',o:['$m/n$','$n/m$','$n\\cdot m$','$\\log n$'],a:1,e:'$\\alpha=n/m$: تعداد کلیدها تقسیم بر تعداد خانه‌ها.'},
{t:'num',l:1,q:'با $h(k)=k\\bmod 7$ و Linear Probing، کلیدهای 15، 22 و 8 را به‌ترتیب در جدول خالی درج می‌کنیم. کلید 8 در کدام اندیس قرار می‌گیرد؟',a:3,tol:0,e:'$15\\bmod7=1$ ⇒ خانه ۱. $22\\bmod7=1$ برخورد ⇒ خانه ۲. $8\\bmod7=1$ برخورد با ۱ و ۲ ⇒ خانه ۳.'},
{t:'tf',l:2,q:'در Open Addressing با Linear Probing، حذف یک کلید با خالی‌کردن خانه‌اش همیشه بی‌خطر است.',a:false,e:'اگر کلید دیگری با برخورد بعد از آن قرار گرفته باشد، جست‌وجوی آن به خانه‌ی خالی می‌رسد و اشتباهاً «یافت نشد» می‌گوید. از Tombstone استفاده می‌شود.'},
{t:'mcq',l:2,q:'مزیت اصلی Chaining نسبت به Open Addressing چیست؟',o:['Cache Locality بهتر','عملکرد پایدارتر وقتی $\\alpha>1$ می‌شود','حافظه‌ی کمتر','نیاز نداشتن به تابع هش'],a:1,e:'در Chaining ضریب بار می‌تواند از ۱ بیشتر شود و فقط خطی کند می‌شود؛ ولی Open Addressing با $\\alpha\\to1$ بسیار کند یا پر می‌شود.'},
{t:'think',l:3,q:'چرا اندازه‌ی جدول هش معمولاً عدد اول یا توانی از ۲ همراه با مخلوط‌کردن بیت‌ها انتخاب می‌شود؟ و اگر کلیدها مضربی از $m$ باشند با $h=k\\bmod m$ چه رخ می‌دهد؟',a:'اگر $m$ با الگوی کلیدها عامل مشترک داشته باشد (مثلاً کلیدها مضرب ۱۰ و $m=100$)، فقط بخشی از خانه‌ها استفاده می‌شود و برخوردها زیاد می‌شود. اعداد اول عامل مشترک کمتری با الگوهای رایج دارند. توان ۲ محاسبه را با AND بیتی سریع می‌کند ولی فقط بیت‌های پایین کلید را می‌بیند؛ پس باید تابع هش بیت‌ها را خوب مخلوط کند (Mixing/Finalizer).'}],
sum:['جدول هش با تابع هش، جست‌وجو/درج/حذف را به‌طور میانگین $O(1)$ می‌کند؛ بدترین حالت $O(n)$.','برخورد اجتناب‌ناپذیر است؛ Chaining و Open Addressing دو راه اصلی‌اند.','ضریب بار $\\alpha$ و Rehash عملکرد را کنترل می‌کنند؛ Rehash سرشکن $O(1)$ است.','جدول هش ترتیب و جست‌وجوی بازه‌ای ندارد.']});

LESSONS.push({id:'a3-1',mod:'A',g:'A3',t:'درخت‌ها: BST، AVL و Red-Black',en:'Trees: Binary Trees, BST, AVL & Red-Black',lvl:2,min:50,pre:['a2-1','a1-1'],kw:'tree binary search tree bst avl red black rotation traversal inorder preorder postorder height balanced',
obj:['اصطلاحات درخت (ریشه، برگ، عمق، ارتفاع) و پیمایش‌های سه‌گانه را بدانید.','عملیات BST را همراه با مشکل درخت منحط تحلیل کنید.','با چرخش‌های AVL و ویژگی‌های Red-Black، تعادل را توضیح دهید.'],
body:R`
<h2>۱. درخت دودویی</h2>
<p><b>درخت</b> ساختاری سلسله‌مراتبی از گره‌هاست: یک <b>ریشه (Root)</b>، هر گره حداکثر یک والد و صفر یا چند فرزند؛ گره بدون فرزند <b>برگ</b> است. <b>عمق</b> گره = تعداد یال تا ریشه؛ <b>ارتفاع</b> درخت = بیشینه‌ی عمق. در <b>درخت دودویی</b> هر گره حداکثر دو فرزند (چپ/راست) دارد. یک درخت دودویی با ارتفاع $h$ حداکثر $2^{h+1}-1$ گره دارد؛ پس درخت «پُر» با $n$ گره ارتفاع $\log_2 n$ دارد.</p>
<h3>پیمایش‌ها (Traversals)</h3>
<ul><li><b>Preorder</b> (ریشه، چپ، راست): مناسب کپی/سریال‌سازی درخت.</li><li><b>Inorder</b> (چپ، ریشه، راست): در BST کلیدها را <b>مرتب</b> برمی‌گرداند.</li><li><b>Postorder</b> (چپ، راست، ریشه): مناسب حذف درخت و محاسبه‌ی اندازه‌ی زیردرخت‌ها.</li><li><b>Level-order</b>: با صف (BFS).</li></ul>
<p>همه $\Theta(n)$ هستند. پیمایش بازگشتی عمق پشته‌ای برابر ارتفاع می‌خواهد.</p>
<h2>۲. درخت جست‌وجوی دودویی (BST)</h2>
<p>ویژگی: برای هر گره، همه‌ی کلیدهای زیردرخت چپ <b>کوچک‌تر</b> و همه‌ی کلیدهای زیردرخت راست <b>بزرگ‌تر</b> از آن‌اند. جست‌وجو و درج با مقایسه‌ی کلید و رفتن به چپ یا راست، هزینه‌ای متناسب با <b>ارتفاع</b> دارند: $O(h)$. حذف سه حالت دارد: برگ (مستقیم حذف)، یک فرزند (جایگزینی با فرزند)، دو فرزند (جایگزینی با <i>جانشین Inorder</i> = کوچک‌ترین عنصر زیردرخت راست و سپس حذف آن).</p>
<pre data-l="py">
def insert(node, key):
    if node is None: return Node(key)
    if key < node.key:  node.left  = insert(node.left,  key)
    elif key > node.key: node.right = insert(node.right, key)
    return node               # O(h)
</pre>
<p><b>مشکل:</b> اگر کلیدها مرتب درج شوند، BST به یک لیست پیوندی با ارتفاع $n$ تبدیل می‌شود و همه‌ی عملیات $O(n)$ می‌شوند. برای BST تصادفی ارتفاع مورد انتظار $O(\log n)$ است، اما به ورودی تضمین نمی‌توان کرد. راه‌حل: <b>درخت‌های خودمتعادل</b>.</p>
${wd('tree','BST تعاملی: درج، حذف، جست‌وجو و پیمایش‌های متحرک',{mode:'bst'})}
<h2>۳. درخت AVL</h2>
<p><b>ضریب تعادل (Balance Factor)</b> هر گره: $bf=h(\text{left})-h(\text{right})$. در AVL باید برای همه‌ی گره‌ها $bf\in\{-1,0,1\}$ باشد. پس از درج/حذف اگر $|bf|=2$ شد، با <b>چرخش (Rotation)</b> درخت تعدیل می‌شود:</p>
${ft(['حالت','شرط','اصلاح'],[['LL','نامتعادل چپ‌-چپ','یک چرخش راست'],['RR','نامتعادل راست‌-راست','یک چرخش چپ'],['LR','نامتعادل چپ‌-راست','چرخش چپ روی فرزند چپ، سپس چرخش راست'],['RL','نامتعادل راست‌-چپ','چرخش راست روی فرزند راست، سپس چرخش چپ']])}
<p>ارتفاع AVL با $n$ گره حداکثر $1.44\log_2 n$ است (اثبات با دنباله‌ی شبه‌فیبوناچی تعداد کمینه‌ی گره‌ها)، پس جست‌وجو/درج/حذف همه $O(\log n)$ هستند و هر درج حداکثر ۲ چرخش دارد.</p>
${wd('tree','AVL تعاملی: ضریب تعادل و چرخش‌ها',{mode:'avl'})}
<h2>۴. درخت Red-Black</h2>
<p>درخت دودویی جست‌وجو با رنگ‌آمیزی گره‌ها (قرمز/سیاه) که پنج ویژگی را حفظ می‌کند: (۱) هر گره قرمز یا سیاه است؛ (۲) ریشه سیاه است؛ (۳) برگ‌های NIL سیاه‌اند؛ (۴) <b>فرزند هر گره قرمز، سیاه است</b>؛ (۵) تعداد گره‌های سیاه روی هر مسیر ریشه تا NIL یکسان است (Black-Height). نتیجه: طولانی‌ترین مسیر حداکثر دو برابر کوتاه‌ترین است و ارتفاع $\le 2\log_2(n+1)$.</p>
${wd('rbcheck','بررسی‌گر ویژگی‌های Red-Black')}

mis:['«BST همیشه $O(\\log n)$ است.» ← فقط اگر متعادل باشد؛ در بدترین حالت $O(n)$.','«Inorder روی هر درخت دودویی مرتب‌شده را می‌دهد.» ← فقط روی BST.','«درخت Red-Black همیشه سریع‌تر از AVL است.» ← بسته به بار کاری؛ AVL برای جست‌وجوی زیاد بهتر است.'],

<h2>۱. هیپ دودویی (Binary Heap)</h2>
<p><b>هیپ</b> یک <b>درخت دودویی کامل</b> (همه‌ی سطح‌ها پر به‌جز احتمالاً آخر که از چپ پر می‌شود) با «ویژگی هیپ» است: در <b>Min-Heap</b> هر گره از فرزندانش کوچک‌تر یا مساوی است (در Max-Heap برعکس). چون درخت کامل است، می‌توان آن را بدون اشاره‌گر در آرایه ذخیره کرد (با اندیس صفر):</p>
$$parent(i)=\left\lfloor\frac{i-1}{2}\right\rfloor,\quad left(i)=2i+1,\quad right(i)=2i+2$$
<ul><li><b>insert:</b> افزودن در انتهای آرایه و <b>sift-up</b> (جابه‌جایی با والد تا برقراری شرط): $O(\log n)$.</li><li><b>extract-min:</b> جایگزینی ریشه با آخرین عنصر، حذف انتها و <b>sift-down</b> با فرزند کوچک‌تر: $O(\log n)$.</li><li><b>peek-min:</b> $O(1)$.</li><li><b>جست‌وجوی کلید دلخواه:</b> $O(n)$ — هیپ برای جست‌وجو طراحی نشده.</li></ul>
${wd('heap','هیپ تعاملی با انیمیشن sift-up / sift-down')}
<h3>Build-Heap در $O(n)$</h3>
<p>ساخت هیپ از $n$ عنصر با sift-down از آخرین والد تا ریشه، نه $O(n\log n)$ بلکه $O(n)$ است: حدود نیمی از گره‌ها برگ‌اند (هزینه ۰)، $n/4$ گره حداکثر ۱ جابه‌جایی، $n/8$ گره حداکثر ۲ و ...</p>
$$T(n)\le\sum_{h=0}^{\lfloor\log n\rfloor}\left\lceil\frac{n}{2^{h+1}}\right\rceil O(h)=O\!\left(n\sum_{h\ge0}\frac{h}{2^{h}}\right)=O(2n)=O(n)$$
<h3>صف اولویت (Priority Queue)</h3>
<p>ADT با عملیات <code>insert(x, priority)</code> و <code>extractMin/Max</code>. هیپ رایج‌ترین پیاده‌سازی است. کاربردها: Dijkstra و Prim، زمان‌بندی وظایف، <b>Top-K</b> (هیپ اندازه‌ی $k$ در $O(n\log k)$)، ادغام $k$ لیست مرتب، شبیه‌سازی رویداد‌گسسته، Heap Sort.</p>
<pre data-l="py">
import heapq
def top_k(nums, k):                 # k بزرگ‌ترین‌ها در O(n log k)
    h = []
    for x in nums:
        heapq.heappush(h, x)
        if len(h) > k: heapq.heappop(h)   # کوچک‌ترین را بیرون بینداز
    return sorted(h, reverse=True)
</pre>
<h2>۲. Trie (درخت پیشوندی)</h2>
<p>Trie درختی است که هر یال یک کاراکتر است و مسیر ریشه تا یک گره، یک <b>پیشوند</b> را نشان می‌دهد. گره‌ی علامت‌خورده یعنی کلمه‌ای در همان‌جا پایان می‌یابد. درج، جست‌وجو و بررسی پیشوند $O(L)$ هستند که $L$ طول کلید است و به تعداد کل کلمات بستگی ندارد.</p>
<pre data-l="py">
class TrieNode:
    def __init__(self): self.kids = {}; self.end = False
def insert(root, w):
    n = root
    for c in w:
        n = n.kids.setdefault(c, TrieNode())
    n.end = True
def starts_with(root, p):
    n = root
    for c in p:
        if c not in n.kids: return None
        n = n.kids[c]
    return n          # از اینجا همه‌ی کلمات زیردرخت = Autocomplete
</pre>

body:R`
<h2>تعریف</h2>
<p>گراف $G=(V,E)$ مجموعه‌ای از <b>رأس‌ها (Vertices)</b> و <b>یال‌ها (Edges)</b> است. در <b>گراف بدون جهت</b> یال $\{u,v\}$ دوطرفه است؛ در <b>گراف جهت‌دار</b> یال $(u\to v)$ یک‌طرفه است. در <b>گراف وزن‌دار</b> هر یال یک عدد (هزینه، فاصله، ظرفیت) دارد. مفاهیم پایه:</p>
<ul><li><b>درجه (Degree):</b> تعداد یال‌های متصل به رأس؛ در گراف جهت‌دار درجه‌ی ورودی و خروجی.</li><li><b>مسیر (Path):</b> دنباله‌ی رأس‌هایی که هر دو متوالی با یال به هم وصل‌اند؛ <b>دور (Cycle)</b> مسیری که به رأس شروع برمی‌گردد.</li><li><b>همبند (Connected)</b> بودن: میان هر دو رأس مسیری هست. در جهت‌دار: <i>قویاً همبند (SCC)</i>.</li><li><b>DAG:</b> گراف جهت‌دار بدون دور؛ مدل وابستگی وظایف، Build Systemها و گراف محاسباتی شبکه‌های عصبی.</li><li>گراف <b>تُنُک (Sparse)</b>: $|E|\approx|V|$؛ گراف <b>چگال (Dense)</b>: $|E|\approx|V|^2$.</li></ul>
<p>در گراف ساده‌ی بدون جهت: $\sum_v \deg(v)=2|E|$ (لم دست‌دهی) و $|E|\le\frac{|V|(|V|-1)}{2}$.</p>
<h2>نمایش گراف</h2>
${ft(['نمایش','حافظه','بررسی وجود یال $(u,v)$','پیمایش همسایه‌های $u$','مناسب برای'],[['Adjacency List','$\\Theta(V+E)$','$O(\\deg u)$','$O(\\deg u)$','گراف‌های تُنُک (اغلب جهان واقعی)'],['Adjacency Matrix','$\\Theta(V^2)$','$O(1)$','$O(V)$','گراف‌های چگال، Floyd-Warshall، ضرب ماتریسی'],['Edge List','$\\Theta(E)$','$O(E)$','$O(E)$','Kruskal، Bellman-Ford، ورودی/خروجی']])}

<p>یک شبکه‌ی اجتماعی با میلیون‌ها کاربر که هر کس چند صد دوست دارد، به‌شدت تُنُک است؛ ماتریس مجاورت آن ($10^{12}$ خانه) غیرممکن اما لیست مجاورت عملی است. در مقابل، در شبکه‌ی عصبی یا ماتریس شباهت، ماتریس گاهی طبیعی‌تر است. نمایش <b>ماتریس تُنُک (Sparse Matrix: CSR/COO)</b> پلی میان این دو دنیاست.</p>

from collections import defaultdict
g = defaultdict(list)               # Adjacency List
for u, v, w in [('A','B',4), ('A','C',2), ('B','C',1)]:

obj:['Binary Search را با ناوردای حلقه به‌درستی پیاده‌سازی کنید و خطاهای رایج آن را بشناسید.','Merge Sort، Quick Sort و Heap Sort را مقایسه کنید (زمان، حافظه، پایداری).','کران پایین $\\Omega(n\\log n)$ مرتب‌سازی مقایسه‌ای را توضیح دهید.'],
body:R`
<h2>۱. جست‌وجو</h2>
<p><b>جست‌وجوی خطی</b> روی داده‌ی نامرتب $O(n)$ است. اگر آرایه <b>مرتب</b> باشد، <b>جست‌وجوی دودویی (Binary Search)</b> با هر مقایسه نیمی از بازه را حذف می‌کند: $T(n)=T(n/2)+O(1)\Rightarrow O(\log n)$.</p>
<pre data-l="py">
def binary_search(a, t):
    lo, hi = 0, len(a) - 1
    while lo <= hi:                  # ناوردا: اگر t در a باشد، در a[lo..hi] است
        mid = lo + (hi - lo) // 2    # نه (lo+hi)//2 ؛ جلوگیری از سرریز در زبان‌های با عدد ثابت
        if a[mid] == t: return mid
        if a[mid] < t:  lo = mid + 1
        else:           hi = mid - 1
    return -1
</pre>
${wd('bsearch','Binary Search گام‌به‌گام')}
<p>خطاهای رایج: <code>lo &lt; hi</code> به‌جای <code>lo &lt;= hi</code> (از دست‌دادن عنصر آخر)، به‌روزرسانی <code>lo = mid</code> (حلقه‌ی بی‌نهایت)، فراموش‌کردن شرط مرتب‌بودن ورودی. تعمیم‌ها: lower_bound/upper_bound و «Binary Search روی پاسخ» (مثلاً کمینه‌ی ظرفیتی که شرط را برقرار کند).</p>
<h2>۲. مرتب‌سازی</h2>
<p>ویژگی‌های مهم: <b>پایدار (Stable)</b> یعنی عناصر مساوی ترتیب نسبی اولیه‌شان را حفظ کنند (برای مرتب‌سازی چندکلیدی لازم است)؛ <b>درجا (In-place)</b> یعنی حافظه‌ی کمکی $O(1)$ یا $O(\log n)$.</p>

<h3>Merge Sort</h3>
<p>آرایه را نصف می‌کند، هر نیمه را بازگشتی مرتب می‌کند و دو نیمه‌ی مرتب را در $O(n)$ ادغام می‌کند: $T(n)=2T(n/2)+\Theta(n)\Rightarrow\Theta(n\log n)$ در همه‌ی حالات.</p>
<pre data-l="py">
def merge_sort(a):
    if len(a) <= 1: return a
    m = len(a)//2
    L, R = merge_sort(a[:m]), merge_sort(a[m:])
    out, i, j = [], 0, 0
    while i < len(L) and j < len(R):
        if L[i] <= R[j]: out.append(L[i]); i += 1    # &lt;= برای پایداری
        else:            out.append(R[j]); j += 1
    return out + L[i:] + R[j:]
</pre>
<h3>Quick Sort</h3>
<p>یک <b>pivot</b> انتخاب می‌کند، آرایه را به «کوچک‌تر» و «بزرگ‌تر» افراز (Partition) می‌کند و دو بخش را بازگشتی مرتب می‌کند. اگر pivot همیشه نزدیک میانه باشد $T(n)=2T(n/2)+\Theta(n)$ و $\Theta(n\log n)$؛ اگر همیشه کوچک‌ترین/بزرگ‌ترین باشد (مثلاً آرایه‌ی مرتب با pivot آخر) $T(n)=T(n-1)+\Theta(n)=\Theta(n^2)$. با pivot تصادفی یا میانه‌ی سه‌تایی، امید ریاضی زمان $O(n\log n)$ است.</p>

<h2>مفهوم</h2>
<p>پیمایش گراف یعنی بازدید منظم از همه‌ی رأس‌های قابل‌دسترس از یک رأس شروع. برای جلوگیری از چرخش بی‌نهایت در دورها، مجموعه‌ی <b>visited</b> نگه می‌داریم. تفاوت BFS و DFS فقط در ساختار داده‌ی «مرز بازدید» است: <b>صف (FIFO)</b> یا <b>پشته (LIFO)</b>.</p>
<h2>BFS — جست‌وجوی سطح‌اول</h2>
<pre data-l="py">
from collections import deque
def bfs(g, s):
    dist = {s: 0}; q = deque([s])
    while q:
        u = q.popleft()
        for v in g[u]:
            if v not in dist:          # علامت‌گذاری هنگام ورود به صف
                dist[v] = dist[u] + 1
                q.append(v)
    return dist                        # زمان O(V+E)، حافظه O(V)
</pre>
<p>BFS رأس‌ها را به‌ترتیب فاصله (تعداد یال) از مبدأ می‌بیند؛ پس در <b>گراف بدون وزن</b> کوتاه‌ترین مسیر را می‌دهد. دلیل درستی: صف همیشه رأس‌هایی با فاصله‌ی $d$ را قبل از $d+1$ دارد (ناوردا).</p>
<h2>DFS — جست‌وجوی عمق‌اول</h2>
<pre data-l="py">
def dfs(g, u, seen, order):
    seen.add(u)
    for v in g[u]:
        if v not in seen:
            dfs(g, v, seen, order)
    order.append(u)                   # پس‌ترتیب (post-order): پایان کار u
</pre>
<p>DFS تا جای ممکن عمیق می‌رود و سپس برمی‌گردد (Backtrack). با ثبت زمان ورود/خروج هر رأس، انواع یال (درخت، پشتی، رو‌به‌جلو، متقاطع) طبقه‌بندی می‌شوند؛ وجود <b>یال پشتی (Back Edge)</b> یعنی دور. معکوس پس‌ترتیب DFS روی یک DAG یک <b>Topological Order</b> است.</p>

body:R`
<h2>Relaxation</h2>
<p>همه‌ی الگوریتم‌های این بخش بر عملیات <b>Relax</b> تکیه دارند: اگر رسیدن به $v$ از طریق $u$ ارزان‌تر باشد، فاصله‌ی ثبت‌شده را بهبود می‌دهیم:</p>
$$\text{if } d[u]+w(u,v)<d[v]:\ d[v]\leftarrow d[u]+w(u,v),\ \pi[v]\leftarrow u$$
<p>تفاوت الگوریتم‌ها در «ترتیب» و «تعداد دفعات» Relax است.</p>
<h2>Dijkstra — منبع واحد، وزن نامنفی</h2>
<p>یک <b>الگوریتم حریصانه</b>: همیشه نزدیک‌ترین رأس تثبیت‌نشده را برمی‌دارد، قطعی می‌کند و یال‌هایش را Relax می‌کند. دلیل درستی: با وزن‌های نامنفی، کوتاه‌ترین مسیر به رأسی که الان کمترین $d$ را دارد نمی‌تواند از مسیری که از رأس تثبیت‌نشده‌ی دیگری بگذرد کوتاه‌تر باشد. اگر یال منفی باشد این استدلال می‌شکند.</p>
<pre data-l="py">
import heapq
def dijkstra(g, s):
    dist = {s: 0}; pq = [(0, s)]
    while pq:
        d, u = heapq.heappop(pq)
        if d > dist.get(u, float('inf')): continue    # ورودی کهنه (Lazy Deletion)
        for v, w in g[u]:
            nd = d + w
            if nd < dist.get(v, float('inf')):
                dist[v] = nd; heapq.heappush(pq, (nd, v))
    return dist
</pre>
<p>پیچیدگی: با آرایه $O(V^2)$؛ با هیپ دودویی $O((V+E)\log V)$؛ با هیپ فیبوناچی $O(E+V\log V)$. انتخاب ساختار داده‌ی صف اولویت، پیچیدگی الگوریتم را تغییر می‌دهد.</p>
<h2>Bellman-Ford — یال منفی و تشخیص دور منفی</h2>
<p>$V-1$ بار همه‌ی یال‌ها را Relax می‌کند. چون کوتاه‌ترین مسیر ساده حداکثر $V-1$ یال دارد، پس از $V-1$ دور فاصله‌ها نهایی‌اند. اگر در دور $V$ام هنوز بهبودی رخ دهد، یک <b>دور منفی</b> قابل‌دسترس وجود دارد و کوتاه‌ترین مسیر تعریف نشده (می‌توان تا $-\infty$ کم کرد). پیچیدگی $O(VE)$ است.</p>
${wd('graphalgo','Dijkstra و Bellman-Ford روی گراف نمونه (Bellman-Ford روی گراف جهت‌دار با وزن منفی)',{algos:['dijkstra','bellman']})}
<h2>Floyd-Warshall — همه‌ی جفت‌ها</h2>
<p>یک الگوریتم <b>برنامه‌ریزی پویا</b>: فرض کنید $D^{(k)}_{ij}$ کوتاه‌ترین مسیر $i\to j$ باشد که رأس‌های میانی‌اش فقط از $\{1..k\}$ هستند. آنگاه:</p>
$$D^{(k)}_{ij}=\min\left(D^{(k-1)}_{ij},\ D^{(k-1)}_{ik}+D^{(k-1)}_{kj}\right)$$
<p>یعنی یا مسیر از $k$ نمی‌گذرد، یا از $k$ می‌گذرد و به دو زیرمسئله‌ی کوچک‌تر تقسیم می‌شود. سه حلقه‌ی تودرتو: $\Theta(V^3)$ زمان و $\Theta(V^2)$ حافظه (بروزرسانی درجا). وزن منفی مجاز است (بدون دور منفی؛ اگر $D_{ii}<0$ شد دور منفی هست).</p>
${wd('floyd','Floyd-Warshall: ماتریس فاصله در هر مرحله k')}
