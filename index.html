LESSONS.push({id:'a5-1',mod:'A',g:'A5',t:'بازگشت، تقسیم و حل و Memoization',en:'Recursion, Divide & Conquer, Memoization',lvl:2,min:45,pre:['a1-1','a2-2'],kw:'recursion divide and conquer master theorem memoization fibonacci call stack recurrence',
obj:['ساختار تابع بازگشتی (حالت پایه و گام بازگشتی) و Call Stack را توضیح دهید.','رابطه‌ی بازگشتی را بنویسید و با قضیه‌ی اصلی (Master Theorem) حل کنید.','Memoization را برای حذف محاسبات تکراری به کار ببرید.'],
body:R`
<h2>بازگشت (Recursion)</h2>
<p>یک تابع <b>بازگشتی</b> مسئله را به نمونه‌های کوچک‌تر از <i>همان مسئله</i> کاهش می‌دهد. هر راه‌حل بازگشتی باید دو بخش داشته باشد: <b>حالت پایه</b> (بدون فراخوانی بازگشتی تمام می‌شود) و <b>گام بازگشتی</b> که حتماً به حالت پایه نزدیک می‌شود. در غیر این صورت یا بی‌نهایت اجرا یا Stack Overflow رخ می‌دهد. برای اثبات درستی از <b>استقرا</b> استفاده می‌شود.</p>
<pre data-l="py">
def power(x, n):                 # x^n با تقسیم و حل: O(log n)
    if n == 0: return 1
    half = power(x, n // 2)
    return half*half if n % 2 == 0 else half*half*x
</pre>
<p>هر فراخوانی یک قاب روی Call Stack دارد؛ پیچیدگی مکانی بازگشت حداقل برابر <i>عمق</i> بازگشت است. <b>Tail Recursion</b> (فراخوانی بازگشتی آخرین کار تابع باشد) در زبان‌هایی که بهینه‌سازی دم دارند به حلقه تبدیل می‌شود (پایتون ندارد).</p>
<h2>تقسیم و حل (Divide & Conquer)</h2>
<p>سه گام: <b>Divide</b> (تقسیم به زیرمسئله‌های مستقل)، <b>Conquer</b> (حل بازگشتی) و <b>Combine</b> (ترکیب پاسخ‌ها). نمونه‌ها: Merge Sort، Quick Sort، Binary Search، ضرب Karatsuba، Strassen، نزدیک‌ترین جفت نقاط. رابطه‌ی بازگشتی استاندارد:</p>
$$T(n)=a\,T\!\left(\frac nb\right)+f(n)$$
<p>$a$ زیرمسئله‌ی هر کدام با اندازه‌ی $n/b$ و هزینه‌ی تقسیم/ترکیب $f(n)=\Theta(n^d)$. <b>قضیه‌ی اصلی</b> (برای $f(n)=\Theta(n^d)$) با مقایسه‌ی $d$ و $\log_b a$:</p>
${ft(['حالت','شرط','نتیجه','شهود'],[['۱','$d<\\log_b a$','$\\Theta(n^{\\log_b a})$','هزینه‌ی برگ‌ها غالب است'],['۲','$d=\\log_b a$','$\\Theta(n^d\\log n)$','هر سطر درخت هزینه‌ی برابر دارد'],['۳','$d>\\log_b a$','$\\Theta(n^d)$','هزینه‌ی ریشه غالب است (با شرط regularity)']])}
${wd('master','ماشین‌حساب قضیه‌ی اصلی')}
<h2>Memoization</h2>
<p>وقتی زیرمسئله‌ها <b>همپوشان</b> باشند (مثل فیبوناچی)، حل ساده‌ی بازگشتی یک زیرمسئله را بارها محاسبه می‌کند و زمان نمایی می‌شود. <b>Memoization</b> نتیجه‌ی هر زیرمسئله را در یک جدول (معمولاً dict) نگه می‌دارد و دفعات بعد مستقیماً برمی‌گرداند؛ زمان به تعداد زیرمسئله‌های متمایز × هزینه‌ی هر کدام کاهش می‌یابد.</p>
<pre data-l="py">
from functools import lru_cache
@lru_cache(maxsize=None)
def fib(n):                       # O(n) زمان و حافظه  (بدون کش: Θ(φ^n))
    return n if n < 2 else fib(n-1) + fib(n-2)
</pre>
${wd('fibtree','درخت فراخوانی fib(n) بدون و با Memoization')}
${co('note','Memoization در برابر Divide & Conquer','D&C زیرمسئله‌های <b>مستقل</b> دارد (Merge Sort)، پس حافظه‌ی نهان فایده‌ای ندارد. Memoization/DP وقتی مفید است که زیرمسئله‌ها <b>تکرار</b> شوند.')}`,
mis:['«بازگشت همیشه از حلقه کندتر و بدتر است.» ← گاهی ذاتی مسئله است (درخت، Backtracking)؛ مهم رعایت عمق و هزینه‌هاست.','«Memoization حافظه‌ی اضافه نمی‌خواهد.» ← جدول کش و پشته‌ی بازگشت هر دو حافظه می‌برند.','فراموش‌کردن حالت پایه یا نزدیک‌نشدن به آن.'],
ex:[{t:'num',l:1,q:'$T(n)=2T(n/2)+n$ با قضیه‌ی اصلی: مقدار $\\log_b a$ چند است؟ (به‌ازای $a=2,b=2$)',a:1,tol:0,e:'$\\log_2 2=1$ و $d=1$ ⇒ حالت ۲: $\\Theta(n\\log n)$ (Merge Sort).'},
{t:'mcq',l:2,q:'$T(n)=T(n/2)+1$ (جست‌وجوی دودویی) برابر است با:',o:['$\\Theta(n)$','$\\Theta(\\log n)$','$\\Theta(n\\log n)$','$\\Theta(1)$'],a:1,e:'$a=1,b=2,d=0$؛ $\\log_2 1=0=d$ ⇒ حالت ۲: $\\Theta(n^0\\log n)=\\Theta(\\log n)$.'},
{t:'num',l:2,q:'fib(20) با روش بازگشتی ساده و بدون کش، حدوداً چند بار تابع را فراخوانی می‌کند؟ (ماشین‌حساب ویجت‌ها را ببینید.)',a:21891,tol:0,e:'تعداد فراخوانی‌ها $2F(n+1)-1=2\\cdot10946-1=21891$. با memoization فقط ۳۹ فراخوانی لازم است.'},
{t:'mcq',l:3,q:'$T(n)=3T(n/2)+n$ کدام است؟',o:['$\\Theta(n\\log n)$','$\\Theta(n^{\\log_2 3})\\approx n^{1.585}$','$\\Theta(n^2)$','$\\Theta(n)$'],a:1,e:'$\\log_2 3\\approx1.585>d=1$ ⇒ حالت ۱: $\\Theta(n^{\\log_2 3})$ (Karatsuba).'},
{t:'think',l:3,q:'نشان دهید چرا fib بازگشتیِ ساده نمایی است (رابطه‌ی بازگشتی تعداد فراخوانی‌ها).',a:'تعداد فراخوانی‌ها $C(n)=C(n-1)+C(n-2)+1$ با $C(0)=C(1)=1$. این همان دنباله‌ی فیبوناچی است و $C(n)=\\Theta(\\varphi^n)$ که $\\varphi=\\frac{1+\\sqrt5}{2}\\approx1.618$. یعنی هر $n\\to n+1$ حدود ۶۲٪ کار بیشتر؛ رشد نمایی، چون fib($n-2$) بارها دوباره محاسبه می‌شود.'}],
sum:['بازگشت = حالت پایه + گام کاهنده؛ عمق بازگشت پیچیدگی مکانی را تعیین می‌کند.','Divide & Conquer با رابطه‌ی $T(n)=aT(n/b)+f(n)$ و قضیه‌ی اصلی تحلیل می‌شود.','Memoization زیرمسئله‌های همپوشان را فقط یک‌بار حل می‌کند و نمایی را به چندجمله‌ای می‌رساند.']});

LESSONS.push({id:'a5-2',mod:'A',g:'A5',t:'الگوریتم حریصانه و برنامه‌ریزی پویا (Tabulation)',en:'Greedy Algorithms & Dynamic Programming',lvl:3,min:60,pre:['a5-1'],kw:'greedy dynamic programming dp tabulation lcs knapsack coin change optimal substructure overlapping subproblems',
obj:['ویژگی‌های Greedy Choice و Optimal Substructure را بررسی کنید.','مسائل DP را با تعریف حالت، رابطه‌ی بازگشتی و ترتیب پر کردن جدول حل کنید.','Greedy و DP را روی مسئله‌ی سکه مقایسه و LCS را محاسبه کنید.'],
body:R`
<h2>الگوریتم حریصانه (Greedy)</h2>
<p>الگوریتم حریصانه در هر گام «بهترین انتخاب محلی» را می‌کند و هرگز پشیمان نمی‌شود. درستی آن مشروط به دو ویژگی است: <b>Greedy Choice Property</b> (یک انتخاب محلی بهینه در یک جواب بهینه‌ی سراسری جا دارد) و <b>Optimal Substructure</b>. اثبات معمولاً با <i>Exchange Argument</i> است: هر جواب بهینه را می‌توان بدون بدتر شدن به جوابی تبدیل کرد که انتخاب حریصانه را دارد.</p>
<p><b>مثال: انتخاب فعالیت (Interval Scheduling)</b>: برای بیشترین تعداد بازه‌ی ناهم‌پوشان، بازه‌ها را بر اساس زمان <i>پایان</i> مرتب و هر بار زودترین‌پایان سازگار را انتخاب کن. زمان $O(n\log n)$. (مرتب‌سازی بر اساس زمان شروع یا کوتاه‌ترین طول <b>غلط</b> است.) مثال‌های دیگر: Huffman، Kruskal/Prim، Dijkstra.</p>
${co('warn','Greedy همیشه درست نیست','برای سکه‌های $\\{1,3,4\\}$ و مبلغ ۶: حریصانه ۴+۱+۱ (۳ سکه) می‌دهد ولی پاسخ بهینه ۳+۳ (۲ سکه) است. در سیستم‌های سکه‌ی «متعارف» مثل $\\{1,5,10,25\\}$ حریصانه بهینه است.')}
${wd('coin','حریصانه در برابر DP در مسئله‌ی سکه')}
<h2>برنامه‌ریزی پویا (Dynamic Programming)</h2>
<p>DP برای مسائلی است که (۱) <b>زیرساخت بهینه</b> دارند: جواب بهینه از جواب‌های بهینه‌ی زیرمسئله‌ها ساخته می‌شود؛ و (۲) <b>زیرمسئله‌های همپوشان</b> دارند. دو سبک پیاده‌سازی:</p>
<ul><li><b>Top-Down (Memoization):</b> بازگشتی + کش؛ فقط زیرمسئله‌های لازم را می‌سازد.</li><li><b>Bottom-Up (Tabulation):</b> جدول را از حالت‌های کوچک به بزرگ پر می‌کند؛ بدون سربار بازگشت و امکان کاهش حافظه (نگه‌داشتن فقط سطر قبلی).</li></ul>
<h3>روش حل یک مسئله‌ی DP</h3>
<ol><li><b>حالت (State)</b> را تعریف کن: $dp[i][j]$ دقیقاً چه معنایی دارد؟</li><li><b>رابطه‌ی بازگشتی (Transition)</b> را بنویس.</li><li><b>حالت‌های پایه</b> را مشخص کن.</li><li><b>ترتیب پر کردن</b> را طوری انتخاب کن که وابستگی‌ها قبلاً محاسبه شده باشند.</li><li>پاسخ را از جدول بخوان (و در صورت نیاز با Traceback بازسازی کن).</li></ol>
<h3>مثال ۱: مسئله‌ی سکه (کمینه‌ی تعداد)</h3>
$$dp[x]=\min_{c\in coins,\ c\le x}\left(dp[x-c]+1\right),\quad dp[0]=0$$
<p>زمان $O(x\cdot|coins|)$ و حافظه $O(x)$.</p>
<h3>مثال ۲: بزرگ‌ترین زیردنباله‌ی مشترک (LCS)</h3>
<p>$dp[i][j]$ = طول LCS پیشوندهای $X[1..i]$ و $Y[1..j]$:</p>
$$dp[i][j]=\begin{cases}dp[i-1][j-1]+1 & X_i=Y_j\\ \max(dp[i-1][j],\,dp[i][j-1]) & X_i\ne Y_j\end{cases}$$
${wd('lcs','پر کردن جدول LCS و Traceback')}
<h3>مثال ۳: کوله‌پشتی ۰/۱</h3>
<p>$dp[i][w]$ = بیشینه‌ی ارزش با $i$ شیء اول و ظرفیت $w$: $dp[i][w]=\max(dp[i-1][w],\ dp[i-1][w-w_i]+v_i)$ (اگر $w_i\le w$). زمان $O(nW)$ — این <b>شبه‌چندجمله‌ای</b> است زیرا $W$ مقدار عددی است نه طول ورودی؛ مسئله NP-سخت است.</p>
<pre data-l="py">
def knapsack(W, wt, val):
    dp = [0]*(W+1)
    for i in range(len(wt)):
        for w in range(W, wt[i]-1, -1):      # معکوس: هر شیء یک‌بار (۰/۱)
            dp[w] = max(dp[w], dp[w-wt[i]] + val[i])
    return dp[W]                              # حافظه O(W)
</pre>`,
mis:['«هر مسئله‌ی بهینه‌سازی را می‌توان حریصانه حل کرد.» ← فقط با Greedy Choice Property؛ مثال نقض: سکه‌ی {1,3,4}.','«DP یعنی استفاده از آرایه‌ی دوبعدی.» ← DP یک <i>روش</i> است؛ جدول فقط ابزار آن است.','«DP همیشه چندجمله‌ای است.» ← کوله‌پشتی $O(nW)$ شبه‌چندجمله‌ای است.'],
ex:[{t:'mcq',l:1,q:'در Interval Scheduling حریصانه، بازه‌ها بر اساس چه چیزی مرتب می‌شوند؟',o:['زمان شروع','زمان پایان','طول بازه','تصادفی'],a:1,e:'مرتب‌سازی بر اساس زمان پایان و انتخاب زودترین پایان سازگار بهینه است (Exchange Argument).'},
{t:'num',l:2,q:'برای سکه‌های {1,3,4} و مبلغ ۶، کمینه‌ی تعداد سکه با DP چند است؟',a:2,tol:0,e:'$dp[6]=\\min(dp[5],dp[3],dp[2])+1$؛ $dp[3]=1$ پس $dp[6]=2$ (۳+۳).'},
{t:'num',l:2,q:'طول LCS رشته‌های "ABCBDAB" و "BDCABA" چند است؟',a:4,tol:0,e:'برای نمونه "BCBA" (یا "BDAB") با طول ۴؛ جدول در ویجت LCS همین مقدار را می‌دهد.'},
{t:'tf',l:2,q:'در کوله‌پشتی ۰/۱ با آرایه‌ی یک‌بعدی، باید ظرفیت را از کوچک به بزرگ پیمایش کرد.',a:false,e:'باید از بزرگ به کوچک پیمایش شود تا هر شیء حداکثر یک‌بار استفاده شود؛ پیمایش صعودی حالت کوله‌پشتی نامحدود (Unbounded) می‌دهد.'},
{t:'think',l:3,q:'چگونه از دو ویژگی DP تشخیص می‌دهید یک مسئله با Greedy قابل‌حل است یا نیاز به DP دارد؟ برای مسئله‌ی سکه استدلال کنید.',a:'Greedy نیاز دارد انتخاب محلی هرگز راه را برای جواب سراسری نبندد. در سکه‌های {1,3,4} انتخاب ۴ برای ۶ جواب بهینه را از بین می‌برد (چون باقی‌مانده‌ی ۲ فقط با ۱+۱ پر می‌شود)، پس ویژگی انتخاب حریصانه نقض است. DP همه‌ی گزینه‌های آخرین سکه را امتحان می‌کند ($\\min_c dp[x-c]+1$) و از Optimal Substructure و تکرار زیرمسئله‌ها بهره می‌برد. در سیستم‌های متعارف (هر سکه مضرب سکه‌ی کوچک‌تر یا دارای خاصیت ویژه) می‌توان اثبات کرد Greedy درست است.'}],
sum:['Greedy: انتخاب محلی + اثبات Exchange Argument؛ ساده و سریع ولی گاهی نادرست.','DP: حالت، رابطه‌ی بازگشتی، پایه، ترتیب پر کردن؛ Top-Down (Memoization) و Bottom-Up (Tabulation).','LCS در $O(mn)$؛ کوله‌پشتی ۰/۱ در $O(nW)$ شبه‌چندجمله‌ای.']});

LESSONS.push({id:'a5-3',mod:'A',g:'A5',t:'Backtracking',en:'Backtracking',lvl:3,min:35,pre:['a5-1'],kw:'backtracking n queens permutations subsets pruning state space tree constraint',
obj:['فضای حالت را به‌صورت درخت مدل و با هرس (Pruning) جست‌وجو را کوچک کنید.','قالب کلی Backtracking را برای مسائل ترکیبیاتی پیاده‌سازی کنید.','تفاوت Backtracking با Brute Force و DP را بیان کنید.'],

<h2>ایده</h2>
<p><b>Backtracking</b> جست‌وجوی عمق‌اول در <b>درخت فضای حالت</b> است: جواب را گام‌به‌گام می‌سازیم، و اگر یک جواب جزئی نقض محدودیت‌ها را نشان داد، بدون ادامه‌ی آن شاخه، به گام قبل برمی‌گردیم (<b>هرس</b>). نتیجه: هنوز در بدترین حالت نمایی است ولی در عمل بسیاری از شاخه‌ها هرگز دیده نمی‌شوند.</p>
<h3>قالب کلی</h3>
<pre data-l="py">
def solve(state, choices):
    if is_complete(state):
        record(state); return
    for c in choices(state):
        if is_valid(state, c):          # هرس: فقط انتخاب‌های سازگار
            apply(state, c)             # انتخاب (choose)
            solve(state, choices)       # بررسی (explore)
            undo(state, c)              # بازگردانی (un-choose)  ← قلب Backtracking
</pre>
<h3>مثال: همه‌ی زیرمجموعه‌ها و جایگشت‌ها</h3>
<pre data-l="py">
def permutations(a):
    res, cur, used = [], [], [False]*len(a)
    def go():
        if len(cur) == len(a): res.append(cur[:]); return
        for i in range(len(a)):
            if not used[i]:
                used[i] = True; cur.append(a[i])
                go()
                cur.pop(); used[i] = False
    go(); return res                    # n! جواب ⇒ Θ(n·n!)
</pre>
<h3>مثال کلاسیک: مسئله‌ی N-Queens</h3>
<p>$N$ وزیر را روی صفحه‌ی $N\times N$ طوری بگذارید که هیچ‌دو در یک سطر، ستون یا قطر نباشند. در هر سطر یک ملکه می‌گذاریم و اگر ستونی با ملکه‌های قبلی در تضاد بود امتحانش نمی‌کنیم. بدون هرس $N^N$ حالت داریم؛ با هرس برای $N=6$ فقط حدود ۹۰۰ خانه امتحان می‌شود (به‌جای $6^6=46656$).</p>
${wd('queens','N-Queens: انیمیشن جست‌وجو، هرس و بازگشت')}
<h2>Backtracking، Brute Force و DP</h2>
${ft(['روش','ایده','وقتی مناسب است'],[['Brute Force','همه‌ی حالت‌ها را بدون هرس بررسی می‌کند','فضای کوچک'],['Backtracking','حالت‌ها را تدریجی می‌سازد و شاخه‌های نامعتبر را هرس می‌کند','مسائل ارضای محدودیت (Sudoku، N-Queens، رنگ‌آمیزی گراف)'],['DP','زیرمسئله‌های همپوشان را ذخیره می‌کند','وقتی حالت‌ها تکراری‌اند و حالت فشرده است']])}
<p>بهبودها: ترتیب‌دهی هوشمند انتخاب‌ها (Most Constrained Variable)، Forward Checking، Branch & Bound برای بهینه‌سازی (کران بالا/پایین برای هرس).</p>`,

sum:['Backtracking = DFS در درخت فضای حالت + هرس شاخه‌های نامعتبر + بازگردانی حالت.','N-Queens، جایگشت، زیرمجموعه و Sudoku مثال‌های رایج‌اند.','در بدترین حالت نمایی است؛ هرس و ترتیب‌دهی هوشمند عملکرد را بهبود می‌دهد.']});

body:R`
<h2>درخت پوشای کمینه (MST)</h2>
<p>برای یک گراف همبند و وزن‌دار بدون جهت، <b>درخت پوشا</b> زیرمجموعه‌ای از یال‌هاست که همه‌ی رأس‌ها را بدون دور به هم وصل می‌کند ($V-1$ یال). <b>MST</b> درخت پوشا با کمترین مجموع وزن است. کاربرد: طراحی شبکه (کابل‌کشی/لوله‌کشی با کمترین هزینه)، خوشه‌بندی سلسله‌مراتبی. دو قضیه‌ی کلیدی: <b>خاصیت برش (Cut Property)</b>: سبک‌ترین یالی که یک برش را قطع می‌کند در یک MST هست؛ و <b>خاصیت دور</b>: سنگین‌ترین یال هر دور (با وزن‌های متمایز) در هیچ MST نیست.</p>
<h3>Kruskal</h3>
<p>یال‌ها را صعودی مرتب کن؛ هر یال را اگر دو سرش در مؤلفه‌های متفاوت باشند (دور نسازد) بپذیر. تشخیص دور با <b>Union-Find</b>. زمان: $O(E\log E)$ (مرتب‌سازی غالب است).</p>
${wd('kruskal','Kruskal روی گراف نمونه')}
<h3>Prim</h3>
<p>از یک رأس شروع می‌کند و هر بار سبک‌ترین یالی که درخت فعلی را به یک رأس جدید وصل می‌کند اضافه می‌کند (مانند Dijkstra با صف اولویت): $O(E\log V)$. برای گراف چگال Prim با ماتریس/هیپ و برای گراف تُنُک Kruskal معمولاً ساده‌تر است.</p>
<h2>Union-Find (Disjoint Set Union)</h2>
<p>دو عمل: <code>find(x)</code> نماینده‌ی مجموعه‌ی $x$ و <code>union(x,y)</code> ادغام دو مجموعه. با دو بهینه‌سازی <b>Path Compression</b> و <b>Union by Rank/Size</b>، هزینه‌ی سرشکن هر عمل $O(\alpha(n))$ است که $\alpha$ وارون تابع آکرمن و برای هر $n$ عملی کمتر از ۵ است — در عمل ثابت.</p>
<pre data-l="py">
class DSU:
    def __init__(self, n): self.p = list(range(n)); self.sz = [1]*n
    def find(self, x):
        while self.p[x] != x:
            self.p[x] = self.p[self.p[x]]     # Path Halving
            x = self.p[x]
        return x
    def union(self, a, b):
        a, b = self.find(a), self.find(b)
        if a == b: return False               # دور
        if self.sz[a] < self.sz[b]: a, b = b, a
        self.p[b] = a; self.sz[a] += self.sz[b]
        return True
</pre>
<h2>Topological Sort (یادآوری)</h2>
<p>در DAG یک ترتیب خطی از رأس‌ها که هر یال $u\to v$ در آن $u$ را قبل از $v$ می‌آورد. دو روش: DFS (معکوس پس‌ترتیب) یا <b>الگوریتم Kahn</b> (حذف مکرر رأس‌های با درجه‌ی ورودی صفر با یک صف؛ اگر همه‌ی رأس‌ها حذف نشدند، دور وجود دارد). زمان $O(V+E)$. کاربرد: Build Systems، زمان‌بندی درس‌ها، ترتیب اجرای گراف محاسباتی (Autograd).</p>`,
mis:['«MST کوتاه‌ترین مسیر بین رأس‌ها را می‌دهد.» ← MST مجموع وزن کل را کمینه می‌کند نه فاصله‌ی دو رأس مشخص.','«MST همیشه یکتاست.» ← فقط اگر وزن‌ها متمایز باشند.'],
ex:[{t:'num',l:1,q:'یک MST برای گراف همبند با ۱۰ رأس چند یال دارد؟',a:9,tol:0,e:'$V-1=9$.'},
{t:'mcq',l:2,q:'Kruskal برای تشخیص ایجاد دور از چه ساختاری استفاده می‌کند؟',o:['Stack','Union-Find','Trie','Heap'],a:1,e:'اگر دو سر یال هم‌نماینده باشند، افزودن آن دور می‌سازد.'},
{t:'tf',l:2,q:'الگوریتم Kahn برای Topological Sort می‌تواند وجود دور را تشخیص دهد.',a:true,e:'اگر پس از پایان صف هنوز رأسی با درجه‌ی ورودی مثبت مانده باشد، دور هست.'},
{t:'think',l:3,q:'چرا Kruskal با «مرتب‌سازی بر اساس وزن» بهینه است؟ (Cut Property)',a:'هنگامی که کوچک‌ترین یال $e$ در لیست مرتب را بررسی می‌کنیم و دو سرش در مؤلفه‌های متفاوتی هستند، $e$ سبک‌ترین یالی است که برشی میان مؤلفه‌ی یک سر و بقیه را قطع می‌کند. طبق Cut Property یک MST شامل $e$ وجود دارد، پس اضافه‌کردن آن امن است. اگر دو سر در یک مؤلفه باشند، $e$ در دوری است که تمام یال‌های دیگرش سبک‌تر یا مساوی‌اند و ردش امن است.'}],
sum:['MST با Kruskal ($O(E\\log E)$) یا Prim ($O(E\\log V)$) ساخته می‌شود و هر دو حریصانه‌اند.','Union-Find با فشرده‌سازی مسیر و ادغام بر اساس اندازه، تقریباً $O(1)$ سرشکن است.','Topological Sort برای DAG با DFS یا Kahn در $O(V+E)$ انجام می‌شود.']});

body:R`
<h2>چارچوب انتخاب</h2>
<p>ساختمان داده‌ی «بهترین» مطلق وجود ندارد. باید به ترتیب پرسید: (۱) <b>عملیات غالب</b> چیست (خواندن/نوشتن، نقطه‌ای/بازه‌ای)؟ (۲) <b>اندازه‌ی داده</b> و نرخ رشد؟ (۳) آیا <b>ترتیب</b> یا <b>اولویت</b> لازم است؟ (۴) محدودیت <b>حافظه</b> و الگوی <b>کش</b>؟ (۵) <b>همزمانی</b> و پایداری؟</p>
${wd('chooser','راهنمای انتخاب ساختمان داده')}
<h2>موازنه‌های متداول</h2>
<ul><li><b>حافظه در برابر زمان:</b> جدول هش و ایندکس‌ها حافظه می‌خورند تا جست‌وجو سریع شود؛ جدول Memo، حافظه‌ی نهان و Lookup Table همچنین. ساختارهای <b>احتمالاتی</b> مثل <i>Bloom Filter</i> با حافظه‌ی بسیار کم، پاسخ «حتماً نیست / احتمالاً هست» می‌دهند (کاربرد: LSM-Tree، کش).</li><li><b>خواندن در برابر نوشتن:</b> آرایه‌ی مرتب خواندن را ارزان و نوشتن را گران می‌کند؛ LSM-Tree نوشتن را با افزودن ترتیبی ارزان و خواندن را به ادغام‌های پس‌زمینه می‌سپارد؛ B+Tree تعادل می‌دهد.</li><li><b>سادگی در برابر عملکرد:</b> گاهی آرایه‌ی ساده + مرتب‌سازی یک‌بار از ساختار پیچیده سریع‌تر و کم‌خطاتر است.</li></ul>
<h2>بهینه‌سازی الگوریتم‌ها</h2>
<ol><li>ابتدا <b>درستی</b>، سپس <b>اندازه‌گیری</b> (Profiling) و فقط گلوگاه واقعی را بهینه کنید.</li><li><b>الگوریتم و ساختمان داده</b> را قبل از ریزبهینه‌سازی عوض کنید (تغییر $O(n^2)\to O(n\log n)$ از هر ترفند ثابت مهم‌تر است).</li><li>محاسبات تکراری را حذف کنید (Memoization، پیش‌پردازش Prefix Sum، Two Pointers).</li><li>به <b>Locality</b> فکر کنید: آرایه‌های پیوسته، ساختار SoA به‌جای AoS، دسته‌بندی I/O.</li></ol>
${wd('bench','بنچمارک واقعی: جست‌وجو در Array، Binary Search و Set')}

<h3>اثر ساختمان داده بر پایگاه داده و ML</h3>
<p>در پایگاه داده، انتخاب نوع ایندکس (B+Tree برای بازه، Hash برای تساوی) هزینه‌ی پرس‌وجو را از اسکن $O(n)$ به $O(\log n)$ می‌رساند، و Join با هش ($O(n+m)$) یا Sort-Merge ($O(n\log n)$) فرق عظیمی ایجاد می‌کند. در ML، چیدمان حافظه‌ی تانسورها (Row-major، Contiguous)، Batch کردن و استفاده از ماتریس تُنُک، عملکرد را چند ده برابر تغییر می‌دهد؛ و در Embedding Retrieval، ساختار ایندکس برداری میان دقت، تأخیر و حافظه موازنه می‌سازد.</p>`,

<h2>۱. پایگاه داده و DBMS</h2>
<p><b>پایگاه داده (Database)</b> مجموعه‌ی سازمان‌یافته و مرتبط از داده‌هاست و <b>سیستم مدیریت پایگاه داده (DBMS)</b> نرم‌افزاری است که ذخیره، بازیابی، به‌روزرسانی و محافظت از آن داده را در برابر چندین کاربر هم‌زمان و خرابی‌ها مدیریت می‌کند (PostgreSQL، MySQL، SQLite، Oracle، MongoDB، ...).</p>
<h3>چرا فایل‌های ساده کافی نیست؟</h3>
<ul><li><b>افزونگی و ناسازگاری:</b> یک واقعیت در چند فایل تکرار و ناهمگام می‌شود.</li><li><b>همزمانی:</b> دو برنامه هم‌زمان یک فایل را به‌روز می‌کنند و یکدیگر را خراب می‌کنند.</li><li><b>اتمیک‌بودن:</b> انتقال پول بین دو حساب نیمه‌کاره بماند، پول گم می‌شود.</li><li><b>یکپارچگی و امنیت:</b> قواعد (مثل «موجودی منفی نباشد») و کنترل دسترسی.</li><li><b>کارایی:</b> جست‌وجو در گیگابایت‌ها بدون ایندکس.</li><li><b>وابستگی برنامه به قالب فایل.</b></li></ul>
<h2>۲. معماری سه‌سطحی و Data Independence</h2>
<p>معماری ANSI/SPARC داده را در سه سطح می‌بیند: <b>سطح خارجی (View)</b> برای هر کاربر/برنامه، <b>سطح مفهومی (Logical)</b> که کل ساختار (جدول‌ها، قیدها) را توصیف می‌کند، و <b>سطح داخلی (Physical)</b> که نحوه‌ی ذخیره روی دیسک (صفحه‌ها، ایندکس‌ها) است. این جداسازی دو <b>استقلال داده</b> می‌دهد: <i>استقلال فیزیکی</i> (تغییر ایندکس/فایل‌بندی بدون تغییر در جدول‌ها و پرس‌وجوها) و <i>استقلال منطقی</i> (تغییر جدول‌ها بدون خراب‌شدن Viewها). اساسِ SQL «اعلانی» نیز همین است: می‌گویید <i>چه</i> می‌خواهید نه <i>چگونه</i>.</p>
<h2>۳. اجزای DBMS</h2>

<h2>۴. مدل‌های داده</h2>
${ft(['مدل','ساختار','نمونه','نقطه‌ی قوت'],[['رابطه‌ای (Relational)','جدول‌ها با سطر/ستون و کلیدها','PostgreSQL, MySQL','SQL، تراکنش ACID، Joinهای قدرتمند'],['سند (Document)','سندهای JSON تودرتو','MongoDB','طرح‌واره‌ی منعطف، داده‌ی سلسله‌مراتبی'],['کلید-مقدار (Key-Value)','نگاشت کلید به مقدار مات','Redis, DynamoDB','سرعت و مقیاس‌پذیری ساده'],['ستون‌گسترده (Wide-Column)','خانواده‌ی ستون‌ها','Cassandra, HBase','نوشتن زیاد، مقیاس بالا'],['گراف (Graph)','گره و یال','Neo4j','پیمایش روابط عمیق'],['ستونی تحلیلی (Columnar)','ذخیره‌ی ستون‌به‌ستون','ClickHouse, BigQuery','تجمیع‌های سنگین (OLAP)']])}
<p><b>طرح‌واره (Schema)</b> توصیف ساختار است و <b>نمونه (Instance)</b> داده‌ی موجود در یک لحظه. پایگاه داده‌ی رابطه‌ای معمولاً <i>Schema-on-Write</i> است (ساختار پیش از درج اعمال می‌شود)، بسیاری از NoSQLها <i>Schema-on-Read</i>.</p>
${co('note','رابطه‌ای در برابر غیررابطه‌ای: انتخاب بر پایه‌ی نیاز','NoSQL «بهتر» یا «سریع‌تر» نیست؛ موازنه‌های متفاوتی دارد. اگر داده‌ی به‌شدت رابطه‌ای و نیازمند تراکنش چندجدولی دارید، رابطه‌ای معمولاً انتخاب درست است. اگر مقیاس افقی بسیار بالا، ساختار انعطاف‌پذیر یا الگوی دسترسی ساده (کلید) دارید، گزینه‌های NoSQL مناسب‌اند. بسیاری از سیستم‌های امروزی (NewSQL، PostgreSQL با JSONB) مرز را کم‌رنگ کرده‌اند.')}
<h2>۵. اصطلاحات جدول</h2>
<p>یک <b>جدول (Table / Relation)</b> از <b>ستون‌ها (Attributes)</b> با نوع داده‌ی مشخص و <b>سطرها (Tuples / Rows)</b> تشکیل می‌شود. در جدول‌های نمونه‌ی این کتاب (employees، departments، projects، assignments) می‌توانید با SQL Sandbox آزمایش کنید.</p>

{t:'sql',l:1,q:'نام و حقوق کارمندانی که حقوقشان بیش از ۴۵۰۰ است را بنویسید (ستون‌ها: name, salary).',init:'SELECT * FROM employees;',sol:'SELECT name, salary FROM employees WHERE salary > 4500',hint:'فقط دو ستون و شرط WHERE salary > 4500.',e:'<code>SELECT name, salary FROM employees WHERE salary &gt; 4500</code> — چهار سطر: Ali، Omid، Lida (و Maryam=4500 شامل نمی‌شود).'},
{t:'think',l:2,q:'برای سیستم‌هایی مانند سبد خرید فروشگاه و ثبت لاگ حسگرها، مدل داده‌ی مناسب را (با دلیل) پیشنهاد دهید.',a:'سبد خرید و سفارش‌ها: رابطه‌ای (تراکنش ACID، روابط مشتری-سفارش-کالا، قیدهای یکپارچگی). لاگ حسگرها: نوشتن بسیار زیاد با ساختار ساده و پرس‌وجوی بازه‌ی زمانی؛ پایگاه‌داده‌ی سری‌زمانی/ستونی (TimescaleDB، InfluxDB) یا Wide-Column مانند Cassandra، که برای نوشتن ترتیبی و مقیاس افقی بهینه‌اند. معیار: الگوی دسترسی، سازگاری موردنیاز و حجم.'}],

obj:['رابطه، صفت، دامنه و چندتایی (Tuple) را به‌صورت ریاضی بیان کنید.','ابرکلید، کلید کاندید، کلید اصلی و کلید خارجی را تمایز دهید.','قیدهای یکپارچگی و رفتار NULL را بشناسید و روابط ۱:۱، ۱:N، N:M را پیاده‌سازی کنید.'],
body:R`
<h2>۱. مدل رابطه‌ای</h2>
<p>مدل رابطه‌ای (Codd، ۱۹۷۰) داده را به‌صورت <b>رابطه (Relation)</b> می‌بیند. اگر صفت‌ها $A_1,\dots,A_k$ با دامنه‌های $D_1,\dots,D_k$ باشند، یک رابطه زیرمجموعه‌ای از حاصل‌ضرب دکارتی $D_1\times\dots\times D_k$ است؛ یعنی یک <b>مجموعه</b> از چندتایی‌ها. نتایج مهم: ترتیب سطرها بی‌معناست؛ در مدل نظری سطر تکراری نداریم (SQL این را شل می‌کند و «Bag» است)؛ و ترتیب ستون‌ها نیز ذاتی نیست. <b>درجه</b> = تعداد ستون‌ها، <b>کاردینالیتی</b> = تعداد سطرها.</p>
<h2>۲. کلیدها</h2>
<ul><li><b>ابرکلید (Superkey):</b> مجموعه‌ای از صفت‌ها که مقدارش هر سطر را یکتا مشخص می‌کند.</li><li><b>کلید کاندید (Candidate Key):</b> ابرکلید <i>کمینه</i>؛ حذف هر صفتی خاصیت یکتایی را از بین می‌برد.</li><li><b>کلید اصلی (Primary Key):</b> یکی از کلیدهای کاندید که انتخاب شده؛ NULL ندارد. بقیه <b>کلید جایگزین (Alternate)</b> هستند و با <code>UNIQUE</code> اعمال می‌شوند.</li><li><b>کلید خارجی (Foreign Key):</b> صفتی که به کلید کاندید/اصلی جدول دیگر ارجاع می‌دهد و <b>یکپارچگی ارجاعی (Referential Integrity)</b> را تضمین می‌کند.</li><li><b>کلید مصنوعی (Surrogate)</b> مثل <code>id AUTO_INCREMENT/UUID</code> در برابر <b>کلید طبیعی (Natural)</b> مثل کد ملی.</li></ul>
<h2>۳. قیدهای یکپارچگی</h2>
<pre data-l="sql">
CREATE TABLE employees (
  id         INTEGER PRIMARY KEY,
  name       TEXT    NOT NULL,
  email      TEXT    UNIQUE,
  salary     INTEGER CHECK (salary > 0),
  dept_id    INTEGER REFERENCES departments(id)
                     ON DELETE SET NULL   -- یا CASCADE / RESTRICT
);
</pre>
<p>رفتارهای FK هنگام حذف/تغییر ردیف والد: <code>RESTRICT/NO ACTION</code> (رد عملیات)، <code>CASCADE</code> (حذف/تغییر فرزندان)، <code>SET NULL</code>، <code>SET DEFAULT</code>. در موتور داخلی این کتاب، رفتار پیش‌فرض RESTRICT است. آزمایش کنید:</p>
${wd('sqlplay','آزمایش قیدها (PK / FK / NOT NULL)',{q:"-- هر کدام را جداگانه اجرا کنید\nINSERT INTO employees VALUES (11, 'Zahra', 9, 4000, 2024, NULL);",presets:[{t:'نقض FK: دپارتمان ۹ وجود ندارد',q:"INSERT INTO employees VALUES (11, 'Zahra', 9, 4000, 2024, NULL);"},{t:'نقض PK: شناسه‌ی تکراری',q:"INSERT INTO employees VALUES (1, 'Zahra', 1, 4000, 2024, NULL);"},{t:'نقض NOT NULL: نام خالی',q:"INSERT INTO employees VALUES (12, NULL, 1, 4000, 2024, NULL);"},{t:'درج معتبر',q:"INSERT INTO employees VALUES (11, 'Zahra', 1, 4000, 2024, NULL);\nSELECT * FROM employees WHERE id = 11;"},{t:'حذف دپارتمان دارای کارمند (RESTRICT)',q:'DELETE FROM departments WHERE id = 1;'},{t:'حذف دپارتمان بدون کارمند',q:'DELETE FROM departments WHERE id = 4;'}]})}
<p>نکته: در این Sandbox هر اجرا یک دستور را می‌پذیرد؛ دکمه‌ی «بازنشانی» داده را به حالت اولیه برمی‌گرداند.</p>
<h2>۴. NULL و منطق سه‌ارزشی</h2>
<p><code>NULL</code> یعنی «مقدار نامعلوم/نامربوط»، نه صفر یا رشته‌ی خالی. مقایسه با NULL نتیجه‌ی <b>UNKNOWN</b> می‌دهد: <code>NULL = NULL</code> نه درست است نه غلط؛ برای آزمون باید <code>IS NULL</code> نوشت. <code>WHERE</code> فقط سطرهای TRUE را نگه می‌دارد. جدول درستی: <code>TRUE AND UNKNOWN = UNKNOWN</code>، <code>FALSE AND UNKNOWN = FALSE</code>، <code>TRUE OR UNKNOWN = TRUE</code>. توجه: <code>NOT IN (subquery)</code> اگر زیرپرسش NULL داشته باشد هیچ سطری برنمی‌گرداند — تله‌ی مشهور.</p>

{t:'mcq',l:1,q:'برای پیاده‌سازی رابطه‌ی N:M بین دانشجو و درس چه لازم است؟',o:['یک FK در جدول دانشجو','یک FK در جدول درس','جدول واسط با دو کلید خارجی','دو جدول بدون ارتباط'],a:2,e:'جدول واسط (Enrollment) با کلید مرکب (student_id, course_id) و دو FK.'},

LESSONS.push({id:'b3-1',mod:'B',g:'B3',t:'SQL: SELECT، DML و JOIN',en:'SQL: SELECT, DML & JOIN Operations',lvl:1,min:50,pre:['b2-1'],kw:'sql select insert update delete join inner left right full cross where order by limit',
obj:['پرس‌وجوهای SELECT با WHERE، ORDER BY و LIMIT را بنویسید.','INSERT، UPDATE و DELETE را با رعایت قیدها استفاده کنید.','انواع JOIN را با مثال تمایز دهید و از Join ناخواسته (Cartesian Product) پرهیز کنید.'],
body:R`
<h2>۱. SELECT پایه</h2>
<pre data-l="sql">
SELECT name, salary              -- ستون‌ها (Projection  π)
FROM   employees                 -- منبع داده
WHERE  salary >= 4000            -- فیلتر سطرها (Selection σ)
  AND  hire_year < 2020
ORDER  BY salary DESC            -- مرتب‌سازی
LIMIT  3;                        -- محدودیت تعداد
</pre>
<p>عملگرها: <code>= &lt;&gt; &lt; &gt; &lt;= &gt;=</code>، <code>BETWEEN a AND b</code>، <code>IN (...)</code>، <code>LIKE 'M%'</code> (<code>%</code> هر رشته، <code>_</code> یک کاراکتر)، <code>IS NULL</code>، و ترکیب با <code>AND OR NOT</code>. <code>DISTINCT</code> سطرهای تکراری را حذف می‌کند. بدون <code>ORDER BY</code> ترتیب نتیجه تضمین‌شده <b>نیست</b>.</p>
${wd('sqlplay','SELECT را امتحان کنید',{q:'SELECT name, salary, hire_year\nFROM employees\nWHERE salary >= 4000 AND hire_year < 2020\nORDER BY salary DESC\nLIMIT 3;',rows:6})}
<h2>۲. DML: INSERT / UPDATE / DELETE</h2>
<pre data-l="sql">
INSERT INTO departments (id, name, city) VALUES (5, 'Legal', 'Tehran');
UPDATE employees SET salary = salary * 1.1 WHERE dept_id = 3;
DELETE FROM assignments WHERE hours < 70;
</pre>
<p>هشدار: <code>UPDATE</code> یا <code>DELETE</code> <b>بدون WHERE</b> روی همه‌ی سطرها اعمال می‌شود. عادت امن: ابتدا همان WHERE را با <code>SELECT</code> اجرا و تعداد سطرها را بررسی کنید، یا داخل تراکنش اجرا و بعد COMMIT کنید.</p>
<h2>۳. JOIN</h2>
<p>JOIN سطرهای دو جدول را بر اساس یک شرط ترکیب می‌کند. در مدل نظری: $R\bowtie_{\theta}S=\sigma_\theta(R\times S)$.</p>
${ft(['نوع','نتیجه'],[['<code>INNER JOIN</code>','فقط سطرهای دارای جفت در هر دو جدول'],['<code>LEFT JOIN</code>','همه‌ی سطرهای چپ؛ اگر جفت نبود ستون‌های راست NULL'],['<code>RIGHT JOIN</code>','قرینه‌ی LEFT'],['<code>FULL OUTER JOIN</code>','اجتماع LEFT و RIGHT'],['<code>CROSS JOIN</code>','ضرب دکارتی (همه‌ی ترکیب‌ها)']])}
${wd('joinviz','نمایشگر انواع JOIN روی employees و departments')}
<pre data-l="sql">
-- نام کارمند و نام دپارتمان (INNER)
SELECT e.name, d.name AS dept
FROM employees e JOIN departments d ON e.dept_id = d.id;

-- دپارتمان‌هایی که هیچ کارمندی ندارند (Anti-Join با LEFT JOIN)
SELECT d.name
FROM departments d LEFT JOIN employees e ON e.dept_id = d.id
WHERE e.id IS NULL;
</pre>
<h3>نکات مهم</h3>
<ul><li><b>Alias جدول</b> (<code>e</code>، <code>d</code>) خوانایی را زیاد و ستون‌های هم‌نام را قابل‌تفکیک می‌کند.</li><li>شرط <code>WHERE</code> روی جدول سمت راست <code>LEFT JOIN</code> آن را عملاً به INNER JOIN تبدیل می‌کند (چون NULL فیلتر می‌شود)؛ شرط‌های مربوط به جدول راست را در <code>ON</code> بنویسید.</li><li>فراموش‌کردن شرط JOIN، ضرب دکارتی می‌سازد: $n\times m$ سطر.</li><li><b>Self Join</b> برای روابط درون‌جدولی (کارمند و مدیرش) با دو alias از یک جدول.</li></ul>
${wd('sqlplay','JOIN و Self Join',{q:"SELECT e.name AS employee, m.name AS manager\nFROM employees e LEFT JOIN employees m ON e.manager_id = m.id\nORDER BY e.id;",rows:4})}`,
mis:['«LEFT JOIN و WHERE روی ستون راست یکی است با شرط در ON.» ← نیست؛ WHERE پس از Join فیلتر می‌کند و سطرهای NULL را حذف می‌کند.','«ترتیب نتیجه بدون ORDER BY همان ترتیب جدول است.» ← تضمین‌شده نیست.','«SELECT * بی‌ضرر است.» ← داده‌ی اضافه، وابستگی به ترتیب ستون و جلوگیری از Covering Index.','استفاده از <code>= NULL</code> به‌جای <code>IS NULL</code>.'],
ex:[{t:'sql',l:1,q:'نام کارمندانی که در سال ۲۰۲۰ یا بعد از آن استخدام شده‌اند را به‌ترتیب نام (صعودی) فهرست کنید. (ستون: name)',init:'SELECT name FROM employees;',sol:'SELECT name FROM employees WHERE hire_year >= 2020 ORDER BY name',hint:'WHERE hire_year >= 2020 و ORDER BY name.',e:'Kian، Neda، Nima، Pouya.'},
{t:'sql',l:2,q:'برای هر کارمندی که دپارتمان دارد، نام کارمند و نام شهر دپارتمانش را بیاورید (ستون‌ها: name، city).',init:'SELECT e.name FROM employees e',sol:'SELECT e.name, d.city FROM employees e JOIN departments d ON e.dept_id = d.id',hint:'INNER JOIN با ON e.dept_id = d.id.',e:'کارمند بدون دپارتمان (Nima) در INNER JOIN نمی‌آید.'},
{t:'sql',l:2,q:'نام دپارتمان‌هایی که هیچ کارمندی ندارند (ستون: name).',init:'SELECT d.name FROM departments d',sol:'SELECT d.name FROM departments d LEFT JOIN employees e ON e.dept_id = d.id WHERE e.id IS NULL',hint:'LEFT JOIN و بررسی NULL شدن ستون جدول راست.',e:'فقط Research.'},
{t:'mcq',l:2,q:'کدام JOIN همه‌ی سطرهای جدول چپ را حتی بدون تطابق نگه می‌دارد؟',o:['INNER JOIN','LEFT JOIN','CROSS JOIN','SELF JOIN فقط'],a:1,e:'LEFT (OUTER) JOIN ستون‌های جدول راست را برای سطرهای بی‌جفت NULL می‌گذارد.'},
{t:'sql',l:3,q:'نام هر کارمند همراه با نام مدیرش (ستون‌ها: employee، manager) برای کسانی که مدیر دارند، مرتب بر اساس employee.',init:'SELECT e.name AS employee FROM employees e',sol:'SELECT e.name AS employee, m.name AS manager FROM employees e JOIN employees m ON e.manager_id = m.id ORDER BY e.name',hint:'Self Join با دو alias.',e:'Self Join: جدول employees با خودش بر اساس manager_id = id.'}],

LESSONS.push({id:'b3-2',mod:'B',g:'B3',t:'تجمیع، زیرپرسش، CTE و توابع پنجره‌ای',en:'Aggregation, Subqueries, CTE & Window Functions',lvl:3,min:60,pre:['b3-1'],kw:'aggregate group by having subquery correlated exists cte with window function row_number rank lag sum over partition',
obj:['GROUP BY/HAVING را با تفاوت WHERE و HAVING به کار ببرید.','زیرپرسش‌های اسکالر، IN، EXISTS و هم‌بسته را بنویسید.','از CTE برای ساختاردهی و از توابع پنجره‌ای برای رتبه‌بندی و مجموع تجمعی بدون ادغام سطرها استفاده کنید.'],
body:R`
<h2>۱. توابع تجمیعی و GROUP BY</h2>
<p><code>COUNT، SUM، AVG، MIN، MAX</code> چند سطر را به یک مقدار خلاصه می‌کنند. <code>GROUP BY</code> سطرها را به گروه‌هایی با مقدار یکسان ستون‌های گروه‌بندی تقسیم و تابع را در هر گروه محاسبه می‌کند. <code>COUNT(*)</code> همه‌ی سطرها را می‌شمارد ولی <code>COUNT(col)</code> سطرهای NULL آن ستون را نمی‌شمارد. توابع تجمیعی NULL را نادیده می‌گیرند (<code>AVG</code> میانگین مقادیر غیر NULL است).</p>
<pre data-l="sql">
SELECT d.name, COUNT(*) AS n, ROUND(AVG(e.salary), 1) AS avg_salary
FROM   employees e JOIN departments d ON e.dept_id = d.id
GROUP  BY d.name
HAVING COUNT(*) >= 3             -- فیلتر روی نتیجه‌ی تجمیع
ORDER  BY avg_salary DESC;
</pre>
<p><b>WHERE در برابر HAVING:</b> <code>WHERE</code> <i>قبل</i> از گروه‌بندی روی سطرها اعمال می‌شود و تابع تجمیعی نمی‌پذیرد؛ <code>HAVING</code> <i>بعد</i> از گروه‌بندی روی گروه‌ها. ترتیب منطقی اجرای یک SELECT (نه ترتیب نوشتن):</p>
<p style="direction:ltr;text-align:left"><code>FROM/JOIN → WHERE → GROUP BY → HAVING → SELECT (و پنجره‌ها) → DISTINCT → ORDER BY → LIMIT</code></p>
${wd('sqlplay','تجمیع و گروه‌بندی',{q:'SELECT d.name, COUNT(*) AS n, ROUND(AVG(e.salary), 1) AS avg_salary\nFROM employees e JOIN departments d ON e.dept_id = d.id\nGROUP BY d.name\nHAVING COUNT(*) >= 3\nORDER BY avg_salary DESC;',rows:6})}
<h2>۲. زیرپرسش‌ها (Subqueries)</h2>
<ul><li><b>اسکالر:</b> یک مقدار برمی‌گرداند و جای مقدار می‌نشیند: <code>WHERE salary &gt; (SELECT AVG(salary) FROM employees)</code>.</li><li><b>IN:</b> <code>WHERE dept_id IN (SELECT id FROM departments WHERE city='Tehran')</code>.</li><li><b>EXISTS:</b> بررسی وجود حداقل یک سطر؛ معمولاً کارا و بدون مشکل NULL.</li><li><b>هم‌بسته (Correlated):</b> به ستون‌های پرس‌وجوی بیرونی ارجاع می‌دهد و برای هر سطر بیرونی «دوباره» ارزیابی می‌شود (مفهوماً).</li></ul>
<pre data-l="sql">
-- بیشترین حقوق در هر دپارتمان (هم‌بسته)
SELECT name, dept_id, salary FROM employees e
WHERE salary = (SELECT MAX(salary) FROM employees x WHERE x.dept_id = e.dept_id);
</pre>
<h2>۳. CTE (عبارت جدول مشترک)</h2>
<p><code>WITH</code> یک «جدول موقت نام‌دار» برای همان پرس‌وجو می‌سازد و پرس‌وجوهای پیچیده را به گام‌های خوانا می‌شکند.</p>
<pre data-l="sql">
WITH dept_total AS (
  SELECT dept_id, SUM(salary) AS total FROM employees GROUP BY dept_id
)
SELECT d.name, t.total
FROM dept_total t JOIN departments d ON d.id = t.dept_id
ORDER BY t.total DESC;
</pre>
<p>(در PostgreSQL <code>WITH RECURSIVE</code> پیمایش سلسله‌مراتب را ممکن می‌کند؛ موتور داخلی کتاب CTE غیربازگشتی را پشتیبانی می‌کند.)</p>
<h2>۴. توابع پنجره‌ای (Window Functions)</h2>
<p>برخلاف GROUP BY، سطرها را <b>ادغام نمی‌کنند</b>؛ برای هر سطر مقداری بر اساس یک «پنجره» از سطرهای مرتبط محاسبه می‌کنند. ساختار: <code>fn(...) OVER (PARTITION BY ... ORDER BY ...)</code>. توابع رتبه‌بندی: <code>ROW_NUMBER</code> (شماره‌ی یکتا)، <code>RANK</code> (هم‌رتبه‌ها شماره‌ی یکسان با پرش)، <code>DENSE_RANK</code> (بدون پرش)؛ <code>LAG/LEAD</code> مقدار سطر قبل/بعد؛ تجمیعی‌ها با OVER مجموع تجمعی می‌دهند.</p>
${wd('sqlplay','رتبه‌بندی حقوق در هر دپارتمان با RANK',{q:'SELECT name, dept_id, salary,\n       RANK() OVER (PARTITION BY dept_id ORDER BY salary DESC) AS rnk,\n       SUM(salary) OVER (PARTITION BY dept_id) AS dept_total\nFROM employees\nWHERE dept_id IS NOT NULL\nORDER BY dept_id, rnk;',rows:7,presets:[{t:'رتبه‌بندی با RANK',q:'SELECT name, dept_id, salary,\n       RANK() OVER (PARTITION BY dept_id ORDER BY salary DESC) AS rnk\nFROM employees\nWHERE dept_id IS NOT NULL\nORDER BY dept_id, rnk;'},{t:'سه‌نفر اول هر دپارتمان با CTE',q:'WITH r AS (\n  SELECT name, dept_id, salary,\n         ROW_NUMBER() OVER (PARTITION BY dept_id ORDER BY salary DESC) AS rn\n  FROM employees WHERE dept_id IS NOT NULL\n)\nSELECT * FROM r WHERE rn <= 2 ORDER BY dept_id, rn;'},{t:'اختلاف با نفر بالاتر (LAG)',q:'SELECT name, salary,\n       salary - LAG(salary) OVER (ORDER BY salary DESC) AS diff_from_prev\nFROM employees\nORDER BY salary DESC;'}]})}
${co('tip','چرا CTE برای فیلتر پنجره‌ای؟','نتیجه‌ی تابع پنجره‌ای را نمی‌توان مستقیماً در WHERE همان SELECT به‌کار برد (چون پنجره‌ها بعد از WHERE محاسبه می‌شوند). راه‌حل: آن را داخل CTE/زیرپرسش محاسبه و بیرون فیلتر کنید.')}`,
mis:['«HAVING و WHERE یکی‌اند.» ← زمان اعمال و توانایی استفاده از تجمیع متفاوت است.','«ستونی که در SELECT است و در GROUP BY نیست مشکلی ندارد.» ← استاندارد SQL و اکثر DBMSها خطا می‌دهند (MySQL قدیمی مقدار دلخواه می‌داد).','«NOT IN و NOT EXISTS معادل‌اند.» ← با وجود NULL در زیرپرسش، NOT IN نتیجه‌ی خالی می‌دهد.','«Window Function همان GROUP BY است.» ← سطرها را فشرده نمی‌کند.'],
ex:[{t:'sql',l:2,q:'تعداد کارمندان هر دپارتمان (فقط دپارتمان‌هایی که کارمند دارند) به‌صورت (dept_id, n)، مرتب بر اساس dept_id. کارمندان بدون دپارتمان را نادیده بگیرید.',init:'SELECT dept_id, COUNT(*) AS n FROM employees',sol:'SELECT dept_id, COUNT(*) AS n FROM employees WHERE dept_id IS NOT NULL GROUP BY dept_id ORDER BY dept_id',hint:'GROUP BY dept_id و حذف NULL با WHERE.',e:'گروه NULL جداگانه ظاهر می‌شود؛ با WHERE حذف می‌کنیم.'},
{t:'sql',l:2,q:'نام کارمندانی که حقوقشان از میانگین حقوق کل بیشتر است (ستون: name).',init:'SELECT name FROM employees',sol:'SELECT name FROM employees WHERE salary > (SELECT AVG(salary) FROM employees)',hint:'زیرپرسش اسکالر برای AVG.',e:'میانگین حقوق ۴۲۹۰ است ⇒ Ali، Maryam، Omid، Lida.'},
{t:'sql',l:3,q:'برای هر دپارتمان، نام دپارتمان و مجموع ساعت‌های کاری ثبت‌شده در assignments پروژه‌های همان دپارتمان را بنویسید (ستون‌ها: dept، total_hours) که مجموع بیش از ۲۰۰ ساعت باشد.',init:'SELECT d.name AS dept FROM departments d',sol:'SELECT d.name AS dept, SUM(a.hours) AS total_hours FROM departments d JOIN projects p ON p.dept_id = d.id JOIN assignments a ON a.project_id = p.id GROUP BY d.name HAVING SUM(a.hours) > 200',hint:'سه جدول Join + GROUP BY + HAVING.',e:'Engineering: 120+200+150+80+160=710؛ Sales: 90+110+60=260؛ HR: 170 (حذف می‌شود).'},
{t:'sql',l:3,q:'نفر دوم از نظر بیشترین حقوق در هر دپارتمان (ستون‌ها: name، dept_id، salary). از CTE و ROW_NUMBER استفاده کنید.',init:'WITH r AS (\n  SELECT name, dept_id, salary,\n         ROW_NUMBER() OVER (PARTITION BY dept_id ORDER BY salary DESC) AS rn\n  FROM employees WHERE dept_id IS NOT NULL\n)\nSELECT name, dept_id, salary FROM r',sol:'WITH r AS (SELECT name, dept_id, salary, ROW_NUMBER() OVER (PARTITION BY dept_id ORDER BY salary DESC) AS rn FROM employees WHERE dept_id IS NOT NULL) SELECT name, dept_id, salary FROM r WHERE rn = 2',hint:'فقط WHERE rn = 2 را اضافه کنید.',e:'نفر دوم: Ali (Eng)، Reza یا Kian (Sales؛ حقوق برابر ۳۹۰۰ — ROW_NUMBER یکی را دلخواه انتخاب می‌کند)، Pouya (HR). برای هم‌رتبه‌ها DENSE_RANK مناسب‌تر است.'},
{t:'think',l:3,q:'تفاوت <code>NOT IN</code> و <code>NOT EXISTS</code> وقتی زیرپرسش NULL برگرداند چیست؟',a:'<code>x NOT IN (a, b, NULL)</code> معادل <code>x&lt;&gt;a AND x&lt;&gt;b AND x&lt;&gt;NULL</code> است؛ جزء آخر UNKNOWN و در نتیجه کل عبارت هرگز TRUE نمی‌شود، پس هیچ سطری برنمی‌گردد. <code>NOT EXISTS</code> فقط وجود سطر مطابق را می‌سنجد و NULL را به‌عنوان «تطابق» نمی‌شمارد؛ از این رو امن‌تر است.'}],
sum:['GROUP BY سطرها را فشرده می‌کند؛ HAVING گروه‌ها را فیلتر می‌کند.','زیرپرسش‌ها (اسکالر، IN، EXISTS، هم‌بسته) و CTE ساختار پرس‌وجو را ماژولار می‌کنند.','توابع پنجره‌ای سطرها را حفظ و در کنار آن‌ها رتبه، مجموع تجمعی و مقایسه با سطرهای مجاور می‌دهند.']});

LESSONS.push({id:'b3-3',mod:'B',g:'B3',t:'فرایند اجرای پرس‌وجو و بهینه‌سازی',en:'Query Execution & Optimization',lvl:3,min:50,pre:['b3-2'],kw:'query optimizer execution plan explain cost model join algorithms nested loop hash join merge join selectivity cardinality statistics predicate pushdown',
obj:['مراحل پردازش یک پرس‌وجو (Parse تا Execute) را توضیح دهید.','الگوریتم‌های Join (Nested Loop، Hash، Merge) را از نظر هزینه مقایسه کنید.','نقش آمار، Selectivity و ترتیب Join را در انتخاب طرح اجرا بدانید.'],
body:R`
<h2>۱. مسیر پرس‌وجو</h2>
<ol><li><b>Parse:</b> تحلیل نحوی و ساخت AST، بررسی وجود جدول/ستون در Catalog.</li><li><b>Rewrite:</b> باز‌کردن Viewها، ساده‌سازی عبارت‌ها.</li><li><b>Optimize:</b> تولید و ارزیابی طرح‌های معادل و انتخاب ارزان‌ترین.</li><li><b>Execute:</b> اجرای عملگرها (معمولاً مدل Iterator/Volcano: هر عملگر <code>next()</code> دارد و سطر به سطر می‌کشد).</li></ol>
<p>پرس‌وجو ابتدا به <b>جبر رابطه‌ای</b> ترجمه می‌شود: $\sigma$ (انتخاب سطر)، $\pi$ (انتخاب ستون)، $\bowtie$ (Join)، $\gamma$ (تجمیع). مثلاً:</p>
$$\pi_{name}\left(\sigma_{salary>4500}(employees)\right)$$
<p>این یک <b>طرح منطقی (Logical Plan)</b> است؛ بهینه‌ساز با انتخاب الگوریتم‌های واقعی آن را به <b>طرح فیزیکی (Physical Plan)</b> تبدیل می‌کند.</p>
<h2>۲. بهینه‌سازی</h2>
<ul><li><b>بازنویسی‌های جبری:</b> <i>Predicate Pushdown</i> (فیلتر را هرچه زودتر، پیش از Join اعمال کن)، <i>Projection Pushdown</i> (فقط ستون‌های لازم).</li><li><b>مدل هزینه (Cost Model):</b> برآورد I/O + CPU هر طرح بر پایه‌ی <b>آمار</b> (تعداد سطرها، مقادیر متمایز، هیستوگرام). <b>Selectivity</b> کسری از سطرهاست که شرط را برقرار می‌کنند؛ برآورد غلط (مثلاً به‌علت همبستگی ستون‌ها یا آمار کهنه) رایج‌ترین دلیل طرح بد است. دستور <code>ANALYZE</code> آمار را به‌روز می‌کند.</li><li><b>ترتیب Join:</b> تعداد ترتیب‌ها برای $n$ جدول فاکتوریلی رشد می‌کند؛ بهینه‌سازها از DP روی زیرمجموعه‌ها (System R) یا هیوریستیک استفاده می‌کنند.</li></ul>
<h3>الگوریتم‌های Join</h3>
${ft(['الگوریتم','ایده','هزینه‌ی تقریبی','مناسب برای'],[['Nested Loop','برای هر سطر بیرونی همه‌ی سطرهای داخلی را بررسی/جست‌وجو کن','$O(nm)$؛ با ایندکس روی داخلی $O(n\\log m)$','جدول بیرونی کوچک، شرط غیرتساوی'],['Hash Join','جدول کوچک را در جدول هش بریز، جدول بزرگ را بر آن Probe کن','$O(n+m)$ + حافظه‌ی هش','Join تساوی روی جدول‌های بزرگ بدون ایندکس'],['Sort-Merge Join','هر دو را بر کلید مرتب و ادغام کن','$O(n\\log n+m\\log m)$ (یا $O(n+m)$ اگر قبلاً مرتب)','ورودی‌های از قبل مرتب، Join بازه‌ای']])}

<p>در موتور آموزشی این کتاب، «scanned rows» تعداد سطرهایی است که از جدول‌های پایه خوانده شده؛ زیرپرسش هم‌بسته جدول را برای هر سطر بیرونی دوباره اسکن می‌کند (مفهوم Nested Loop). DBMS واقعی چنین زیرپرسش‌هایی را اغلب به Join بازنویسی (Decorrelate) می‌کند.</p>
<h2>۳. خواندن طرح اجرا (EXPLAIN)</h2>
<pre data-l="sql">
EXPLAIN ANALYZE
SELECT e.name, d.name FROM employees e JOIN departments d ON e.dept_id = d.id
WHERE e.salary > 4500;
-- نمونه خروجی (PostgreSQL، ساده‌شده):
-- Hash Join  (cost=1.09..2.30 rows=3)
--   Hash Cond: (e.dept_id = d.id)

obj:['مدل ER (موجودیت، صفت، رابطه، کاردینالیتی) را بسازید و به جدول‌های رابطه‌ای نگاشت کنید.','ناهنجاری‌های درج، به‌روزرسانی و حذف را شناسایی کنید.','وابستگی تابعی، بستار صفات و کلیدهای کاندید را محاسبه کنید.'],
body:R`
<h2>۱. طراحی مفهومی با ER</h2>
<p>طراحی پایگاه داده از نیازمندی‌ها شروع و در سه مرحله پیش می‌رود: <b>مفهومی (ER)</b> ← <b>منطقی (جدول‌ها و قیدها)</b> ← <b>فیزیکی (ایندکس، پارتیشن)</b>. در مدل <b>موجودیت-رابطه (Entity-Relationship)</b>: <b>موجودیت</b> (چیزی قابل‌شناسایی مثل Employee)، <b>صفت</b> (ویژگی)، <b>رابطه</b> (ارتباط میان موجودیت‌ها) و <b>کاردینالیتی</b> ($1{:}1$، $1{:}N$، $N{:}M$) و <b>مشارکت</b> (کامل یا جزئی).</p>
${wd('erd','نمودار ER جدول‌های نمونه (نمادگذاری ۱ و N)')}
<h3>نگاشت ER به جدول</h3>
<ul><li>هر موجودیت قوی ← یک جدول با کلید اصلی.</li><li>رابطه‌ی $1{:}N$ ← کلید خارجی در سمت N.</li><li>رابطه‌ی $N{:}M$ ← جدول واسط (با صفات خود رابطه، مثل <code>hours</code>).</li><li>صفت چندمقداری ← جدول جدا؛ موجودیت ضعیف ← کلید مرکب با کلید والد.</li></ul>
<h2>۲. ناهنجاری‌ها: چرا نرمال‌سازی؟</h2>
<p>جدول نامناسب <code>Enrollment(student, student_name, course, instructor, instructor_office)</code> را در نظر بگیرید که اطلاعات دانشجو و استاد در هر سطر تکرار می‌شود:</p>
<ul><li><b>ناهنجاری به‌روزرسانی:</b> تغییر دفتر استاد باید در چندین سطر اعمال شود؛ فراموشی ⇒ ناسازگاری.</li><li><b>ناهنجاری درج:</b> استادی که هنوز درسی ندارد را نمی‌توان ثبت کرد (کلید ناقص می‌شود).</li><li><b>ناهنجاری حذف:</b> با حذف آخرین ثبت‌نام یک درس، اطلاعات استاد هم از بین می‌رود.</li></ul>
<h2>۳. وابستگی تابعی (FD)</h2>
<p>$X\to Y$ یعنی هر دو سطر با مقدار یکسان $X$، مقدار یکسان $Y$ دارند (مثلاً <code>student_id → student_name</code>). FDها ناشی از «معنای داده» هستند، نه از داده‌ی فعلی. <b>بستار صفات</b> $X^+$ همه‌ی صفاتی است که از $X$ استنتاج می‌شود (با بسط تکراری با FDها). $X$ ابرکلید است اگر $X^+$ همه‌ی صفات باشد؛ اگر کمینه هم باشد، کلید کاندید.</p>
<p><b>اصول آرمسترانگ:</b> بازتاب ($Y\subseteq X\Rightarrow X\to Y$)، افزایش ($X\to Y\Rightarrow XZ\to YZ$) و تعدی ($X\to Y,\ Y\to Z\Rightarrow X\to Z$) که اتحاد، تجزیه و ... از آن‌ها می‌آیند.</p>
${wd('fdtool','ماشین‌حساب بستار صفات و کلیدهای کاندید (و فرم نرمال)')}
<p>مثال: $R(A,B,C,D)$ با $A\to B,\ B\to C,\ AD\to C$ ← $\{A,D\}^+=\{A,B,C,D\}$ و هیچ زیرمجموعه‌ی سره‌ای همه‌ی صفات را نمی‌دهد ⇒ تنها کلید کاندید $\{A,D\}$ است.</p>`,
mis:['«نرمال‌سازی یعنی جدول‌های بیشتر.» ← یعنی حذف افزونگی ناشی از FDهای نامناسب.','«FD را از روی داده‌ی فعلی استخراج می‌کنیم.» ← FD یک قید معنایی است؛ داده‌ی فعلی فقط می‌تواند آن را رد کند نه اثبات.','«ER همان جدول است.» ← ER مفهومی است و نگاشت لازم دارد.'],
ex:[{t:'mcq',l:1,q:'رابطه‌ی «دانشجو در چند درس ثبت‌نام می‌کند و هر درس چند دانشجو دارد» چگونه پیاده‌سازی می‌شود؟',o:['یک FK در Student','یک FK در Course','جدول واسط Enrollment','یک ستون لیست'],a:2,e:'N:M با جدول واسط و دو FK.'},
{t:'mcq',l:2,q:'در رابطه‌ی $R(A,B,C)$ با FDهای $A\\to B$ و $B\\to C$، بستار $\\{A\\}^+$ چیست؟',o:['$\\{A\\}$','$\\{A,B\\}$','$\\{A,B,C\\}$','$\\{B,C\\}$'],a:2,e:'$A\\to B$ سپس $B\\to C$ (تعدی) ⇒ $\\{A,B,C\\}$؛ پس $A$ کلید است.'},
{t:'tf',l:2,q:'ناهنجاری درج یعنی نتوان بخشی از اطلاعات را بدون وجود اطلاعات نامرتبط دیگر ثبت کرد.',a:true,e:'مثال: ثبت استاد جدید بدون هیچ درسی.'},
{t:'think',l:3,q:'برای رابطه‌ی $R(S,C,I)$ با FDهای $SC\\to I$ و $I\\to C$ کلیدهای کاندید را بیابید.',a:'$\\{S,C\\}^+=\\{S,C,I\\}$ پس $SC$ کلید است. $\\{S,I\\}^+$: از $I\\to C$ ⇒ $\\{S,I,C\\}$ پس $SI$ هم کلید کاندید است. هر دو کمینه‌اند. بنابراین کلیدها: $\\{S,C\\}$ و $\\{S,I\\}$. جالب: این رابطه 3NF است (همه‌ی صفات Prime‌اند) ولی BCNF نیست چون $I\\to C$ با $I$ ابرکلید نیست.'}],
sum:['ER مفهومی را به جدول‌ها و FKها نگاشت می‌کنیم؛ N:M ⇒ جدول واسط.','FDها (و بستار) پایه‌ی تشخیص افزونگی و کلیدها هستند.','ناهنجاری‌های درج/حذف/به‌روزرسانی انگیزه‌ی نرمال‌سازی‌اند.']});

LESSONS.push({id:'b4-2',mod:'B',g:'B4',t:'نرمال‌سازی (1NF تا BCNF) و Denormalization',en:'Normalization 1NF–BCNF & Denormalization',lvl:3,min:50,pre:['b4-1'],kw:'normalization 1nf 2nf 3nf bcnf denormalization lossless join dependency preservation design trade off',
obj:['شرایط 1NF، 2NF، 3NF و BCNF را بیان و جدول‌ها را گام‌به‌گام نرمال کنید.','تجزیه‌ی بی‌اتلاف (Lossless Join) و حفظ وابستگی را بدانید.','موارد درست Denormalization و موازنه‌ی آن را تحلیل کنید.'],
body:R`
<h2>فرم‌های نرمال</h2>
${ft(['فرم','شرط','حذف می‌کند'],[['1NF','همه‌ی مقادیر اتمیک؛ بدون گروه‌های تکرارشونده','لیست‌ها و ستون‌های چندمقداری'],['2NF','1NF + هیچ صفت غیرکلیدی به <b>بخشی</b> از کلید مرکب وابسته نباشد','وابستگی جزئی (Partial)'],['3NF','2NF + هیچ وابستگی <b>تراگذر</b> صفت غیرکلید به کلید نباشد؛ یا برای هر $X\\to A$: $X$ ابرکلید یا $A$ صفت اصلی (Prime)','وابستگی تراگذر'],['BCNF','برای هر FD غیربدیهی $X\\to Y$، $X$ ابرکلید باشد','باقی‌مانده‌ی ناهنجاری‌های ناشی از کلیدهای کاندید هم‌پوشان']])}
<p>خلاصه‌ی ماندگار برای 3NF: «هر صفت غیرکلید به <i>کلید، تمام کلید و هیچ چیز جز کلید</i> وابسته است.» BCNF قوی‌تر از 3NF است: $\text{BCNF}\subset\text{3NF}\subset\text{2NF}\subset\text{1NF}$.</p>
<h3>مثال گام‌به‌گام</h3>
${wd('normstep','نرمال‌سازی جدول ثبت‌نام: از 0NF تا 3NF')}
<h2>تجزیه‌ی درست</h2>
<ul><li><b>Lossless Join (بی‌اتلاف):</b> Join تجزیه‌ها باید دقیقاً رابطه‌ی اصلی را بدهد (بدون سطر جعلی). شرط برای تجزیه به $R_1,R_2$: $(R_1\cap R_2)\to R_1$ یا $(R_1\cap R_2)\to R_2$ (اشتراک، کلید یکی از دو طرف باشد).</li><li><b>Dependency Preserving:</b> FDها بتوانند بدون Join بررسی شوند. تجزیه به 3NF همیشه هر دو را تضمین می‌کند؛ تجزیه به BCNF همیشه بی‌اتلاف است ولی ممکن است برخی FDها را حفظ نکند (مثلاً مثال $SC\to I,\ I\to C$).</li></ul>
${wd('fdtool','آزمایش: فرم نرمال را با FDهای مختلف تعیین کنید')}
<h2>Denormalization (نرمال‌زدایی)</h2>
<p>گاهی عمداً افزونگی اضافه می‌کنیم تا <b>خواندن</b> سریع‌تر شود: ذخیره‌ی مجموع سفارش در جدول سفارش، کپی نام مشتری در جدول فاکتور (برای حفظ تاریخچه!)، جدول‌های خلاصه (Materialized View)، جداول Star Schema در انبار داده. هزینه‌ها: <b>نوشتن پیچیده‌تر</b>، خطر ناسازگاری، حافظه‌ی بیشتر. استفاده‌ی درست: ابتدا نرمال طراحی و اندازه‌گیری کنید؛ فقط گلوگاه‌های واقعی خواندن را با کنترل (Trigger، Materialized View، یا لایه‌ی برنامه) denormalize کنید.</p>
${ft(['','نرمال','Denormalized'],[['خواندن','Join لازم','سریع‌تر (کمتر Join)'],['نوشتن','ساده و بدون افزونگی','باید چند جا به‌روز شود'],['ناسازگاری','کم','ریسک بالا'],['حافظه','کمتر','بیشتر'],['مناسب','OLTP','OLAP، گزارش‌گیری، Read-Heavy']])}`,

body:R`
<h2>۱. چرا ایندکس؟</h2>
<p>بدون ایندکس، پیدا کردن سطرهای <code>WHERE email = ?</code> به <b>اسکن کامل</b> جدول نیاز دارد: $\Theta(n)$ صفحه خوانده می‌شود. <b>ایندکس</b> ساختار کمکی جداگانه‌ای است که کلیدها را مرتب نگه می‌دارد و به محل سطر اشاره می‌کند، مثل فهرست انتهای کتاب. ایندکس رایگان نیست: <b>حافظه</b> می‌خورد و <b>هر INSERT/UPDATE/DELETE</b> باید ایندکس را هم به‌روز کند.</p>
<h2>۲. هزینه‌ی واقعی: صفحه‌ها، نه سطرها</h2>
<p>دیسک (و SSD) داده را در <b>صفحه‌های</b> ثابت (معمولاً ۴–۱۶ کیلوبایت) می‌خواند. هزینه‌ی غالب یک پرس‌وجو تعداد صفحه‌هایی است که باید وارد حافظه شوند، نه تعداد مقایسه‌ها. یک BST دودویی متعادل با ۱۰۸ کلید ≈ ۲۷ سطح دارد و هر سطح می‌تواند یک خواندن تصادفی باشد. اگر هر گره یک صفحه‌ی کامل با صدها کلید باشد (<b>fan-out</b> $F\approx200$)، ارتفاع $\log_F n\approx4$ است!</p>
${wd('treeheight','ارتفاع BST دودویی در برابر B+Tree')}
<h2>۳. B-Tree و B+Tree</h2>
<p><b>B-Tree (مرتبه‌ی $m$)</b> درخت جست‌وجوی چندشاخه و متعادل است: هر گره حداکثر $m$ فرزند و ($m-1$ کلید) دارد، هر گره داخلی (غیر ریشه) حداقل $\lceil m/2\rceil$ فرزند، و <b>همه‌ی برگ‌ها در یک عمق‌اند</b> (به‌خلاف BST، رشد از «پایین» نیست بلکه با Split و رشد ریشه). ارتفاع $O(\log_{m/2}n)$.</p>
<p><b>B+Tree</b> (نوع رایج در DBMSها) دو تفاوت دارد: (۱) <b>داده/اشاره‌گر سطر فقط در برگ‌هاست</b> و گره‌های داخلی فقط «کلید جداکننده» دارند، پس fan-out بالاتر و ارتفاع کمتر می‌شود؛ (۲) <b>برگ‌ها با لیست پیوندی به هم وصل‌اند</b> پس پرس‌وجوی بازه‌ای (<code>BETWEEN</code>، <code>ORDER BY</code>) پس از یافتن شروع، با پیمایش خطی برگ‌ها انجام می‌شود.</p>
${wd('bptree','B+Tree تعاملی: درج، Split، جست‌وجو و Range Scan')}
<h3>عملیات</h3>
<ul><li><b>جست‌وجو:</b> از ریشه، در هر گره با مقایسه‌ی کلید (جست‌وجوی دودویی درون گره) فرزند مناسب را انتخاب کن؛ $h$ صفحه خوانده می‌شود: $O(\log_F n)$.</li><li><b>درج:</b> برگ مناسب را بیاب و کلید را درج کن. اگر برگ سرریز شد (بیش از ظرفیت)، <b>Split</b>: نیمی از کلیدها به گره‌ی جدید می‌رود و کلید جداکننده به والد افزوده می‌شود (این ممکن است زنجیروار به بالا برسد و در نهایت ریشه‌ی جدید و افزایش ارتفاع بسازد). نتیجه: درخت همیشه متعادل است.</li><li><b>حذف:</b> پس از حذف اگر گره کمتر از حداقل پر شد، <b>Redistribute</b> (قرض از همسایه) یا <b>Merge</b> (ادغام). (پیاده‌سازی‌های واقعی گاهی ادغام را به‌تأخیر می‌اندازند.)</li></ul>

body:R`
<h2>۱. ایندکس چندستونی (Composite)</h2>
<p>ایندکس روی $(a,b,c)$ مرتب‌شده‌ی <i>لغت‌نامه‌ای</i> است: ابتدا بر $a$، سپس در هر $a$ بر $b$ و ... بنابراین فقط برای <b>پیشوندهای چپ</b> ($a$ یا $a,b$ یا $a,b,c$) seek می‌کند. شرط برابری روی ستون‌های اول و حداکثر <i>یک</i> شرط بازه (آخرین ستون قابل‌استفاده) بهترین حالت است؛ ستون‌های بعد از شرط بازه فقط filter می‌شوند. قاعده‌ی تجربی ترتیب ستون: <b>برابری‌ها اول، سپس بازه، سپس ORDER BY</b> و ستون با Selectivity بالاتر معمولاً جلوتر.</p>
${wd('idxsel','ترتیب ستون‌ها و استفاده از ایندکس چندستونی')}
<h2>۲. ایندکس پوشاننده (Covering) و Index-Only Scan</h2>
<p>اگر همه‌ی ستون‌های موردنیاز پرس‌وجو در خود ایندکس باشند (مثلاً <code>CREATE INDEX ON t(a, b) INCLUDE (c)</code>)، DBMS لازم نیست به صفحات جدول برود: <b>Index-Only Scan</b>. این دسترسی تصادفی دوم را حذف می‌کند ولی ایندکس را بزرگ‌تر می‌کند.</p>
<h2>۳. انواع دیگر ایندکس</h2>
${ft(['نوع','ویژگی','مناسب','نامناسب'],[['B+Tree','مرتب؛ تساوی، بازه، ORDER BY، پیشوند','پیش‌فرض اکثر موارد','—'],['Hash Index','فقط تساوی در $O(1)$؛ بدون ترتیب','جست‌وجوی کلید دقیق (مثل در Memory engines)','بازه، ORDER BY، پیشوند'],['Bitmap','برای ستون‌های کم‌مقدار (جنسیت، وضعیت)','انبار داده، ترکیب شرایط با AND/OR','OLTP با نوشتن زیاد'],['GIN/Inverted','کلمه ← فهرست اسناد','جست‌وجوی متن، JSONB، آرایه','—'],['GiST/R-Tree','داده‌ی مکانی/بازه‌ای','نقشه، نزدیک‌ترین نقطه','—'],['Partial / Expression','فقط زیرمجموعه یا مقدار محاسبه‌شده','<code>WHERE active</code>، <code>LOWER(email)</code>','—']])}
<h2>۴. موتورهای ذخیره‌سازی (Storage Engines)</h2>
<p>موتور ذخیره‌سازی نحوه‌ی نگه‌داری و دسترسی به داده را تعیین می‌کند (MySQL چند موتور قابل‌انتخاب دارد). دو خانواده‌ی اصلی ساختار ذخیره:</p>
<ul><li><b>مبتنی بر B+Tree (به‌روزرسانی درجا):</b> InnoDB، PostgreSQL (heap + B-Tree)، SQL Server. خواندن سریع و قابل‌پیش‌بینی؛ نوشتن‌های تصادفی و تکه‌تکه‌شدن.</li><li><b>LSM-Tree (Log-Structured Merge):</b> RocksDB، Cassandra، LevelDB. نوشتن‌ها ابتدا در MemTable و WAL، سپس به‌صورت فایل‌های مرتب‌شده‌ی تغییرناپذیر (SSTable) روی دیسک ریخته و در پس‌زمینه <b>Compaction</b> می‌شوند. نوشتن ترتیبی سریع؛ خواندن ممکن است چند فایل را بخواند (کاهش با Bloom Filter) و Write Amplification ناشی از Compaction دارد.</li></ul>
<ul><li><b>ذخیره‌سازی سطری در برابر ستونی:</b> ستونی (Parquet، ClickHouse، Redshift) برای تجمیع روی چند ستون از میلیاردها سطر؛ سطری برای واکشی کامل یک سطر و نوشتن‌های OLTP.</li></ul>
${wd('rowcol','ذخیره‌سازی سطری در برابر ستونی: کدام صفحه‌ها خوانده می‌شوند؟')}
<h3>موازنه‌ی خواندن و نوشتن (RUM Conjecture)</h3>
<p>نمی‌توان هم‌زمان خواندن، نوشتن و حافظه (Read, Update, Memory overhead) را بهینه کرد؛ بهبود یکی به قیمت دیگری است. B+Tree خواندن را بهتر و LSM نوشتن را بهتر می‌کند.</p>`,

LESSONS.push({id:'b6-1',mod:'B',g:'B6',t:'تراکنش‌ها، ACID و سطوح انزوا',en:'Transactions, ACID & Isolation Levels',lvl:3,min:55,pre:['b3-1'],kw:'transaction acid atomicity consistency isolation durability isolation level dirty read non repeatable phantom serializable begin commit rollback',
obj:['خواص ACID را با مثال توضیح دهید.','چرخه‌ی حیات تراکنش را شرح دهید.','ناهنجاری‌های Dirty، Non-Repeatable و Phantom Read را با سطوح انزوا مرتبط کنید.'],
body:R`
<h2>۱. تراکنش چیست؟</h2>
<p><b>تراکنش (Transaction)</b> دنباله‌ای از عملیات است که از دید بیرون یک واحد منطقی «همه یا هیچ» است. مثال انتقال ۱۰۰ واحد از حساب A به B:</p>
<pre data-l="sql">
BEGIN;
UPDATE accounts SET balance = balance - 100 WHERE id = 'A';
UPDATE accounts SET balance = balance + 100 WHERE id = 'B';
COMMIT;      -- یا ROLLBACK در صورت خطا
</pre>
<h2>۲. خواص ACID</h2>
${ft(['خاصیت','معنی','سازوکار اصلی'],[['<b>A</b>tomicity (اتمیک‌بودن)','یا همه‌ی تغییرات اعمال می‌شود یا هیچ‌کدام','Undo Log / Rollback'],['<b>C</b>onsistency (سازگاری)','تراکنش پایگاه را از یک حالت معتبر (قیود برقرار) به حالت معتبر دیگر می‌برد','قیدها + منطق برنامه؛ نتیجه‌ی بقیه‌ی خواص'],['<b>I</b>solation (انزوا)','تراکنش‌های هم‌زمان طوری اجرا شوند که انگار پشت‌سرهم بوده‌اند (درجات مختلف)','قفل‌گذاری / MVCC'],['<b>D</b>urability (دوام)','پس از COMMIT، داده با خرابی هم از بین نمی‌رود','Write-Ahead Log + fsync']])}
<p><b>چرخه‌ی حیات:</b> Active ← Partially Committed ← Committed؛ در صورت خطا Failed ← Aborted (Rollback). پس از Aborted، سیستم می‌تواند تراکنش را مجدداً اجرا (Retry) یا خاتمه دهد.</p>
<h2>۳. همزمانی و ناهنجاری‌ها</h2>
<ul><li><b>Dirty Read:</b> خواندن داده‌ی commit‌نشده‌ی تراکنش دیگر که ممکن است Rollback شود.</li><li><b>Non-Repeatable Read:</b> یک سطر در همان تراکنش دو بار خوانده و دو مقدار متفاوت دیده می‌شود (چون تراکنش دیگر در میان commit کرده).</li><li><b>Phantom Read:</b> یک پرس‌وجوی بازه‌ای/شرطی دو بار اجرا و مجموعه‌ی سطرها (سطر جدید) عوض می‌شود.</li><li><b>Lost Update:</b> دو تراکنش مقدار قدیمی را می‌خوانند و هر کدام روی آن می‌نویسند؛ یکی از به‌روزرسانی‌ها گم می‌شود. <b>Write Skew:</b> دو تراکنش داده‌های مجزا ولی وابسته را می‌نویسند و قید منطقی نقض می‌شود (مثلاً دو پزشک هم‌زمان مرخصی می‌گیرند و هیچ‌کس on-call نمی‌ماند).</li></ul>
<h2>۴. سطوح انزوا (SQL استاندارد)</h2>
${wd('isolation','شبیه‌ساز سطوح انزوا و ناهنجاری‌ها')}
${ft(['سطح','Dirty','Non-Repeatable','Phantom'],[['Read Uncommitted','ممکن','ممکن','ممکن'],['Read Committed (پیش‌فرض PostgreSQL، Oracle)','جلوگیری','ممکن','ممکن'],['Repeatable Read (پیش‌فرض MySQL InnoDB)','جلوگیری','جلوگیری','طبق استاندارد ممکن؛ در MVCC معمولاً جلوگیری'],['Serializable','جلوگیری','جلوگیری','جلوگیری']])}
<pre data-l="sql">
SET TRANSACTION ISOLATION LEVEL REPEATABLE READ;
BEGIN;
SELECT balance FROM accounts WHERE id = 'A';   -- snapshot ثابت
-- ...
COMMIT;
</pre>
${co('warn','سطح بالاتر = هزینه‌ی بالاتر','Serializable انزوای کامل را با قفل‌گذاری بیشتر یا تشخیص تداخل (SSI) و احتمال abort به‌ازای خطای <code>serialization_failure</code> می‌دهد؛ برنامه باید آماده‌ی <b>Retry</b> باشد. «پیش‌فرض» هر DBMS متفاوت است و جزئیات Repeatable Read هم (Snapshot Isolation در مقابل قفل‌های Gap) وابسته‌ی پیاده‌سازی است.')}`,
mis:['«Consistency در ACID همان Consistency در CAP است.» ← مفهوم متفاوت: یکپارچگی قیود در برابر هم‌ارزی نسخه‌ها.','«Serializable یعنی تراکنش‌ها واقعاً یکی‌یکی اجرا می‌شوند.» ← یعنی نتیجه معادل یک ترتیب سریالی است، اجرا همچنان هم‌زمان است.','«Read Committed مانع Lost Update است.» ← نه؛ نیاز به قفل صریح (<code>SELECT … FOR UPDATE</code>) یا کنترل نسخه.'],
ex:[{t:'mcq',l:1,q:'کدام خاصیت ACID توسط Write-Ahead Log تضمین می‌شود؟',o:['Atomicity و Durability','فقط Isolation','فقط Consistency','هیچ‌کدام'],a:0,e:'WAL با Undo (اتمیک‌بودن) و Redo/flush هنگام commit (دوام).'},
{t:'mcq',l:2,q:'تراکنش T1 مقداری را می‌خواند، T2 آن را تغییر و commit می‌کند و T1 دوباره می‌خواند و مقدار جدید می‌بیند. این چیست؟',o:['Dirty Read','Non-Repeatable Read','Phantom Read','Lost Update'],a:1,e:'همان سطر دو مقدار متفاوت (بین دو خواندن commit رخ داده).'},
{t:'tf',l:2,q:'در سطح Read Committed، Dirty Read رخ نمی‌دهد ولی Non-Repeatable Read ممکن است.',a:true,e:'هر دستور فقط داده‌های commit‌شده را می‌بیند اما دستورهای مختلف یک تراکنش می‌توانند commitهای تازه را ببینند.'},
{t:'think',l:3,q:'مثال Write Skew (دو پزشک on-call) را توضیح دهید و بگویید کدام سطح/ابزار آن را جلوگیری می‌کند.',a:'قید: حداقل یک پزشک on-call باشد. T1 و T2 هر دو می‌خوانند «۲ پزشک on-call‌اند» و هر کدام فقط سطر خودش را off-call می‌کند. چون سطرهای نوشته‌شده متفاوت‌اند، Snapshot Isolation تداخل نمی‌بیند و هر دو commit می‌شوند ⇒ هیچ پزشکی on-call نمی‌ماند. راه‌حل‌ها: سطح Serializable (SSI/قفل محمول)، قفل صریح روی مجموعه‌ی خوانده‌شده (<code>SELECT … FOR UPDATE</code> روی همه‌ی سطرهای on-call)، یا یک قید/ماتریالیزه‌شده که تداخل را به یک سطر مشترک تبدیل کند.'}],
sum:['ACID: اتمیک‌بودن، سازگاری، انزوا، دوام.','ناهنجاری‌ها: Dirty، Non-Repeatable، Phantom (به‌علاوه‌ی Lost Update و Write Skew).','سطوح انزوا ← موازنه‌ی همزمانی و درستی؛ رفتار دقیق وابسته به DBMS.']});

LESSONS.push({id:'b6-2',mod:'B',g:'B6',t:'قفل‌گذاری، Deadlock، MVCC و کنترل همزمانی خوش‌بینانه/بدبینانه',en:'Locking, Deadlocks, MVCC & Optimistic vs Pessimistic Control',lvl:3,min:55,pre:['b6-1'],kw:'locking two phase locking 2pl deadlock mvcc snapshot isolation optimistic pessimistic select for update version',
obj:['قفل‌های S/X و پروتکل 2PL را توضیح دهید.','Deadlock را تشخیص و پیشگیری کنید.','MVCC و کنترل خوش‌بینانه را با قفل‌گذاری بدبینانه مقایسه کنید.'],
body:R`
<h2>۱. کنترل همزمانی بدبینانه: قفل‌گذاری</h2>
<p><b>قفل اشتراکی (Shared, S)</b> برای خواندن (چند خواننده هم‌زمان) و <b>قفل انحصاری (Exclusive, X)</b> برای نوشتن. ماتریس سازگاری: S با S سازگار است؛ X با هیچ‌چیز. گستره‌ی قفل: سطر، صفحه، جدول (<i>Lock Granularity</i> — قفل ریزتر همزمانی بیشتر ولی سربار بیشتر).</p>
<p><b>پروتکل دوفازی (2PL):</b> هر تراکنش ابتدا فقط قفل می‌گیرد (فاز رشد) و پس از اولین آزادسازی دیگر نمی‌تواند قفل بگیرد (فاز انقباض). 2PL <b>Serializability</b> را تضمین می‌کند. <b>Strict 2PL</b> قفل‌های X را تا پایان تراکنش نگه می‌دارد تا از Cascading Abort و Dirty Read جلوگیری کند (در عمل رایج است).</p>
<pre data-l="sql">
BEGIN;
SELECT * FROM accounts WHERE id = 1 FOR UPDATE;   -- قفل X روی سطر
UPDATE accounts SET balance = balance - 100 WHERE id = 1;
COMMIT;                                            -- آزادسازی قفل‌ها
</pre>
<h2>۲. بن‌بست (Deadlock)</h2>
<p>وقتی چند تراکنش به‌صورت چرخه‌ای منتظر قفل‌های یکدیگرند. چهار شرط لازم کافمن: انحصار متقابل، نگه‌داشتن و انتظار، عدم پس‌گیری، انتظار چرخه‌ای. <b>تشخیص:</b> ساخت <i>گراف انتظار (Wait-For Graph)</i> و جست‌وجوی دور؛ DBMS یکی از تراکنش‌ها را قربانی (Victim) و Rollback می‌کند. <b>پیشگیری:</b> ترتیب ثابت قفل‌گیری، تراکنش‌های کوتاه، قفل‌گذاری هم‌زمان همه‌ی منابع، Timeout، یا طرح‌های Wait-Die/Wound-Wait بر پایه‌ی زمان‌برچسب.</p>
${wd('deadlock','Deadlock و گراف انتظار؛ پیشگیری با ترتیب ثابت قفل‌گیری')}
<h2>۳. MVCC — کنترل همزمانی چندنسخه‌ای</h2>
<p>به‌جای جلوگیری از خواندن هنگام نوشتن، DBMS <b>چند نسخه</b> از هر سطر نگه می‌دارد. هر نسخه برچسب تراکنش سازنده (<code>xmin</code>) و تراکنش حذف‌کننده (<code>xmax</code>) دارد. هر تراکنش یک <b>Snapshot</b> می‌گیرد و فقط نسخه‌هایی را می‌بیند که تا آن لحظه commit شده‌اند. نتیجه: <b>خواننده‌ها نویسنده‌ها را مسدود نمی‌کنند و برعکس.</b> هزینه: حافظه برای نسخه‌های قدیمی و <b>پاک‌سازی</b> آن‌ها (VACUUM در PostgreSQL؛ Undo Log و Purge در InnoDB)، و تداخل نوشتن‌نوشتن همچنان نیاز به قفل دارد.</p>
${wd('mvcc','زنجیره‌ی نسخه‌های MVCC و دید Snapshot')}
<h2>۴. کنترل خوش‌بینانه (Optimistic)</h2>
<p>فرض می‌کند تداخل نادر است: تراکنش بدون قفل کار می‌کند و هنگام commit بررسی می‌کند چیزی که خوانده تغییر نکرده باشد؛ در غیر این صورت Abort و Retry. پیاده‌سازی رایج در برنامه: ستون <code>version</code>:</p>
<pre data-l="sql">
UPDATE products SET stock = stock - 1, version = version + 1
WHERE id = 7 AND version = 12;     -- اگر 0 سطر تغییر کرد ⇒ تداخل شد، دوباره بخوان و تلاش کن
</pre>
${ft(['','بدبینانه (قفل)','خوش‌بینانه (OCC/Version)'],[['فرض','تداخل زیاد است','تداخل نادر است'],['هزینه‌ی تداخل','انتظار (Blocking)','Abort و تکرار'],['مناسب برای','Contention بالا (حساب بانکی داغ)','Contention پایین، خواندن‌محور'],['خطر','Deadlock، کاهش throughput','Livelock/تکرارهای مکرر']])}`,
mis:['«MVCC یعنی قفل لازم نیست.» ← نوشتن‌نوشتن همچنان قفل می‌خواهد.','«Deadlock باگ DBMS است.» ← نتیجه‌ی طبیعی قفل‌گذاری است؛ برنامه باید Retry را مدیریت کند.','«Optimistic Locking همیشه سریع‌تر است.» ← در تداخل زیاد Abortهای مکرر بدتر است.'],
ex:[{t:'mcq',l:1,q:'کدام جفت قفل سازگارند؟',o:['S و S','S و X','X و X','هیچ‌کدام'],a:0,e:'چند خواننده هم‌زمان مجازند؛ X با همه‌چیز ناسازگار است.'},
{t:'tf',l:2,q:'در MVCC خواننده‌ها معمولاً نویسنده‌ها را مسدود نمی‌کنند.',a:true,e:'خواننده نسخه‌ی قدیمی مربوط به Snapshot خود را می‌بیند.'},
{t:'mcq',l:2,q:'کدام راهکار Deadlock را به‌طور مؤثر پیشگیری می‌کند؟',o:['قفل‌گیری منابع با ترتیب سراسری ثابت','افزایش اندازه‌ی Buffer Pool','حذف ایندکس‌ها','تراکنش‌های طولانی‌تر'],a:0,e:'ترتیب ثابت، چرخه‌ی انتظار را غیرممکن می‌کند.'},
{t:'think',l:3,q:'پیاده‌سازی «کاهش موجودی کالا» را به دو روش بدبینانه و خوش‌بینانه نشان دهید و بگویید در چه شرایطی هر کدام ترجیح دارد.',a:'بدبینانه: <code>BEGIN; SELECT stock FROM products WHERE id=7 FOR UPDATE; UPDATE products SET stock=stock-1 WHERE id=7; COMMIT;</code> ؛ خوش‌بینانه: <code>UPDATE products SET stock=stock-1 WHERE id=7 AND stock>0</code> (یک دستور اتمیک) یا با ستون version و Retry. برای کالای پرفروش با رقابت شدید، همان UPDATE اتمیک یا قفل کوتاه مناسب است؛ برای رقابت کم (ویرایش پروفایل توسط کاربر) روش خوش‌بینانه (بدون نگه‌داشتن قفل در زمان تفکر کاربر) بهتر است.'}],
sum:['قفل S/X و 2PL (به‌ویژه Strict 2PL) سریالی‌بودن را می‌دهد ولی Deadlock ممکن است.','Deadlock با گراف انتظار تشخیص و با ترتیب ثابت قفل‌گیری پیشگیری می‌شود.','MVCC چند نسخه نگه می‌دارد تا خواننده/نویسنده یکدیگر را مسدود نکنند؛ OCC به‌جای قفل، هنگام commit تداخل را بررسی می‌کند.']});

LESSONS.push({id:'b7-1',mod:'B',g:'B7',t:'Replication، Sharding، Partitioning و CAP',en:'Replication, Sharding, Partitioning, CAP & Consistency',lvl:3,min:60,pre:['b6-1'],kw:'replication sharding partitioning consistent hashing cap theorem pacelc consistency model eventual strong leader follower scalability',
obj:['انواع تکثیر (همزمان/ناهمزمان، Leader-Follower) را مقایسه کنید.','Sharding و Partitioning را تمایز دهید و Consistent Hashing را توضیح دهید.','قضیه‌ی CAP، PACELC و مدل‌های سازگاری را با مثال تفسیر کنید.'],
body:R`
<h2>۱. مقیاس‌پذیری</h2>
<p><b>مقیاس عمودی (Scale-Up)</b> ماشین قوی‌تر؛ ساده ولی سقف دارد. <b>مقیاس افقی (Scale-Out)</b> افزودن ماشین‌ها؛ پیچیده (توزیع داده، سازگاری) ولی تقریباً نامحدود. سه ابزار: تکثیر (برای دسترس‌پذیری و مقیاس خواندن)، پارتیشن‌بندی/شاردینگ (برای مقیاس نوشتن و حجم)، و کش.</p>
<h2>۲. تکثیر (Replication)</h2>
<ul><li><b>Leader-Follower (Primary-Replica):</b> همه‌ی نوشتن‌ها روی Leader و لاگ به Followerها ارسال می‌شود؛ خواندن می‌تواند روی Followerها برود.</li><li><b>Synchronous:</b> Leader تا تأیید replica منتظر می‌ماند ⇒ دوام و سازگاری قوی‌تر، تأخیر بیشتر و کاهش دسترس‌پذیری. <b>Asynchronous:</b> سریع ولی <b>Replication Lag</b> (خواندن مقدار کهنه، از دست‌رفتن آخرین نوشتن‌ها هنگام خرابی Leader). <b>Semi-sync:</b> حداقل یک replica همگام.</li><li><b>Multi-Leader / Leaderless (Dynamo، Cassandra):</b> نوشتن روی چند گره، نیازمند حل تعارض (Last-Write-Wins، CRDT، Vector Clock) و Quorum: $R+W>N$ برای خواندن آخرین نوشتن.</li><li>مسائل: <b>Failover</b> خودکار (انتخاب Leader جدید، Split-Brain)، <b>Read-Your-Writes</b> پس از نوشتن.</li></ul>
<h2>۳. پارتیشن‌بندی و Sharding</h2>
<p><b>Partitioning:</b> تقسیم یک جدول بزرگ به قطعات کوچک‌تر (معمولاً در یک سرور) برای مدیریت و هرس پرس‌وجو: <i>Range</i> (بر اساس تاریخ)، <i>List</i>، <i>Hash</i>. <b>Sharding:</b> پارتیشن‌بندی افقی بین چند سرور مستقل؛ کلید شارد (Shard Key) تعیین می‌کند هر سطر کجا می‌رود. انتخاب بد کلید ⇒ <b>Hot Shard</b> (مثلاً timestamp که همه‌ی نوشتن‌ها را به آخرین شارد می‌فرستد). پرس‌وجوهای چندشاردی و Join و تراکنش‌های توزیع‌شده گران‌اند.</p>
<p>با <code>hash(key) mod N</code>، تغییر $N$ تقریباً همه‌ی کلیدها را جابه‌جا می‌کند. <b>Consistent Hashing</b> کلیدها و گره‌ها را روی یک حلقه‌ی هش قرار می‌دهد و هر کلید به اولین گره‌ی ساعت‌گرد می‌رود؛ با افزودن/حذف یک گره فقط کسر $\approx1/N$ کلیدها جابه‌جا می‌شود. گره‌های مجازی (vnodes) توزیع را یکنواخت می‌کنند.</p>
${wd('shard','mod N در برابر Consistent Hashing هنگام تغییر تعداد شاردها')}
<h2>۴. قضیه‌ی CAP و مدل‌های سازگاری</h2>
<p>در یک سیستم توزیع‌شده هنگام <b>Partition</b> شبکه (که اجتناب‌ناپذیر است) باید میان <b>Consistency</b> (هر خواندن آخرین نوشتن را ببیند — خطی‌پذیری) و <b>Availability</b> (هر درخواست پاسخ غیرخطا بگیرد) یکی را برگزید. «CAP» معمولاً به‌اشتباه «انتخاب ۲ از ۳» گفته می‌شود؛ درست‌تر: <i>اگر Partition رخ دهد، یا C یا A</i>. <b>PACELC</b> می‌افزاید: حتی بدون Partition (Else) میان <b>Latency</b> و <b>Consistency</b> موازنه هست.</p>
${wd('cap','شبیه‌ساز CAP با سه Replica')}

LESSONS.push({id:'b7-2',mod:'B',g:'B7',t:'OLTP/OLAP، Backup، Connection Pooling و Query Planning',en:'OLTP vs OLAP, Backup & Recovery, Connection Pooling, Query Planning',lvl:3,min:45,pre:['b7-1','b3-3'],kw:'oltp olap data warehouse star schema etl backup point in time recovery rpo rto connection pool prepared statement little law',

<h2>۱. OLTP در برابر OLAP</h2>
${ft(['','OLTP (تراکنشی)','OLAP (تحلیلی)'],[['بار کاری','تراکنش‌های کوتاه، نقطه‌ای: ثبت سفارش، پرداخت','پرس‌وجوهای سنگین تجمیعی روی حجم بزرگ'],['دسترسی','سطر کامل، خواندن/نوشتن کم‌حجم','چند ستون از میلیاردها سطر'],['ذخیره‌سازی','سطری، B+Tree، نرمال','ستونی، فشرده، Denormalized (Star/Snowflake)'],['اولویت','تأخیر کم، throughput تراکنش، ACID','throughput اسکن، تحلیل'],['نمونه','PostgreSQL, MySQL','Redshift, BigQuery, ClickHouse, Snowflake']])}
<p>معمولاً داده با فرایند <b>ETL/ELT</b> از OLTP به <b>انبار داده (Data Warehouse)</b> منتقل می‌شود. <b>Star Schema</b>: یک جدول <i>Fact</i> مرکزی (رویدادها/اندازه‌ها: فروش) متصل به جدول‌های <i>Dimension</i> (زمان، محصول، مشتری). تجمیع‌ها با Joinهای ساده و اسکن ستونی سریع می‌شوند. <b>HTAP</b> تلاش برای هر دو در یک سیستم است.</p>
${wd('rowcol','تفاوت چیدمان سطری و ستونی برای OLTP و OLAP')}
<h2>۲. بکاپ و بازیابی</h2>
<ul><li><b>Full / Incremental / Differential:</b> کامل، فقط تغییرات از آخرین بکاپ، تغییرات از آخرین Full.</li><li><b>منطقی (pg_dump) در برابر فیزیکی (کپی فایل‌ها + WAL):</b> فیزیکی سریع‌تر برای حجم بزرگ.</li><li><b>Point-in-Time Recovery (PITR):</b> بکاپ پایه + بایگانی پیوسته‌ی WAL ⇒ بازگشت به هر لحظه (مثلاً یک دقیقه قبل از DELETE اشتباه).</li><li><b>RPO</b> (Recovery Point Objective): حداکثر داده‌ای که می‌توان از دست داد (زمان). <b>RTO</b> (Recovery Time Objective): حداکثر زمان توقف قابل‌قبول.</li><li>بکاپی که <b>بازیابی آن آزمایش نشده</b> بکاپ نیست. قاعده‌ی ۳-۲-۱: ۳ نسخه، ۲ رسانه، ۱ خارج از سایت.</li></ul>
<h2>۳. Connection Pooling</h2>
<p>ساخت اتصال به پایگاه داده گران است (TCP، TLS، احراز هویت، و در PostgreSQL یک فرآیند جدید). <b>Connection Pool</b> تعدادی اتصال باز را نگه می‌دارد و بین درخواست‌ها قرض می‌دهد (HikariCP، PgBouncer). اندازه‌ی مناسب را با <b>قانون لیتل</b> تخمین بزنید: $L=\lambda W$ (تعداد هم‌زمان = نرخ ورود × زمان ماندن). Pool بزرگ‌تر بهتر نیست: CPU/دیسک پایگاه داده محدود است و تعداد زیاد اتصال فقط تعارض و حافظه می‌سازد.</p>
${wd('pool','محاسبه‌ی اندازه‌ی Pool')}
<h2>۴. Prepared Statements و کش طرح</h2>
<p><b>Prepared Statement</b> متن SQL را یک‌بار Parse/Plan می‌کند و با پارامترهای مختلف اجرا (<code>WHERE id = $1</code>)؛ هم سرعت می‌دهد و هم <b>SQL Injection</b> را خنثی می‌کند (پارامتر هرگز به‌عنوان کد تفسیر نمی‌شود). هشدار: «طرح عمومی» برای مقادیر با توزیع نابرابر ممکن است بهینه نباشد (Parameter Sniffing).</p>`,
mis:['«بکاپ داشتن یعنی replica داشتن.» ← replica اشتباه حذف را هم تکثیر می‌کند.','«هرچه Pool بزرگ‌تر، سریع‌تر.» ← بالاتر از ظرفیت CPU/IO، صف و سربار فقط بدتر می‌کند.','«OLAP را روی همان پایگاه OLTP اجرا کنیم مشکلی نیست.» ← پرس‌وجوهای سنگین OLTP را کند می‌کنند.'],
ex:[{t:'mcq',l:1,q:'کدام بار کاری برای ذخیره‌سازی ستونی مناسب‌تر است؟',o:['خواندن یک سطر کامل با PK','تجمیع مجموع فروش روی یک ستون از میلیاردها سطر','درج‌های تک‌سطری مکرر','به‌روزرسانی یک سطر'],a:1,e:'فقط ستون موردنیاز خوانده و فشرده می‌شود.'},
{t:'num',l:2,q:'سرویسی ۲۰۰ درخواست در ثانیه دارد و هر درخواست ۵۰ میلی‌ثانیه اتصال نگه می‌دارد. میانگین اتصال هم‌زمان لازم؟',a:10,tol:0,e:'$L=\\lambda W=200\\times0.05=10$.'},
{t:'tf',l:2,q:'Prepared Statement با پارامتر، یکی از مؤثرترین دفاع‌ها در برابر SQL Injection است.',a:true,e:'ورودی کاربر به‌عنوان مقدار پارامتر منتقل می‌شود نه تکه‌ای از متن SQL.'},
{t:'think',l:3,q:'سازمانی RPO=۵ دقیقه و RTO=۳۰ دقیقه می‌خواهد. معماری بکاپ/تکثیر پیشنهادی شما چیست؟',a:'RPO=۵ دقیقه یعنی بایگانی پیوسته‌ی WAL (فاصله‌ی ارسال کمتر از ۵ دقیقه یا تکثیر همزمان/نیمه‌همزمان) برای PITR؛ بکاپ پایه‌ی دوره‌ای (مثلاً شبانه) با فشرده‌سازی و نگه‌داری خارج از سایت. RTO=۳۰ دقیقه یعنی بازیابی از بکاپ برای حجم‌های بزرگ ممکن است کند باشد؛ بنابراین یک Replica آماده (Hot Standby) با Failover خودکار/نیمه‌خودکار، و آزمایش دوره‌ای بازیابی برای تأیید تحقق RTO. بکاپ‌ها برای خطاهای منطقی (حذف اشتباه) هم لازم‌اند.'}],

LESSONS.push({id:'b8-1',mod:'B',g:'B8',t:'صفحه‌های داده و Buffer Pool',en:'Data Pages & the Buffer Pool',lvl:3,min:40,pre:['b5-1'],kw:'buffer pool page slotted page heap file lru clock eviction dirty page hit ratio sequential flooding',
obj:['ساختار صفحه‌ی داده (Slotted Page) و فایل Heap را توضیح دهید.','نقش Buffer Pool، سیاست‌های جایگزینی و صفحه‌های کثیف را شرح دهید.','اثر Hit Ratio بر کارایی و پدیده‌ی Sequential Flooding را درک کنید.'],
body:R`
<h2>۱. سلسله‌مراتب ذخیره‌سازی و صفحه</h2>
<p>DBMS داده را روی دیسک و در بلوک‌های ثابت به نام <b>صفحه (Page)</b> (۸ کیلوبایت در PostgreSQL، ۱۶ در InnoDB) ذخیره و منتقل می‌کند. واحد I/O همین صفحه است نه سطر. هر صفحه یک شناسه (File, PageNo) دارد. یک جدول معمولاً یک <b>فایل Heap</b> از صفحه‌هاست و ایندکس‌ها فایل‌های دیگر.</p>
<h3>صفحه‌ی شیاردار (Slotted Page)</h3>
<p>سطرها طول متغیر دارند. در ساختار Slotted Page: <b>هدر</b> (شناسه، LSN آخرین تغییر، تعداد اسلات، فضای آزاد)، <b>آرایه‌ی اسلات</b> از ابتدا که به محل هر سطر اشاره می‌کند، و <b>سطرها</b> از انتهای صفحه به سمت وسط رشد می‌کنند؛ فضای آزاد بین آن‌هاست. شناسه‌ی سطر <b>RID = (PageNo, SlotNo)</b> است؛ جابه‌جایی سطر داخل صفحه فقط اسلات را عوض می‌کند و RID ثابت می‌ماند. سطرهای بسیار بزرگ (TOAST/Overflow) جدا ذخیره می‌شوند.</p>
<h2>۲. Buffer Pool</h2>
<p><b>Buffer Pool</b> ناحیه‌ای از RAM است که کپی صفحه‌های اخیر را نگه می‌دارد. درخواست صفحه: اگر در Pool بود (<b>Hit</b>) مستقیماً برگردانده می‌شود؛ وگرنه (<b>Miss</b>) از دیسک خوانده می‌شود و اگر جا نبود یک صفحه‌ی <b>قربانی (Victim)</b> انتخاب می‌شود؛ اگر کثیف (Dirty: تغییر کرده و روی دیسک نیامده) باشد باید قبل از حذف روی دیسک نوشته شود. صفحه‌ای که در حال استفاده است <b>Pin</b> می‌شود و حذف نمی‌شود.</p>
<p>اثر حیاتی: زمان دسترسی RAM ≈ ۱۰۰ نانوثانیه، SSD ≈ ۱۰۰ میکروثانیه (۱۰۰۰×)، HDD ≈ ۱۰ میلی‌ثانیه (۱۰۰٬۰۰۰×). با Hit Ratio برابر $h$، میانگین زمان دسترسی $h\cdot t_{RAM}+(1-h)\cdot t_{disk}$؛ بنابراین ۹۹٪ در برابر ۹۰٪ Hit یعنی تقریباً ۱۰ برابر کمتر Miss.</p>
<p><b>سیاست‌های جایگزینی:</b> LRU (کمترین استفاده‌ی اخیر)، Clock (تقریب ارزان LRU)، LRU-K / 2Q / ARC که مقاوم‌اند. مشکل LRU ساده: <b>Sequential Flooding</b> — یک Full Table Scan بزرگ همه‌ی صفحه‌های «داغ» را بیرون می‌ریزد. راه‌حل: استفاده از Ring Buffer کوچک برای اسکن‌های بزرگ (PostgreSQL) یا ناحیه‌ی «جوان/پیر» (InnoDB midpoint insertion).</p>
${wd('bufpool','شبیه‌ساز Buffer Pool با LRU')}
<p>نکته: DBMSها معمولاً Buffer Pool اختصاصی دارند و کش فایل سیستم‌عامل را دور می‌زنند (<code>O_DIRECT</code>) چون خودشان بهتر می‌دانند کدام صفحه ارزشمند است و باید ترتیب نوشتن‌ها (WAL) را کنترل کنند.</p>`,
mis:['«RAM بیشتر همیشه کارایی را زیاد می‌کند.» ← تا جایی که Working Set جا شود؛ پس از آن بازده کم می‌شود.','«سطر واحد خواندن از دیسک است.» ← صفحه است؛ خواندن یک بایت = خواندن یک صفحه.','«Dirty Page را باید فوراً روی دیسک نوشت.» ← تأخیر در نوشتن (با WAL) کارایی را بالا می‌برد.'],
ex:[{t:'num',l:1,q:'میانگین زمان دسترسی با Hit Ratio=۹۰٪، $t_{RAM}=0.0001$ ms و $t_{disk}=1$ ms چند میلی‌ثانیه است؟',a:0.10009,tol:0.0001,e:'$0.9\\times0.0001+0.1\\times1=0.00009+0.1=0.10009$ ms.'},
{t:'mcq',l:2,q:'Sequential Flooding چیست؟',o:['اسکن بزرگ صفحه‌های داغ را از Buffer Pool بیرون می‌ریزد','پر شدن دیسک','Deadlock','افزایش Hit Ratio'],a:0,e:'اسکن، صفحه‌هایی را وارد می‌کند که فقط یک‌بار استفاده می‌شوند و LRU صفحه‌های واقعاً داغ را حذف می‌کند.'},
{t:'tf',l:2,q:'در Slotted Page، RID یک سطر با جابه‌جایی آن داخل همان صفحه تغییر نمی‌کند.',a:true,e:'RID = (صفحه، اسلات)؛ فقط محتوای اسلات به محل جدید اشاره می‌کند.'},

<h2>۱. مسئله</h2>
<p>برای سرعت، تغییرات اول در Buffer Pool (RAM) اعمال می‌شود. اگر پس از COMMIT برق برود و صفحه هنوز روی دیسک نیامده باشد، دوام نقض می‌شود؛ اگر صفحه‌ی یک تراکنش commit‌نشده روی دیسک رفته باشد، اتمیک‌بودن نقض می‌شود. چهار حالت بر اساس دو سیاست:</p>
${ft(['سیاست','معنی','نیاز'],[['<b>Steal</b>','Buffer Manager می‌تواند صفحه‌ی تراکنش commit‌نشده را روی دیسک بنویسد (برای آزادسازی حافظه)','Undo لازم است'],['<b>No-Steal</b>','هرگز نمی‌نویسد؛ ساده ولی حافظه‌ی زیاد','—'],['<b>No-Force</b>','هنگام commit لازم نیست صفحه‌های داده روی دیسک بروند (فقط لاگ)','Redo لازم است'],['<b>Force</b>','هنگام commit همه‌ی صفحه‌ها نوشته شوند؛ ساده ولی I/O تصادفی کند','—']])}
<p>DBMSهای واقعی <b>Steal + No-Force</b> را برای کارایی انتخاب می‌کنند و با <b>لاگ</b> هر دو مشکل را حل می‌کنند.</p>
<h2>۲. Write-Ahead Logging</h2>
<p><b>قاعده‌ی WAL:</b> (۱) رکورد لاگِ هر تغییر باید <u>پیش از</u> نوشتن صفحه‌ی تغییرداده‌شده روی دیسک پایدار شود (تضمین Undo)؛ (۲) همه‌ی رکوردهای لاگ یک تراکنش، <u>پیش از</u> پاسخ COMMIT باید روی دیسک پایدار باشد (تضمین Redo/دوام). نوشتن لاگ <b>ترتیبی (Append-only)</b> است و بسیار سریع‌تر از نوشتن تصادفی صفحه‌هاست (و با <code>fsync</code> پایدار می‌شود؛ <i>Group Commit</i> چند commit را در یک fsync جمع می‌کند).</p>
<p>هر رکورد لاگ شماره‌ی ترتیبی <b>LSN</b> دارد و شامل: شناسه‌ی تراکنش، صفحه، <b>before-image</b> (برای Undo) و <b>after-image</b> (برای Redo) یا فرم فیزیولوژیک است. هر صفحه LSN آخرین تغییرش را نگه می‌دارد تا Redo <b>idempotent</b> باشد.</p>
<h2>۳. Checkpoint</h2>
<p>بدون محدودیت، بازیابی باید کل لاگ را از ابتدا بازپخش کند. <b>Checkpoint</b> صفحه‌های کثیف را روی دیسک می‌نویسد (یا فهرستی از آن‌ها و تراکنش‌های فعال را در لاگ ثبت می‌کند) تا بازیابی فقط از آخرین Checkpoint شروع شود. موازنه: Checkpoint مکرر ⇒ بازیابی سریع ولی I/O پس‌زمینه بیشتر؛ نادر ⇒ برعکس. (<i>Fuzzy Checkpoint</i> بدون توقف تراکنش‌ها انجام می‌شود.)</p>
<h2>۴. بازیابی از خرابی (الگوی ARIES)</h2>
<ol><li><b>Analysis:</b> لاگ از آخرین Checkpoint خوانده می‌شود تا تراکنش‌های «برنده» (commit‌شده) و «بازنده» (فعال هنگام خرابی) و صفحه‌های کثیفِ احتمالی مشخص شوند.</li><li><b>Redo:</b> <i>تاریخچه تکرار می‌شود</i> — همه‌ی تغییرات لاگ (حتی تراکنش‌های بازنده) دوباره اعمال می‌شود (اگر LSN صفحه از LSN رکورد کمتر باشد). حالت دقیق لحظه‌ی خرابی بازسازی می‌شود.</li><li><b>Undo:</b> تغییرات تراکنش‌های بازنده با before-image، از آخر به اول برگردانده می‌شود (هر Undo خودش یک رکورد جبرانی CLR می‌نویسد تا خرابی حین بازیابی هم قابل‌تحمل باشد).</li></ol>

body:R`
<h2>۱. اسکالر، بردار، ماتریس، تانسور</h2>
<p><b>اسکالر</b> یک عدد است ($x\in\mathbb{R}$). <b>بردار</b> فهرست مرتب‌شده‌ای از $n$ عدد است: $\mathbf{x}\in\mathbb{R}^n$؛ هم‌زمان می‌تواند «نقطه» یا «پیکان از مبدأ» باشد و در ML معمولاً «بردار ویژگی» یک نمونه است. <b>ماتریس</b> $A\in\mathbb{R}^{m\times n}$ جدول مستطیلی با $m$ سطر و $n$ ستون است (مثلاً مجموعه‌داده‌ی $m$ نمونه با $n$ ویژگی، یا وزن‌های یک لایه). <b>تانسور</b> تعمیم به $k$ اندیس است: یک تصویر رنگی $H\times W\times3$، یک دسته‌ی تصویر $B\times H\times W\times C$، یا خروجی لایه‌ی Transformer با شکل $B\times T\times d$. تعداد اندیس‌ها را <b>مرتبه (Rank/Order)</b> می‌گویند؛ اسکالر مرتبه‌ی ۰، بردار ۱، ماتریس ۲.</p>
<h2>۲. عملیات بردارها</h2>
<p><b>جمع</b> مؤلفه‌به‌مؤلفه (هندسی: قاعده‌ی متوازی‌الاضلاع)، <b>ضرب در اسکالر</b> طول را مقیاس می‌دهد. <b>ضرب داخلی (Dot Product)</b>:</p>
$$\mathbf{a}\cdot\mathbf{b}=\sum_{i=1}^{n}a_ib_i=\|\mathbf{a}\|\,\|\mathbf{b}\|\cos\theta$$
<p><b>شهود:</b> $\mathbf{a}\cdot\mathbf{b}$ می‌گوید دو بردار چقدر «هم‌جهت»اند: مثبت (زاویه‌ی حاد)، صفر (<b>عمود/Orthogonal</b>)، منفی (زاویه‌ی باز). <b>اشتقاق فرمول کسینوسی:</b> از قانون کسینوس‌ها در مثلث با اضلاع $\mathbf a$، $\mathbf b$ و $\mathbf a-\mathbf b$: $\|\mathbf a-\mathbf b\|^2=\|\mathbf a\|^2+\|\mathbf b\|^2-2\|\mathbf a\|\|\mathbf b\|\cos\theta$. از طرفی $\|\mathbf a-\mathbf b\|^2=\|\mathbf a\|^2+\|\mathbf b\|^2-2\,\mathbf a\cdot\mathbf b$. مقایسه‌ی دو رابطه همان نتیجه را می‌دهد.</p>
<h3>نُرم (Norm)</h3>
$$\|\mathbf x\|_2=\sqrt{\sum x_i^2},\qquad \|\mathbf x\|_1=\sum|x_i|,\qquad \|\mathbf x\|_\infty=\max_i|x_i|,\qquad \|\mathbf x\|_p=\Big(\sum|x_i|^p\Big)^{1/p}$$
<p>نُرم، «اندازه» بردار است. نُرم $\ell_2$ طول اقلیدسی، $\ell_1$ فاصله‌ی منهتن (در Lasso تُنُکی ایجاد می‌کند)، $\ell_\infty$ بزرگ‌ترین مؤلفه است. فاصله‌ی دو نقطه $\|\mathbf a-\mathbf b\|$ است.</p>
<h3>تصویر (Projection)</h3>
<p>تصویر $\mathbf a$ روی راستای $\mathbf b$: بردار موازی $\mathbf b$ که $\mathbf a-\text{proj}$ بر $\mathbf b$ عمود است. اگر $\text{proj}=t\mathbf b$، شرط $(\mathbf a-t\mathbf b)\cdot\mathbf b=0$ می‌دهد $t=\frac{\mathbf a\cdot\mathbf b}{\mathbf b\cdot\mathbf b}$:</p>
$$\text{proj}_{\mathbf b}(\mathbf a)=\frac{\mathbf a\cdot\mathbf b}{\mathbf b\cdot\mathbf b}\,\mathbf b$$
${wd('vec2','زمین‌بازی بردارها: جمع، ضرب داخلی، زاویه، نُرم و تصویر')}
<p><b>مثال عددی:</b> $\mathbf a=(3,1)$ و $\mathbf b=(1,3)$: $\mathbf a\cdot\mathbf b=3+3=6$؛ $\|\mathbf a\|=\|\mathbf b\|=\sqrt{10}$؛ $\cos\theta=6/10=0.6\Rightarrow\theta\approx53.1^\circ$؛ تصویر: $\frac{6}{10}(1,3)=(0.6,1.8)$.</p>
<h2>۳. ضرب ماتریسی</h2>
<p>اگر $A\in\mathbb{R}^{m\times n}$ و $B\in\mathbb{R}^{n\times p}$ آنگاه $C=AB\in\mathbb{R}^{m\times p}$ با</p>
$$C_{ij}=\sum_{k=1}^{n}A_{ik}B_{kj}$$
<p>یعنی درایه‌ی $(i,j)$ برابر ضرب داخلی <b>سطر $i$ام $A$</b> در <b>ستون $j$ام $B$</b> است. شرط: ستون‌های $A$ = سطرهای $B$. خواص: شرکت‌پذیر ($(AB)C=A(BC)$)، توزیع‌پذیر، اما <b>جابه‌جاپذیر نیست</b> ($AB\ne BA$ در حالت کلی). تفسیرهای دیگر: ستون‌های $AB$ ترکیب‌های خطی از ستون‌های $A$ هستند؛ و $A\mathbf x$ ترکیب خطی ستون‌های $A$ با ضرایب $\mathbf x$ است. هزینه‌ی محاسباتی ضرب $m\times n$ در $n\times p$ برابر $mnp$ ضرب است.</p>
${wd('matmul','زمین‌بازی ضرب ماتریسی (روی خانه‌های C کلیک کنید)')}
<p><b>ترانهاده (Transpose):</b> $(A^T)_{ij}=A_{ji}$ و $(AB)^T=B^TA^T$. ضرب داخلی: $\mathbf a\cdot\mathbf b=\mathbf a^T\mathbf b$. ماتریس $A$ <b>متقارن</b> است اگر $A=A^T$.</p>
<h2>۴. فضای برداری، استقلال خطی و پایه</h2>
<p><b>ترکیب خطی</b> $\sum c_i\mathbf v_i$. <b>Span</b> مجموعه‌ی همه‌ی ترکیب‌های خطی. بردارها <b>مستقل خطی</b> اند اگر هیچ‌کدام ترکیب خطی بقیه نباشد (یعنی $\sum c_i\mathbf v_i=0\Rightarrow$ همه‌ی $c_i=0$). <b>پایه (Basis)</b> مجموعه‌ی مستقل خطی که کل فضا را می‌پوشاند؛ تعداد اعضای آن <b>بُعد</b> فضاست. مثلاً $\{(1,0),(0,1)\}$ پایه‌ی استاندارد $\mathbb{R}^2$ است ولی $\{(1,2),(2,4)\}$ مستقل نیستند و فقط یک خط را می‌پوشانند. اهمیت ML: ستون‌های وابسته در ماتریس ویژگی‌ها (هم‌خطی) باعث بی‌ثباتی رگرسیون می‌شود؛ و Embeddingها نقطه‌هایی در یک فضای برداری با پایه‌ی آموخته‌شده‌اند.</p>
<h2>۵. کاربرد در ML</h2>
<ul><li><b>نمونه = بردار ویژگی</b>، مجموعه‌داده = ماتریس $X\in\mathbb{R}^{m\times n}$.</li><li><b>لایه‌ی Dense:</b> $\mathbf y=W\mathbf x+\mathbf b$ یک ضرب ماتریس-بردار است؛ برای دسته‌ای از نمونه‌ها $Y=XW^T+\mathbf b$.</li><li><b>شباهت کسینوسی</b> $\frac{\mathbf a\cdot\mathbf b}{\|\mathbf a\|\|\mathbf b\|}$ در جست‌وجوی معنایی و Embedding.</li><li><b>نُرم‌ها:</b> $\ell_2$ در تابع زیان (MSE) و Weight Decay، $\ell_1$ در Lasso.</li></ul>`,
